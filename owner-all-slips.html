<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EGC — All Customer Slips</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#123}header{background:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dce6f0;position:sticky;top:0;z-index:5}.brand{font-size:20px;font-weight:bold;color:#07508c}.brand small{display:block;font-size:12px;color:#64748b;font-weight:normal;margin-top:4px}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:bold}.blue{background:#07508c;color:white}.red{background:#e32626;color:white}.wrap{max-width:1400px;margin:24px auto;padding:0 18px}h1{color:#063b68}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat,.card{background:white;border:1px solid #dce6f0;border-radius:12px;padding:16px}.stat span{display:block;color:#64748b;font-size:13px}.stat b{display:block;font-size:24px;color:#07508c;margin-top:8px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.tools input,.tools select{padding:12px;border:1px solid #dce6f0;border-radius:9px;min-width:230px}.tablewrap{height:440px;max-height:440px;overflow:auto;background:white;border:1px solid #dce6f0;border-radius:12px;position:relative}.tablewrap thead th{position:sticky;top:0;z-index:1}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:13px;border-bottom:1px solid #e7edf4;text-align:left;font-size:13px}th{background:#f4f7fb;color:#45627d}.muted{font-size:12px;color:#64748b;margin-top:4px}.empty{text-align:center;padding:30px;color:#64748b}.modal{display:none;position:fixed;inset:0;background:#102a4388;z-index:10;overflow:auto;padding:18px}.modal.show{display:block}.modalbox{max-width:1050px;margin:15px auto;background:white;border-radius:14px}.modalhead{position:sticky;top:0;background:white;padding:16px 20px;border-bottom:1px solid #dce6f0;display:flex;justify-content:space-between;align-items:center;z-index:2}.modalbody{padding:20px}.section{color:#e32626;font-weight:bold;margin:22px 0 12px;padding-bottom:8px;border-bottom:1px solid #dce6f0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#f6f9fc;border:1px solid #e6edf5;border-radius:9px;padding:12px}.label{font-size:12px;color:#64748b;margin-bottom:6px}.value{font-weight:bold;overflow-wrap:anywhere}.slip{border:1px solid #dce6f0;border-radius:12px;padding:17px;margin:15px 0;break-inside:avoid}.sliphead{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #dce8f6;padding-bottom:12px}.sliphead h2{margin:0;color:#07508c}.pill{background:#e8f8ef;color:#087443;border-radius:30px;padding:7px 12px;font-size:11px;font-weight:bold}.history{width:100%;min-width:0;margin:12px 0}.history th,.history td{border:1px solid #dce6f0;padding:8px}.note{background:#fff8e6;padding:12px;border-radius:8px;margin-top:12px;font-size:13px;color:#805b12}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.wrap{padding:0 10px}.modal{padding:6px}.modalbody{padding:12px}}
@media print{body{background:white}header,.wrap,.modalhead .noprint{display:none!important}.modal{display:block!important;position:static;background:white;padding:0;overflow:visible}.modalbox{margin:0;max-width:none}.slip{page-break-after:always}.slip:last-child{page-break-after:auto}}
</style></head><body>
<header><div class="brand">EGC — Owner Dashboard<small>All Customer Payment & Repayment Slips</small></div><button class="red" id="closePage">✕ Close</button></header>
<main class="wrap"><h1>All Generated Customer Slips</h1><button class="blue" id="refreshBtn">↻ Refresh</button>
<div class="stats"><div class="stat"><span>Total Customers</span><b id="customers">0</b></div><div class="stat"><span>Total Slips</span><b id="slips">0</b></div><div class="stat"><span>Approved Payments</span><b id="approved">0</b></div><div class="stat"><span>Approved Amount</span><b id="amount">₹0.00</b></div></div>
<div class="tools"><input id="search" placeholder="Search name, EGC ID, email, mobile, slip..."><select id="filter"><option value="all">All slip statuses</option><option>active</option><option>cancelled</option><option>expired</option></select></div>
<div class="tablewrap"><table><thead><tr><th>Customer</th><th>EGC User ID</th><th>Mobile / Email</th><th>Slips</th><th>Approved Paid</th><th>Latest Slip</th><th>Action</th></tr></thead><tbody id="body"><tr><td colspan="7" class="empty">Loading...</td></tr></tbody></table></div></main>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><div><b id="mtitle">Customer Slips</b><div class="muted" id="msub"></div></div><div class="noprint"><button class="blue" id="print">Print / Save PDF</button> <button class="red" id="close">✕ Close</button></div></div><div class="modalbody" id="content"></div></div></div>
<script src="owner-all-slips.js"></script></body></html>
