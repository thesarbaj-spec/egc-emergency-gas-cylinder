<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EGC - Notifications</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #0754a9;
      --primary-dark: #003e81;
      --primary-light: #eaf5fc;
      --background: #eef7fc;
      --text: #164f82;
      --muted: #71869a;
      --border: #e1edf5;
      --danger: #d33b3b;
      --success: #078653;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--background);
      color: var(--primary-dark);
      min-height: 100vh;
    }

    button {
      font-family: Arial, sans-serif;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .topbar {
      height: 72px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 35px;
      box-shadow: 0 3px 15px rgba(0, 62, 129, 0.08);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      width: 115px;
      height: 48px;
      object-fit: contain;
    }

    .brand-text {
      font-size: 13px;
      color: #70859a;
    }

    .profile-mini {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .profile-info {
      min-width: 0;
    }

    .profile-photo {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      object-fit: cover;
      background: #dfeef8;
      border: 2px solid #e1edf5;
    }

    .profile-name {
      font-weight: 800;
      color: var(--primary-dark);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .profile-email {
      color: #8295a6;
      font-size: 11px;
      margin-top: 3px;
      overflow-wrap: anywhere;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 72px);
    }

    .sidebar {
      width: 235px;
      background: #fff;
      border-right: 1px solid var(--border);
      padding: 25px 14px;
      position: fixed;
      left: 0;
      top: 72px;
      bottom: 0;
      z-index: 40;
    }

    .nav-title {
      font-size: 11px;
      color: #94a5b5;
      font-weight: 800;
      padding: 8px 13px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: #58738d;
      padding: 13px 14px;
      border-radius: 11px;
      text-align: left;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 5px;
      transition: 0.15s;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: var(--primary-light);
      color: var(--primary);
    }

    .logout {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 20px;
      width: calc(100% - 28px);
      color: var(--danger);
    }

    .logout:hover {
      background: #fff0f0;
      color: #c62828;
    }

    .main {
      margin-left: 235px;
      width: calc(100% - 235px);
      min-width: 0;
      padding: 30px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 20px;
    }

    .page-header h1 {
      font-size: 28px;
      color: var(--primary-dark);
      margin-bottom: 7px;
    }

    .page-header p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .header-btn {
      border: 0;
      min-height: 44px;
      padding: 0 17px;
      border-radius: 12px;
      background: #fff;
      color: var(--primary);
      font-weight: 800;
      box-shadow: 0 5px 18px rgba(0, 62, 129, 0.08);
      transition: 0.15s;
    }

    .header-btn:hover {
      background: var(--primary-light);
    }

    .header-btn.danger {
      color: #c62828;
    }

    .header-btn.danger:hover {
      background: #fff0f0;
    }

    .error-box {
      display: none;
      background: #fff0f0;
      border: 1px solid #ffd0d0;
      color: #c62828;
      padding: 13px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 13px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .info-box {
      display: none;
      background: #fff9e8;
      border: 1px solid #f3df9b;
      color: #805c00;
      padding: 13px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 13px;
      line-height: 1.5;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 17px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: #fff;
      border: 1px solid #e2edf4;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 7px 22px rgba(0, 62, 129, 0.06);
      min-width: 0;
    }

    .stat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 13px;
    }

    .stat-label {
      color: #7b8fa1;
      font-size: 13px;
      font-weight: 700;
    }

    .stat-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .stat-number {
      font-size: 27px;
      font-weight: 900;
      color: var(--primary-dark);
    }

    .box {
      background: #fff;
      border: 1px solid #e2edf4;
      border-radius: 20px;
      padding: 23px;
      box-shadow: 0 7px 22px rgba(0, 62, 129, 0.06);
      min-width: 0;
    }

    .box-title {
      font-size: 18px;
      font-weight: 900;
      color: var(--primary-dark);
      margin-bottom: 18px;
    }

    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 1px solid #dce8ef;
      background: #fff;
      color: #668095;
      border-radius: 10px;
      padding: 10px 14px;
      min-height: 40px;
      font-size: 12px;
      font-weight: 800;
      transition: 0.15s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--primary-light);
      border-color: #cce5f5;
      color: var(--primary);
    }

    .mark-all-btn {
      border: 0;
      background: var(--primary);
      color: #fff;
      border-radius: 10px;
      min-height: 40px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 900;
      transition: 0.15s;
    }

    .mark-all-btn:hover {
      background: #00488f;
    }

    .notifications-list {
      display: flex;
      flex-direction: column;
    }

    .notification {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 17px 5px;
      border-bottom: 1px solid #edf3f7;
      position: relative;
      min-width: 0;
    }

    .notification:last-child {
      border-bottom: 0;
    }

    .notification.unread {
      background: #f7fbff;
      border-radius: 13px;
      padding: 17px 12px;
      margin-bottom: 7px;
      border: 1px solid #e4f1fa;
    }

    .notification-icon {
      width: 45px;
      min-width: 45px;
      height: 45px;
      border-radius: 13px;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .notification-content {
      flex: 1;
      min-width: 0;
    }

    .notification-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .notification-title {
      font-size: 14px;
      font-weight: 900;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .notification-message {
      color: #49677f;
      font-size: 13px;
      margin-top: 5px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .notification-date {
      font-size: 10px;
      color: #91a0ad;
      margin-top: 7px;
      line-height: 1.5;
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      min-width: 8px;
      border-radius: 50%;
      background: #0872d5;
    }

    .notification-actions {
      display: flex;
      gap: 7px;
      margin-top: 10px;
    }

    .read-btn {
      border: 0;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 8px;
      min-height: 32px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 900;
    }

    .read-btn:hover {
      background: #dceef9;
    }

    .read-label {
      font-size: 10px;
      color: var(--success);
      font-weight: 800;
      padding-top: 6px;
    }

    .empty,
    .loading {
      text-align: center;
      padding: 45px 15px;
      color: #8a9aaa;
      font-size: 13px;
      line-height: 1.6;
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .mobile-nav {
      display: none;
    }

    .toast {
      position: fixed;
      right: 25px;
      bottom: 25px;
      z-index: 10001;
      max-width: min(450px, calc(100vw - 30px));
      background: var(--primary-dark);
      color: #fff;
      padding: 13px 18px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: 0.2s;
      overflow-wrap: anywhere;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .logout-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 20, 40, 0.55);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .logout-overlay.show {
      display: flex;
    }

    .logout-popup {
      width: 100%;
      max-width: 390px;
      background: #fff;
      border-radius: 22px;
      padding: 28px 25px 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      text-align: center;
      animation: logoutPopupIn 0.18s ease-out;
    }

    @keyframes logoutPopupIn {
      from {
        opacity: 0;
        transform: scale(0.94) translateY(8px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .logout-icon {
      width: 58px;
      height: 58px;
      border-radius: 17px;
      background: #fff0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
    }

    .logout-title {
      font-size: 21px;
      font-weight: 900;
      color: #173f62;
      margin-bottom: 10px;
    }

    .logout-subtitle {
      font-size: 13px;
      color: #7c8d9c;
      line-height: 1.5;
      margin-bottom: 23px;
    }

    .logout-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .logout-cancel-btn,
    .logout-confirm-btn {
      min-height: 48px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 900;
      transition: 0.15s;
    }

    .logout-cancel-btn {
      background: #fff;
      color: #31526d;
      border: 1px solid #d7e2ea;
    }

    .logout-cancel-btn:hover {
      background: #f5f8fa;
    }

    .logout-confirm-btn {
      background: #e53935;
      color: #fff;
      border: 1px solid #e53935;
    }

    .logout-confirm-btn:hover {
      background: #c62828;
      border-color: #c62828;
    }

    @media (max-width: 1050px) {
      .main {
        padding: 25px 20px;
      }

      .stats {
        gap: 12px;
      }

      .stat-card {
        padding: 16px;
      }
    }

    @media (max-width: 800px) {
      .sidebar {
        display: none;
      }

      .main {
        margin-left: 0;
        width: 100%;
        padding: 20px 15px 90px;
      }

      .topbar {
        height: 65px;
        padding: 0 15px;
      }

      .layout {
        min-height: calc(100vh - 65px);
      }

      .brand img {
        width: 100px;
      }

      .brand-text,
      .profile-email {
        display: none;
      }

      .profile-photo {
        width: 38px;
        height: 38px;
      }

      .page-header {
        align-items: flex-start;
      }

      .page-header h1 {
        font-size: 23px;
      }

      .page-header p {
        font-size: 12px;
      }

      .header-actions {
        display: none;
      }

      .stats {
        gap: 10px;
      }

      .stat-card {
        padding: 14px 11px;
      }

      .stat-label {
        font-size: 10px;
      }

      .stat-number {
        font-size: 21px;
      }

      .stat-icon {
        width: 32px;
        height: 32px;
        font-size: 16px;
      }

      .box {
        padding: 18px;
        border-radius: 17px;
      }

      .box-title {
        font-size: 17px;
      }

      .filter-row {
        align-items: stretch;
      }

      .filter-buttons {
        width: 100%;
      }

      .filter-btn {
        flex: 1;
      }

      .mark-all-btn {
        width: 100%;
      }

      .notification {
        gap: 11px;
      }

      .notification-icon {
        width: 40px;
        min-width: 40px;
        height: 40px;
        font-size: 18px;
      }

      .notification-title {
        font-size: 13px;
      }

      .notification-message {
        font-size: 12px;
      }

      .mobile-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        min-height: 67px;
        padding: 5px 3px;
        background: #fff;
        border-top: 1px solid #dce8ef;
        z-index: 100;
        justify-content: space-around;
        align-items: center;
        box-shadow: 0 -5px 20px rgba(0, 62, 129, 0.08);
      }

      .mobile-nav button {
        flex: 1;
        min-width: 0;
        min-height: 50px;
        border: 0;
        background: transparent;
        color: #7890a3;
        font-size: 10px;
        font-weight: 800;
      }

      .mobile-nav button span {
        display: block;
        font-size: 20px;
        margin-bottom: 3px;
      }

      .mobile-nav button.active {
        color: var(--primary);
      }

      .logout-popup {
        max-width: 350px;
        padding: 25px 20px 21px;
      }

      .logout-title {
        font-size: 20px;
      }

      .toast {
        left: 15px;
        right: 15px;
        bottom: 80px;
        max-width: none;
        text-align: center;
      }
    }

    @media (max-width: 450px) {
      .stats {
        gap: 8px;
      }

      .stat-card {
        padding: 13px 8px;
      }

      .stat-number {
        font-size: 19px;
      }

      .stat-label {
        font-size: 9px;
      }

      .stat-icon {
        width: 30px;
        height: 30px;
        font-size: 15px;
      }

      .notification.unread {
        padding-left: 9px;
        padding-right: 9px;
      }

      .notification-icon {
        width: 37px;
        min-width: 37px;
        height: 37px;
        font-size: 16px;
      }

      .notification-top {
        align-items: flex-start;
      }

      .notification-title {
        line-height: 1.45;
      }

      .box {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="brand">
      <img
        src="assets/EGC - Emergency Gas Cylinder logo.png"
        alt="EGC"
        onerror="this.style.display='none'"
      >

      <div class="brand-text">
        Emergency Gas Cylinder
      </div>
    </div>

    <div class="profile-mini">
      <div class="profile-info">
        <div class="profile-name" id="topName">Loading...</div>
        <div class="profile-email" id="topEmail">Loading...</div>
      </div>

      <img
        id="topPhoto"
        class="profile-photo"
        src=""
        alt="Profile photo"
      >
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar">
      <div class="nav-title">MENU</div>

      <button class="nav-btn" onclick="goPage('dashboard.html')">
        🏠 &nbsp; Dashboard
      </button>

<button class="nav-btn" onclick="goRequest()">🛢️ &nbsp; Request Cylinder</button>

      <button class="nav-btn" onclick="goPage('my-requests.html')">
        📋 &nbsp; My Requests
      </button>

      <button class="nav-btn" onclick="goPage('payments.html')">
        💰 &nbsp; Payments
      </button>

      <button class="nav-btn active" onclick="goPage('notifications.html')">
        🔔 &nbsp; Notifications
      </button>

      <button class="nav-btn" onclick="goPage('profile.html')">
        👤 &nbsp; Profile
      </button>

      <button class="nav-btn" onclick="goPage('setting.html')">
        ⚙️ &nbsp; Settings
      </button>

      <button class="nav-btn" onclick="goPage('help-support.html')">
        ❓ &nbsp; Help &amp; Support
      </button>

      <button class="nav-btn logout" onclick="openLogoutPopup()">
        🚪 &nbsp; Logout
      </button>
    </aside>

    <main class="main">

      <div id="errorBox" class="error-box" role="alert"></div>

      <div id="infoBox" class="info-box" role="status"></div>

      <section class="page-header">
        <div>
          <h1>Notifications</h1>
          <p>Stay updated about your EGC requests, payments and deliveries.</p>
        </div>

        <div class="header-actions">
          <button class="header-btn" onclick="goPage('dashboard.html')">
            🏠 Dashboard
          </button>

          <button class="header-btn danger" onclick="openLogoutPopup()">
            🚪 Logout
          </button>
        </div>
      </section>

      <section class="stats">
        <div class="stat-card">
          <div class="stat-top">
            <div class="stat-label">Total</div>
            <div class="stat-icon">🔔</div>
          </div>
          <div class="stat-number" id="totalNotifications">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-top">
            <div class="stat-label">Unread</div>
            <div class="stat-icon">🔵</div>
          </div>
          <div class="stat-number" id="unreadNotifications">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-top">
            <div class="stat-label">Read</div>
            <div class="stat-icon">✅</div>
          </div>
          <div class="stat-number" id="readNotifications">0</div>
        </div>
      </section>

      <section class="box">
        <div class="box-title">🔔 Your Notifications</div>

        <div class="filter-row">
          <div class="filter-buttons">
            <button
              class="filter-btn active"
              id="filterAll"
              onclick="setFilter('all')"
            >
              All
            </button>

            <button
              class="filter-btn"
              id="filterUnread"
              onclick="setFilter('unread')"
            >
              Unread
            </button>

            <button
              class="filter-btn"
              id="filterRead"
              onclick="setFilter('read')"
            >
              Read
            </button>
          </div>

          <button
            class="mark-all-btn"
            id="markAllBtn"
            onclick="markAllAsRead()"
          >
            ✓ Mark All as Read
          </button>
        </div>

        <div id="notificationsList" class="notifications-list" aria-live="polite">
          <div class="loading">Loading notifications...</div>
        </div>
      </section>

    </main>
  </div>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <button onclick="goPage('dashboard.html')">
      <span>🏠</span>
      Home
    </button>

    <button onclick="goPage('my-requests.html')">
      <span>📋</span>
      Requests
    </button>

    <button onclick="goPage('request-cylinder.html')">
      <span>➕</span>
      Request
    </button>

    <button onclick="goPage('payments.html')">
      <span>💰</span>
      Payments
    </button>

    <button class="active" onclick="goPage('notifications.html')">
      <span>🔔</span>
      Alerts
    </button>
  </nav>

  <div
    class="logout-overlay"
    id="logoutOverlay"
    onclick="closeLogoutPopup(event)"
  >
    <div class="logout-popup" onclick="event.stopPropagation()">
      <div class="logout-icon">🚪</div>

      <div class="logout-title">Are you sure you want to log out?</div>

      <div class="logout-subtitle">
        Emergency Gas Cylinder
      </div>

      <div class="logout-buttons">
        <button
          type="button"
          class="logout-cancel-btn"
          onclick="closeLogoutPopup()"
        >
          Cancel
        </button>

        <button
          type="button"
          class="logout-confirm-btn"
          id="confirmLogoutBtn"
          onclick="confirmLogout()"
        >
          Logout
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* SUPABASE CONFIGURATION */
const SUPABASE_URL = "https://szefvmvokkhvnzryodqu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_S8aSsfmOKN6_7laRfgoMKA_Re2HzRS6";

if (!window.supabase) {
  const errorBox = document.getElementById("errorBox");

  if (errorBox) {
    errorBox.textContent =
      "Supabase library could not be loaded. Please refresh this page.";
    errorBox.style.display = "block";
  }

  throw new Error("Supabase JS library not loaded.");
}

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let currentUser = null;
let currentProfile = null;
let notifications = [];
let currentFilter = "all";
let realtimeChannel = null;
let requestRealtimeChannel = null;
let toastTimer = null;
let isLoggingOut = false;
let authListener = null;

/* REQUEST CYLINDER STATE */
let currentRequests = [];
let currentPayments = [];
let requestStateLoading = false;
let requestStateError = false;
let requestRefreshPromise = null;

const $ = (id) => document.getElementById(id);

/* SAFE TEXT / DATE HELPERS */

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatDateTime(value) {
  if (!value) return "Date unavailable";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "Date unavailable";
  }

  return date.toLocaleString("en-IN", {
    day: "2-digit",
    month: "short",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
}

function showError(message) {
  const box = $("errorBox");
  if (!box) return;

  box.textContent = message || "Something went wrong.";
  box.style.display = "block";
}

function clearError() {
  const box = $("errorBox");
  if (!box) return;

  box.textContent = "";
  box.style.display = "none";
}

function showInfo(message) {
  const box = $("infoBox");
  if (!box) return;

  box.textContent = message || "";
  box.style.display = message ? "block" : "none";
}

function toast(message) {
  const element = $("toast");

  if (!element) {
    console.log(message);
    return;
  }

  element.textContent = message || "";
  element.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    element.classList.remove("show");
  }, 3000);
}

/* PAGE NAVIGATION */

function goPage(page) {
  if (!page) return;
  window.location.href = page;
}

/* PROFILE */

function setDefaultProfilePhoto(name) {
  const image = $("topPhoto");
  if (!image) return;

  image.src =
    "https://ui-avatars.com/api/?name=" +
    encodeURIComponent(name || "EGC") +
    "&background=eaf5fc&color=0754a9&bold=true";
}

async function loadProfile() {
  if (!currentUser?.id) return;

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (error) {
    console.error("Profile load error:", error);
  }

  currentProfile = data || null;

  const name =
    currentProfile?.full_name ||
    currentUser.user_metadata?.full_name ||
    "EGC Customer";

  const email =
    currentProfile?.email ||
    currentUser.email ||
    "";

  if ($("topName")) {
    $("topName").textContent = name;
  }

  if ($("topEmail")) {
    $("topEmail").textContent = email;
  }

  const image = $("topPhoto");
  if (!image) return;

  const fallback =
    "https://ui-avatars.com/api/?name=" +
    encodeURIComponent(name) +
    "&background=eaf5fc&color=0754a9&size=256";

  image.onerror = function () {
    this.onerror = null;
    this.src = fallback;
  };

  const storedPhoto = String(
    currentProfile?.profile_photo || ""
  ).trim();

  if (!storedPhoto) {
    image.src = fallback;
    return;
  }

  if (/^(https?:\/\/|data:image\/)/i.test(storedPhoto)) {
    image.src = storedPhoto;
    return;
  }

  try {
    const photoPath = storedPhoto.replace(/^\/+/, "");

    const { data: signedData, error: signedError } =
      await supabaseClient.storage
        .from("profile-photos")
        .createSignedUrl(photoPath, 60 * 60);

    if (signedError || !signedData?.signedUrl) {
      console.error(
        "Profile photo URL error:",
        signedError?.message || "Signed URL unavailable"
      );

      image.src = fallback;
      return;
    }

    image.src = signedData.signedUrl;

  } catch (photoError) {
    console.error("Profile photo error:", photoError);
    image.src = fallback;
  }
}

function setProfileHeaderFallback() {
  const name = "EGC Customer";

  if ($("topName")) {
    $("topName").textContent = name;
  }

  if ($("topEmail")) {
    $("topEmail").textContent = currentUser?.email || "";
  }

  setDefaultProfilePhoto(name);
}

/* =========================================================
   REQUEST CYLINDER NAVIGATION
   ========================================================= */

function normalizeStatus(value) {
  return String(value || "")
    .trim()
    .toLowerCase()
    .replace(/[\s-]+/g, "_");
}

function getOwnerApproval(record) {
  if (!record) return "pending";

  return normalizeStatus(
    record.owner_approval ??
    record.owner_status ??
    record.approval_status ??
    "pending"
  );
}

function isOwnerApproved(record) {
  return [
    "approved",
    "approve",
    "accepted",
    "verified"
  ].includes(getOwnerApproval(record));
}

function isOwnerRejected(record) {
  return [
    "rejected",
    "reject",
    "declined",
    "denied"
  ].includes(getOwnerApproval(record));
}

function isRequestCancelled(request) {
  if (!request) return true;

  const status = normalizeStatus(request.status);

  return [
    "cancelled",
    "canceled",
    "rejected",
    "declined"
  ].includes(status) || isOwnerRejected(request);
}

function isRequestApproved(request) {
  if (!request || isRequestCancelled(request)) {
    return false;
  }

  return isOwnerApproved(request);
}

function getRequestTotal(request) {
  const possibleAmounts = [
    request?.total_amount,
    request?.total_payable,
    request?.total_price,
    request?.request_amount,
    request?.cylinder_amount,
    request?.amount
  ];

  for (const value of possibleAmounts) {
    if (value !== null && value !== undefined && value !== "") {
      const amount = Number(value);

      if (Number.isFinite(amount) && amount > 0) {
        return amount;
      }
    }
  }

  return 890;
}

function getPaymentRequestId(payment) {
  return String(
    payment?.request_id ??
    payment?.cylinder_request_id ??
    ""
  );
}

function getPaymentState(payment) {
  const paymentStatus = normalizeStatus(
    payment?.payment_status ??
    payment?.status ??
    ""
  );

  const approvalStatus = normalizeStatus(
    payment?.verification_status ??
    payment?.owner_approval ??
    payment?.approval_status ??
    payment?.owner_status ??
    ""
  );

  const successfulStatuses = [
    "paid",
    "success",
    "successful",
    "completed"
  ];

  const rejectedStatuses = [
    "rejected",
    "reject",
    "declined",
    "failed",
    "cancelled",
    "canceled"
  ];

  if (
    rejectedStatuses.includes(paymentStatus) ||
    rejectedStatuses.includes(approvalStatus)
  ) {
    return { key: "rejected" };
  }

  if (
    successfulStatuses.includes(paymentStatus) &&
    [
      "approved",
      "approve",
      "verified",
      "accepted"
    ].includes(approvalStatus)
  ) {
    return { key: "approved" };
  }

  if (
    [
      "pending",
      "pending_verification",
      "under_review",
      "processing",
      "submitted",
      "initiated",
      "awaiting_verification"
    ].includes(paymentStatus) ||
    [
      "pending",
      "pending_verification",
      "under_review",
      "submitted",
      "awaiting_verification"
    ].includes(approvalStatus)
  ) {
    return { key: "pending" };
  }

  if (successfulStatuses.includes(paymentStatus)) {
    return { key: "pending" };
  }

  return { key: "unknown" };
}

function getRequestPayments(requestId) {
  return currentPayments.filter(payment => {
    return getPaymentRequestId(payment) === String(requestId);
  });
}

function getRequestVerifiedPayments(requestId) {
  return getRequestPayments(requestId).reduce((total, payment) => {
    if (getPaymentState(payment).key !== "approved") {
      return total;
    }

    const amount = Number(
      payment.amount ??
      payment.payment_amount ??
      payment.paid_amount ??
      0
    );

    return total + (
      Number.isFinite(amount) && amount > 0 ? amount : 0
    );
  }, 0);
}

function getPaymentTypeValue(payment) {
  return normalizeStatus(
    payment?.payment_type ??
    payment?.type ??
    payment?.payment_for ??
    ""
  );
}

function isInitialPayment(payment) {
  return [
    "initial",
    "initial_payment",
    "registration",
    "registration_fee",
    "first_payment"
  ].includes(getPaymentTypeValue(payment));
}

function isRepaymentPayment(payment) {
  return [
    "repayment",
    "repayment_payment",
    "remaining",
    "remaining_payment",
    "balance"
  ].includes(getPaymentTypeValue(payment));
}

function getInitialPayment(requestId) {
  return getRequestPayments(requestId)
    .filter(isInitialPayment)
    .sort((a, b) => {
      return new Date(b.created_at || 0) -
        new Date(a.created_at || 0);
    })[0] || null;
}

function getDeliveryDate(request) {
  const possibleDates = [
    request?.delivery_date,
    request?.delivered_at,
    request?.delivery_completed_at,
    request?.actual_delivery_date,
    request?.date_of_delivery,
    request?.delivered_on
  ];

  for (const value of possibleDates) {
    if (value) return value;
  }

  const deliveryStatus = normalizeStatus(
    request?.delivery_status ??
    request?.delivery_state ??
    ""
  );

  if (
    ["delivered", "completed", "delivery_completed"].includes(
      deliveryStatus
    )
  ) {
    return (
      request?.updated_at ||
      request?.created_at ||
      null
    );
  }

  return null;
}

function getDeliveryDayCount(request) {
  const deliveryDate = getDeliveryDate(request);

  if (!deliveryDate) return 0;

  const start = new Date(deliveryDate);

  if (Number.isNaN(start.getTime())) return 0;

  const now = new Date();

  start.setHours(0, 0, 0, 0);
  now.setHours(0, 0, 0, 0);

  const difference = Math.floor(
    (now.getTime() - start.getTime()) / 86400000
  );

  return Math.max(1, difference + 1);
}

/* Extra charge rules */

function calculateTierExtraCharge(days) {
  if (days <= 0) return 0;
  if (days <= 10) return 35;
  if (days <= 15) return 40;
  if (days <= 45) return 50;

  return 100;
}

function getRequestExtraCharge(request) {
  if (!isRequestApproved(request)) return 0;
  if (!getDeliveryDate(request)) return 0;

  const savedCharge = Number(
    request?.extra_charge ??
    request?.late_charge ??
    request?.repayment_extra_charge ??
    0
  );

  if (Number.isFinite(savedCharge) && savedCharge > 0) {
    return savedCharge;
  }

  return calculateTierExtraCharge(
    getDeliveryDayCount(request)
  );
}

function getRequestFinancials(request) {
  const baseAmount = getRequestTotal(request);
  const extraCharge = getRequestExtraCharge(request);
  const totalPayable = baseAmount + extraCharge;
  const verifiedPaid = getRequestVerifiedPayments(request.id);

  return {
    baseAmount,
    extraCharge,
    totalPayable,
    verifiedPaid,
    remaining: Math.max(0, totalPayable - verifiedPaid)
  };
}

function isRequestFullyPaid(request) {
  if (!isRequestApproved(request)) return false;

  const financials = getRequestFinancials(request);

  return (
    financials.totalPayable > 0 &&
    financials.remaining <= 0
  );
}

function getLatestRequest() {
  const requests = [...currentRequests].sort((a, b) => {
    const dateA = new Date(
      a.updated_at ||
      a.created_at ||
      a.request_date ||
      0
    ).getTime();

    const dateB = new Date(
      b.updated_at ||
      b.created_at ||
      b.request_date ||
      0
    ).getTime();

    return dateB - dateA;
  });

  return (
    requests.find(request => !isRequestCancelled(request)) ||
    requests[0] ||
    null
  );
}

function getRequestNavigationState(request) {
  if (!request || isRequestCancelled(request)) {
    return {
      state: "new_request",
      label: "+ REQUEST CYLINDER",
      note: "Start a new cylinder request."
    };
  }

  if (!isRequestApproved(request)) {
    return {
      state: "approval_pending",
      label: "REQUEST PENDING",
      note: "Your request is waiting for Owner approval."
    };
  }

  const requestId = String(request.id);
  const requestPayments = getRequestPayments(requestId);

  const hasPendingPayment = requestPayments.some(payment => {
    return getPaymentState(payment).key === "pending";
  });

  if (hasPendingPayment) {
    return {
      state: "payment_pending",
      label: "PAYMENT VERIFICATION PENDING",
      note: "Your payment is awaiting Owner verification."
    };
  }

  const initialPayment = getInitialPayment(requestId);
  const initialPaymentState = initialPayment
    ? getPaymentState(initialPayment).key
    : "unknown";

  if (initialPaymentState !== "approved") {
    return {
      state: "initial_payment_due",
      label: "PAY INITIAL PAYMENT",
      note: "Your request is approved. Pay the initial ₹200."
    };
  }

  if (isRequestFullyPaid(request)) {
    return {
      state: "fully_paid",
      label: "+ REQUEST NEW CYLINDER",
      note: "Your previous request is fully paid."
    };
  }

  if (!getDeliveryDate(request)) {
    return {
      state: "delivery_pending",
      label: "CHECK REQUEST STATUS",
      note: "Your request is being processed for delivery."
    };
  }

  return {
    state: "repayment_due",
    label: "CONTINUE REPAYMENT",
    note: "Your cylinder has been delivered. Complete repayment."
  };
}

/* REFRESH SUPABASE REQUEST AND PAYMENT RECORDS */

async function refreshRequestNavigation() {
  if (!currentUser?.id) {
    currentRequests = [];
    currentPayments = [];
    return false;
  }

  if (requestRefreshPromise) {
    return requestRefreshPromise;
  }

  requestStateLoading = true;
  requestStateError = false;
  updateRequestButton();

  requestRefreshPromise = (async () => {
    try {
      const [requestsResult, paymentsResult] = await Promise.all([
        supabaseClient
          .from("cylinder_requests")
          .select("*")
          .eq("user_id", currentUser.id)
          .order("created_at", { ascending: false }),

        supabaseClient
          .from("payments")
          .select("*")
          .eq("user_id", currentUser.id)
          .order("created_at", { ascending: false })
      ]);

      if (requestsResult.error) {
        throw new Error(
          "Request records: " + requestsResult.error.message
        );
      }

      if (paymentsResult.error) {
        throw new Error(
          "Payment records: " + paymentsResult.error.message
        );
      }

      currentRequests = Array.isArray(requestsResult.data)
        ? requestsResult.data
        : [];

      currentPayments = Array.isArray(paymentsResult.data)
        ? paymentsResult.data
        : [];

      requestStateError = false;

      console.log("EGC request records loaded:", currentRequests.length);
      console.log("EGC payment records loaded:", currentPayments.length);

      return true;

    } catch (error) {
      requestStateError = true;

      console.error(
        "Request Cylinder state load error:",
        error
      );

      toast(
        "Request status could not be refreshed. Please try again."
      );

      return false;

    } finally {
      requestStateLoading = false;
      requestRefreshPromise = null;
      updateRequestButton();
    }
  })();

  return requestRefreshPromise;
}

/* UPDATE OPTIONAL REQUEST BUTTON AND STATUS NOTE */

function updateRequestButton() {
  const button = $("requestCylinderBtn");
  const note = $("requestCylinderNote");

  if (requestStateLoading) {
    if (button) {
      button.textContent = "CHECKING REQUEST STATUS...";
      button.disabled = true;
    }

    if (note) {
      note.textContent =
        "Checking your latest request and payment status.";
    }

    return;
  }

  if (requestStateError) {
    if (button) {
      button.textContent = "RETRY REQUEST STATUS";
      button.disabled = false;
    }

    if (note) {
      note.textContent =
        "Your request status could not be checked. Tap to retry.";
    }

    return;
  }

  const request = getLatestRequest();
  const state = getRequestNavigationState(request);

  if (button) {
    button.textContent = state.label;
    button.disabled = false;
  }

  if (note) {
    note.textContent = state.note;
  }
}

/* REQUEST CYLINDER BUTTON ROUTING */

async function goRequest() {
  if (!currentUser?.id) {
    window.location.href = "login.html";
    return;
  }

  if (requestStateLoading) {
    toast("Please wait while your request status is checked.");
    return;
  }

  const refreshed = await refreshRequestNavigation();

  if (!refreshed || requestStateError) {
    toast("Unable to check request status. Please try again.");
    return;
  }

  const request = getLatestRequest();
  const state = getRequestNavigationState(request);

  console.log("EGC navigation state:", state.state, request);

  if (
    state.state === "new_request" ||
    state.state === "fully_paid"
  ) {
    window.location.href = "request-cylinder.html";
    return;
  }

  if (
    state.state === "approval_pending" ||
    state.state === "payment_pending" ||
    state.state === "delivery_pending"
  ) {
    window.location.href =
      "request-status.html?request_id=" +
      encodeURIComponent(request.id);

    return;
  }

  if (state.state === "initial_payment_due") {
    window.location.href =
      "submit-payment.html?" +
      new URLSearchParams({
        request_id: String(request.id),
        payment_type: "initial",
        amount: "200"
      }).toString();

    return;
  }

  if (state.state === "repayment_due") {
    window.location.href =
      "payments.html?request_id=" +
      encodeURIComponent(request.id);

    return;
  }

  /* Safe fallback: never start a duplicate request on an unknown state. */
  window.location.href =
    "request-status.html?request_id=" +
    encodeURIComponent(request.id);
}

function requestCylinder() {
  return goRequest();
}

/* NOTIFICATION TYPE / ICON */

function notificationIcon(type) {
  const value = String(type || "general").toLowerCase();

  if (
    value.includes("payment") ||
    value.includes("transaction") ||
    value.includes("repayment")
  ) return "💳";

  if (
    value.includes("request") ||
    value.includes("cylinder")
  ) return "🛢️";

  if (
    value.includes("approval") ||
    value.includes("approved") ||
    value.includes("verified")
  ) return "✅";

  if (
    value.includes("reject") ||
    value.includes("cancel")
  ) return "❌";

  if (
    value.includes("delivery") ||
    value.includes("delivered")
  ) return "🚚";

  if (
    value.includes("processing") ||
    value.includes("agency")
  ) return "⚙️";

  if (value.includes("complete")) return "🎉";
  if (value.includes("system")) return "⚙️";

  return "🔔";
}

/* LOAD NOTIFICATIONS */

async function loadNotifications() {
  if (!currentUser?.id) return;

  const list = $("notificationsList");

  if (list) {
    list.innerHTML =
      '<div class="loading">Loading notifications...</div>';
  }

  const { data, error } = await supabaseClient
    .from("notifications")
    .select(
      "id,user_id,title,message,notification_type,is_read,created_at"
    )
    .eq("user_id", currentUser.id)
    .order("created_at", { ascending: false })
    .limit(100);

  if (error) {
    console.error("Notifications load error:", error);

    notifications = [];
    updateStats();

    if (list) {
      list.innerHTML =
        '<div class="empty">' +
          '<div class="empty-icon">⚠️</div>' +
          '<div>Unable to load notifications.</div>' +
          '<div>Please check the notifications table and RLS policies.</div>' +
        '</div>';
    }

    showError(
      "Notifications could not be loaded: " + error.message
    );

    return;
  }

  clearError();

  notifications = Array.isArray(data) ? data : [];

  updateStats();
  renderNotifications();
}

/* NOTIFICATION STATISTICS */

function updateStats() {
  const total = notifications.length;

  const unread = notifications.filter(
    item => item.is_read !== true
  ).length;

  const read = total - unread;

  if ($("totalNotifications")) {
    $("totalNotifications").textContent = String(total);
  }

  if ($("unreadNotifications")) {
    $("unreadNotifications").textContent = String(unread);
  }

  if ($("readNotifications")) {
    $("readNotifications").textContent = String(read);
  }

  if ($("markAllBtn")) {
    $("markAllBtn").disabled = unread === 0;
  }
}

/* NOTIFICATION FILTERS */

function setFilter(filter) {
  if (!["all", "unread", "read"].includes(filter)) {
    return;
  }

  currentFilter = filter;

  document.querySelectorAll(".filter-btn").forEach(button => {
    button.classList.remove("active");
  });

  const activeButton = {
    all: $("filterAll"),
    unread: $("filterUnread"),
    read: $("filterRead")
  }[filter];

  if (activeButton) {
    activeButton.classList.add("active");
  }

  renderNotifications();
}

function getFilteredNotifications() {
  if (currentFilter === "unread") {
    return notifications.filter(item => item.is_read !== true);
  }

  if (currentFilter === "read") {
    return notifications.filter(item => item.is_read === true);
  }

  return notifications;
}

/* RENDER NOTIFICATIONS */

function renderNotifications() {
  const list = $("notificationsList");
  if (!list) return;

  const filtered = getFilteredNotifications();

  if (!filtered.length) {
    let message = "No notifications yet.";

    if (currentFilter === "unread") {
      message = "You have no unread notifications.";
    } else if (currentFilter === "read") {
      message = "You have no read notifications.";
    }

    list.innerHTML =
      '<div class="empty">' +
        '<div class="empty-icon">🔔</div>' +
        '<div>' + escapeHtml(message) + '</div>' +
      '</div>';

    return;
  }

  list.innerHTML = filtered.map(item => {
    const unread = item.is_read !== true;

    const title = escapeHtml(item.title || "Notification");
    const message = escapeHtml(item.message || "");
    const date = escapeHtml(formatDateTime(item.created_at));
    const id = escapeHtml(item.id);
    const icon = notificationIcon(item.notification_type);

    return `
      <article
        class="notification ${unread ? "unread" : ""}"
        data-notification-id="${id}"
      >
        <div class="notification-icon" aria-hidden="true">
          ${icon}
        </div>

        <div class="notification-content">
          <div class="notification-top">
            <div class="notification-title">${title}</div>

            ${
              unread
                ? '<div class="unread-dot" title="Unread" aria-label="Unread"></div>'
                : ''
            }
          </div>

          <div class="notification-message">${message}</div>
          <div class="notification-date">${date}</div>

          <div class="notification-actions">
            ${
              unread
                ? `
                  <button
                    type="button"
                    class="read-btn"
                    data-read-id="${id}"
                  >
                    ✓ Mark as read
                  </button>
                `
                : '<span class="read-label">✓ Read</span>'
            }
          </div>
        </div>
      </article>
    `;
  }).join("");
}

/* MARK ONE NOTIFICATION AS READ */

async function markNotificationRead(id) {
  if (!id || !currentUser?.id) {
    return false;
  }

  const item = notifications.find(
    notification => String(notification.id) === String(id)
  );

  if (!item || item.is_read === true) {
    return true;
  }

  const { data, error } = await supabaseClient
    .from("notifications")
    .update({ is_read: true })
    .eq("id", id)
    .eq("user_id", currentUser.id)
    .select("id,is_read")
    .maybeSingle();

  if (error) {
    console.error("Mark notification read error:", error);
    toast("Unable to mark as read: " + error.message);
    return false;
  }

  if (!data) {
    toast("Notification was not updated. Please check access policies.");
    return false;
  }

  item.is_read = true;

  updateStats();
  renderNotifications();

  return true;
}

/* MARK ALL NOTIFICATIONS AS READ */

async function markAllAsRead() {
  if (!currentUser?.id) return;

  const unread = notifications.filter(
    item => item.is_read !== true
  );

  if (!unread.length) {
    toast("All notifications are already read.");
    return;
  }

  const button = $("markAllBtn");

  if (button) {
    button.disabled = true;
    button.textContent = "Marking...";
  }

  const { error } = await supabaseClient
    .from("notifications")
    .update({ is_read: true })
    .eq("user_id", currentUser.id)
    .eq("is_read", false);

  if (error) {
    console.error("Mark all read error:", error);

    if (button) {
      button.textContent = "✓ Mark All as Read";
    }

    updateStats();

    toast("Unable to mark notifications as read: " + error.message);
    return;
  }

  notifications = notifications.map(item => ({
    ...item,
    is_read: true
  }));

  updateStats();
  renderNotifications();

  if (button) {
    button.textContent = "✓ Mark All as Read";
  }

  toast("All notifications marked as read.");
}

/* DELEGATED NOTIFICATION CLICK HANDLER */

if ($("notificationsList")) {
  $("notificationsList").addEventListener("click", async event => {
    const target = event.target;

    if (!(target instanceof Element)) return;

    const button = target.closest("[data-read-id]");
    if (!button) return;

    const id = button.getAttribute("data-read-id");
    if (!id) return;

    button.disabled = true;
    button.textContent = "Updating...";

    await markNotificationRead(id);
  });
}

/* REALTIME NOTIFICATIONS */

function subscribeRealtime() {
  if (!currentUser?.id) return;

  if (realtimeChannel) {
    supabaseClient.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }

  realtimeChannel = supabaseClient
    .channel("customer-notifications-" + currentUser.id)

    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "notifications",
        filter: "user_id=eq." + currentUser.id
      },
      payload => {
        const item = payload.new;
        if (!item) return;

        const exists = notifications.some(
          oldItem => String(oldItem.id) === String(item.id)
        );

        if (exists) return;

        notifications.unshift(item);
        notifications = notifications.slice(0, 100);

        updateStats();
        renderNotifications();

        showBrowserNotification(item);
        toast(item.title || "New EGC notification");
      }
    )

    .on(
      "postgres_changes",
      {
        event: "UPDATE",
        schema: "public",
        table: "notifications",
        filter: "user_id=eq." + currentUser.id
      },
      payload => {
        const updated = payload.new;
        if (!updated) return;

        const index = notifications.findIndex(
          item => String(item.id) === String(updated.id)
        );

        if (index !== -1) {
          notifications[index] = {
            ...notifications[index],
            ...updated
          };
        } else {
          notifications.unshift(updated);
          notifications = notifications.slice(0, 100);
        }

        updateStats();
        renderNotifications();
      }
    )

    .subscribe(status => {
      console.log("EGC notification realtime status:", status);
    });
}

/* OPTIONAL REALTIME REQUEST/PAYMENT REFRESH */

function subscribeRequestRealtime() {
  if (!currentUser?.id) return;

  if (requestRealtimeChannel) {
    supabaseClient.removeChannel(requestRealtimeChannel);
    requestRealtimeChannel = null;
  }

  requestRealtimeChannel = supabaseClient
    .channel("customer-request-state-" + currentUser.id)

    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "cylinder_requests",
        filter: "user_id=eq." + currentUser.id
      },
      async () => {
        await refreshRequestNavigation();
      }
    )

    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "payments",
        filter: "user_id=eq." + currentUser.id
      },
      async () => {
        await refreshRequestNavigation();
      }
    )

    .subscribe(status => {
      console.log("EGC request realtime status:", status);
    });
}

/* BROWSER NOTIFICATIONS */

async function requestBrowserNotificationPermission() {
  if (!("Notification" in window)) {
    toast("Browser notifications are not supported here.");
    return;
  }

  if (Notification.permission === "granted") {
    toast("Browser notifications are already enabled.");
    return;
  }

  if (Notification.permission === "denied") {
    toast("Browser notifications are blocked in browser settings.");
    return;
  }

  try {
    const permission = await Notification.requestPermission();

    if (permission === "granted") {
      toast("Browser notifications enabled.");
    } else {
      toast("Browser notifications were not enabled.");
    }
  } catch (error) {
    console.warn("Notification permission error:", error);
    toast("Unable to request browser notification permission.");
  }
}

function showBrowserNotification(item) {
  if (!("Notification" in window)) return;
  if (Notification.permission !== "granted") return;

  try {
    const browserNotification = new Notification(
      item.title || "EGC Notification",
      {
        body: item.message || "You have a new notification.",
        icon: "assets/EGC - Emergency Gas Cylinder logo.png",
        tag: String(item.id || Date.now())
      }
    );

    browserNotification.onclick = () => {
      window.focus();
      browserNotification.close();
    };
  } catch (error) {
    console.warn("Browser notification error:", error);
  }
}

/* LOGOUT POPUP */

function openLogoutPopup() {
  const overlay = $("logoutOverlay");
  if (!overlay) return;

  overlay.classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeLogoutPopup(event) {
  if (
    event &&
    event.target &&
    event.target.id !== "logoutOverlay"
  ) {
    return;
  }

  const overlay = $("logoutOverlay");

  if (overlay) {
    overlay.classList.remove("show");
  }

  document.body.style.overflow = "";
}

async function confirmLogout() {
  if (isLoggingOut) return;

  isLoggingOut = true;

  const button = $("confirmLogoutBtn");

  if (button) {
    button.disabled = true;
    button.textContent = "Logging out...";
  }

  try {
    if (realtimeChannel) {
      await supabaseClient.removeChannel(realtimeChannel);
      realtimeChannel = null;
    }

    if (requestRealtimeChannel) {
      await supabaseClient.removeChannel(requestRealtimeChannel);
      requestRealtimeChannel = null;
    }

    const { error } = await supabaseClient.auth.signOut();

    if (error) {
      throw error;
    }

    window.location.replace("login.html");

  } catch (error) {
    console.error("Logout error:", error);

    isLoggingOut = false;

    if (button) {
      button.disabled = false;
      button.textContent = "Logout";
    }

    toast(error.message || "Logout failed. Please try again.");
  }
}

/* AUTH STATE */

function setupAuthListener() {
  const result = supabaseClient.auth.onAuthStateChange(event => {
    if (event === "SIGNED_OUT" && !isLoggingOut) {
      if (realtimeChannel) {
        supabaseClient.removeChannel(realtimeChannel);
        realtimeChannel = null;
      }

      if (requestRealtimeChannel) {
        supabaseClient.removeChannel(requestRealtimeChannel);
        requestRealtimeChannel = null;
      }

      window.location.replace("login.html");
    }
  });

  authListener = result.data?.subscription || null;
}

/* ESC KEY */

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeLogoutPopup();
  }
});

/* ASK FOR NOTIFICATION PERMISSION AFTER USER GESTURE */

document.addEventListener("click", event => {
  const target = event.target;

  if (!(target instanceof Element)) return;

  if (
    target.closest(".notification") ||
    target.closest("#logoutOverlay") ||
    target.closest(".filter-btn") ||
    target.closest("#markAllBtn")
  ) {
    return;
  }

  if (
    currentUser &&
    "Notification" in window &&
    Notification.permission === "default"
  ) {
    requestBrowserNotificationPermission();
  }
}, { once: true });

/* INITIALIZE PAGE */

async function initializePage() {
  try {
    clearError();
    showInfo("");

    const { data, error } = await supabaseClient.auth.getUser();

    if (error || !data?.user) {
      window.location.replace("login.html");
      return;
    }

    currentUser = data.user;

    await Promise.all([
      loadProfile(),
      loadNotifications(),
      refreshRequestNavigation()
    ]);

    subscribeRealtime();
    subscribeRequestRealtime();
    setupAuthListener();

  } catch (error) {
    console.error("Notifications initialization error:", error);

    showError(
      error.message || "Unable to initialize the notifications page."
    );
  }
}

document.addEventListener("DOMContentLoaded", initializePage);
</script>
