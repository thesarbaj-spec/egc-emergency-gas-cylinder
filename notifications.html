<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EGC - Notifications</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #0754a9;
      --primary-dark: #003e81;
      --primary-light: #eaf5fc;
      --background: #eef7fc;
      --text: #164f82;
      --muted: #71869a;
      --border: #e1edf5;
      --danger: #d33b3b;
      --success: #078653;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--background);
      color: var(--primary-dark);
      min-height: 100vh;
    }

    button {
      font-family: Arial, sans-serif;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .topbar {
      height: 72px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 35px;
      box-shadow: 0 3px 15px rgba(0, 62, 129, 0.08);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      width: 115px;
      height: 48px;
      object-fit: contain;
    }

    .brand-text {
      font-size: 13px;
      color: #70859a;
    }

    .profile-mini {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .profile-info {
      min-width: 0;
    }

    .profile-photo {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      object-fit: cover;
      background: #dfeef8;
      border: 2px solid #e1edf5;
    }

    .profile-name {
      font-weight: 800;
      color: var(--primary-dark);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .profile-email {
      color: #8295a6;
      font-size: 11px;
      margin-top: 3px;
      overflow-wrap: anywhere;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 72px);
    }

    .sidebar {
      width: 235px;
      background: #fff;
      border-right: 1px solid var(--border);
      padding: 25px 14px;
      position: fixed;
      left: 0;
      top: 72px;
      bottom: 0;
      z-index: 40;
    }

    .nav-title {
      font-size: 11px;
      color: #94a5b5;
      font-weight: 800;
      padding: 8px 13px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: #58738d;
      padding: 13px 14px;
      border-radius: 11px;
      text-align: left;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 5px;
      transition: 0.15s;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: var(--primary-light);
      color: var(--primary);
    }

    .logout {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 20px;
      width: calc(100% - 28px);
      color: var(--danger);
    }

    .logout:hover {
      background: #fff0f0;
      color: #c62828;
    }

    .main {
      margin-left: 235px;
      width: calc(100% - 235px);
      min-width: 0;
      padding: 30px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 20px;
    }

    .page-header h1 {
      font-size: 28px;
      color: var(--primary-dark);
      margin-bottom: 7px;
    }

    .page-header p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .header-btn {
      border: 0;
      min-height: 44px;
      padding: 0 17px;
      border-radius: 12px;
      background: #fff;
      color: var(--primary);
      font-weight: 800;
      box-shadow: 0 5px 18px rgba(0, 62, 129, 0.08);
      transition: 0.15s;
    }

    .header-btn:hover {
      background: var(--primary-light);
    }

    .header-btn.danger {
      color: #c62828;
    }

    .header-btn.danger:hover {
      background: #fff0f0;
    }

    .error-box {
      display: none;
      background: #fff0f0;
      border: 1px solid #ffd0d0;
      color: #c62828;
      padding: 13px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 13px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .info-box {
      display: none;
      background: #fff9e8;
      border: 1px solid #f3df9b;
      color: #805c00;
      padding: 13px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 13px;
      line-height: 1.5;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 17px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: #fff;
      border: 1px solid #e2edf4;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 7px 22px rgba(0, 62, 129, 0.06);
      min-width: 0;
    }

    .stat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 13px;
    }

    .stat-label {
      color: #7b8fa1;
      font-size: 13px;
      font-weight: 700;
    }

    .stat-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .stat-number {
      font-size: 27px;
      font-weight: 900;
      color: var(--primary-dark);
    }

    .box {
      background: #fff;
      border: 1px solid #e2edf4;
      border-radius: 20px;
      padding: 23px;
      box-shadow: 0 7px 22px rgba(0, 62, 129, 0.06);
      min-width: 0;
    }

    .box-title {
      font-size: 18px;
      font-weight: 900;
      color: var(--primary-dark);
      margin-bottom: 18px;
    }

    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 1px solid #dce8ef;
      background: #fff;
      color: #668095;
      border-radius: 10px;
      padding: 10px 14px;
      min-height: 40px;
      font-size: 12px;
      font-weight: 800;
      transition: 0.15s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--primary-light);
      border-color: #cce5f5;
      color: var(--primary);
    }

    .mark-all-btn {
      border: 0;
      background: var(--primary);
      color: #fff;
      border-radius: 10px;
      min-height: 40px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 900;
      transition: 0.15s;
    }

    .mark-all-btn:hover {
      background: #00488f;
    }

    .notifications-list {
      display: flex;
      flex-direction: column;
    }

    .notification {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 17px 5px;
      border-bottom: 1px solid #edf3f7;
      position: relative;
      min-width: 0;
    }

    .notification:last-child {
      border-bottom: 0;
    }

    .notification.unread {
      background: #f7fbff;
      border-radius: 13px;
      padding: 17px 12px;
      margin-bottom: 7px;
      border: 1px solid #e4f1fa;
    }

    .notification-icon {
      width: 45px;
      min-width: 45px;
      height: 45px;
      border-radius: 13px;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .notification-content {
      flex: 1;
      min-width: 0;
    }

    .notification-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .notification-title {
      font-size: 14px;
      font-weight: 900;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .notification-message {
      color: #49677f;
      font-size: 13px;
      margin-top: 5px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .notification-date {
      font-size: 10px;
      color: #91a0ad;
      margin-top: 7px;
      line-height: 1.5;
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      min-width: 8px;
      border-radius: 50%;
      background: #0872d5;
    }

    .notification-actions {
      display: flex;
      gap: 7px;
      margin-top: 10px;
    }

    .read-btn {
      border: 0;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 8px;
      min-height: 32px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 900;
    }

    .read-btn:hover {
      background: #dceef9;
    }

    .read-label {
      font-size: 10px;
      color: var(--success);
      font-weight: 800;
      padding-top: 6px;
    }

    .empty,
    .loading {
      text-align: center;
      padding: 45px 15px;
      color: #8a9aaa;
      font-size: 13px;
      line-height: 1.6;
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .mobile-nav {
      display: none;
    }

    .toast {
      position: fixed;
      right: 25px;
      bottom: 25px;
      z-index: 10001;
      max-width: min(450px, calc(100vw - 30px));
      background: var(--primary-dark);
      color: #fff;
      padding: 13px 18px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: 0.2s;
      overflow-wrap: anywhere;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .logout-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 20, 40, 0.55);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .logout-overlay.show {
      display: flex;
    }

    .logout-popup {
      width: 100%;
      max-width: 390px;
      background: #fff;
      border-radius: 22px;
      padding: 28px 25px 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      text-align: center;
      animation: logoutPopupIn 0.18s ease-out;
    }

    @keyframes logoutPopupIn {
      from {
        opacity: 0;
        transform: scale(0.94) translateY(8px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .logout-icon {
      width: 58px;
      height: 58px;
      border-radius: 17px;
      background: #fff0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
    }

    .logout-title {
      font-size: 21px;
      font-weight: 900;
      color: #173f62;
      margin-bottom: 10px;
    }

    .logout-subtitle {
      font-size: 13px;
      color: #7c8d9c;
      line-height: 1.5;
      margin-bottom: 23px;
    }

    .logout-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .logout-cancel-btn,
    .logout-confirm-btn {
      min-height: 48px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 900;
      transition: 0.15s;
    }

    .logout-cancel-btn {
      background: #fff;
      color: #31526d;
      border: 1px solid #d7e2ea;
    }

    .logout-cancel-btn:hover {
      background: #f5f8fa;
    }

    .logout-confirm-btn {
      background: #e53935;
      color: #fff;
      border: 1px solid #e53935;
    }

    .logout-confirm-btn:hover {
      background: #c62828;
      border-color: #c62828;
    }

    @media (max-width: 1050px) {
      .main {
        padding: 25px 20px;
      }

      .stats {
        gap: 12px;
      }

      .stat-card {
        padding: 16px;
      }
    }

    @media (max-width: 800px) {
      .sidebar {
        display: none;
      }

      .main {
        margin-left: 0;
        width: 100%;
        padding: 20px 15px 90px;
      }

      .topbar {
        height: 65px;
        padding: 0 15px;
      }

      .layout {
        min-height: calc(100vh - 65px);
      }

      .brand img {
        width: 100px;
      }

      .brand-text,
      .profile-email {
        display: none;
      }

      .profile-photo {
        width: 38px;
        height: 38px;
      }

      .page-header {
        align-items: flex-start;
      }

      .page-header h1 {
        font-size: 23px;
      }

      .page-header p {
        font-size: 12px;
      }

      .header-actions {
        display: none;
      }

      .stats {
        gap: 10px;
      }

      .stat-card {
        padding: 14px 11px;
      }

      .stat-label {
        font-size: 10px;
      }

      .stat-number {
        font-size: 21px;
      }

      .stat-icon {
        width: 32px;
        height: 32px;
        font-size: 16px;
      }

      .box {
        padding: 18px;
        border-radius: 17px;
      }

      .box-title {
        font-size: 17px;
      }

      .filter-row {
        align-items: stretch;
      }

      .filter-buttons {
        width: 100%;
      }

      .filter-btn {
        flex: 1;
      }

      .mark-all-btn {
        width: 100%;
      }

      .notification {
        gap: 11px;
      }

      .notification-icon {
        width: 40px;
        min-width: 40px;
        height: 40px;
        font-size: 18px;
      }

      .notification-title {
        font-size: 13px;
      }

      .notification-message {
        font-size: 12px;
      }

      .mobile-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        min-height: 67px;
        padding: 5px 3px;
        background: #fff;
        border-top: 1px solid #dce8ef;
        z-index: 100;
        justify-content: space-around;
        align-items: center;
        box-shadow: 0 -5px 20px rgba(0, 62, 129, 0.08);
      }

      .mobile-nav button {
        flex: 1;
        min-width: 0;
        min-height: 50px;
        border: 0;
        background: transparent;
        color: #7890a3;
        font-size: 10px;
        font-weight: 800;
      }

      .mobile-nav button span {
        display: block;
        font-size: 20px;
        margin-bottom: 3px;
      }

      .mobile-nav button.active {
        color: var(--primary);
      }

      .logout-popup {
        max-width: 350px;
        padding: 25px 20px 21px;
      }

      .logout-title {
        font-size: 20px;
      }

      .toast {
        left: 15px;
        right: 15px;
        bottom: 80px;
        max-width: none;
        text-align: center;
      }
    }

    @media (max-width: 450px) {
      .stats {
        gap: 8px;
      }

      .stat-card {
        padding: 13px 8px;
      }

      .stat-number {
        font-size: 19px;
      }

      .stat-label {
        font-size: 9px;
      }

      .stat-icon {
        width: 30px;
        height: 30px;
        font-size: 15px;
      }

      .notification.unread {
        padding-left: 9px;
        padding-right: 9px;
      }

      .notification-icon {
        width: 37px;
        min-width: 37px;
        height: 37px;
        font-size: 16px;
      }

      .notification-top {
        align-items: flex-start;
      }

      .notification-title {
        line-height: 1.45;
      }

      .box {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="brand">
      <img
        src="assets/EGC - Emergency Gas Cylinder logo.png"
        alt="EGC"
        onerror="this.style.display='none'"
      >

      <div class="brand-text">
        Emergency Gas Cylinder
      </div>
    </div>

    <div class="profile-mini">
      <div class="profile-info">
        <div class="profile-name" id="topName">Loading...</div>
        <div class="profile-email" id="topEmail">Loading...</div>
      </div>

      <img
        id="topPhoto"
        class="profile-photo"
        src=""
        alt="Profile photo"
      >
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar">
      <div class="nav-title">MENU</div>

      <button class="nav-btn" onclick="goPage('dashboard.html')">
        🏠 &nbsp; Dashboard
      </button>

      <button class="nav-btn" onclick="goPage('request-cylinder.html')">
        🛢️ &nbsp; Request Cylinder
      </button>

      <button class="nav-btn" onclick="goPage('my-requests.html')">
        📋 &nbsp; My Requests
      </button>

      <button class="nav-btn" onclick="goPage('payments.html')">
        💰 &nbsp; Payments
      </button>

      <button class="nav-btn active" onclick="goPage('notifications.html')">
        🔔 &nbsp; Notifications
      </button>

      <button class="nav-btn" onclick="goPage('profile.html')">
        👤 &nbsp; Profile
      </button>

      <button class="nav-btn" onclick="goPage('setting.html')">
        ⚙️ &nbsp; Settings
      </button>

      <button class="nav-btn" onclick="goPage('help-support.html')">
        ❓ &nbsp; Help &amp; Support
      </button>

      <button class="nav-btn logout" onclick="openLogoutPopup()">
        🚪 &nbsp; Logout
      </button>
    </aside>

    <main class="main">

      <div id="errorBox" class="error-box" role="alert"></div>

      <div id="infoBox" class="info-box" role="status"></div>

      <section class="page-header">
        <div>
          <h1>Notifications</h1>
          <p>Stay updated about your EGC requests, payments and deliveries.</p>
        </div>

        <div class="header-actions">
          <button class="header-btn" onclick="goPage('dashboard.html')">
            🏠 Dashboard
          </button>

          <button class="header-btn danger" onclick="openLogoutPopup()">
            🚪 Logout
          </button>
        </div>
      </section>

      <section class="stats">
        <div class="stat-card">
          <div class="stat-top">
            <div class="stat-label">Total</div>
            <div class="stat-icon">🔔</div>
          </div>
          <div class="stat-number" id="totalNotifications">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-top">
            <div class="stat-label">Unread</div>
            <div class="stat-icon">🔵</div>
          </div>
          <div class="stat-number" id="unreadNotifications">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-top">
            <div class="stat-label">Read</div>
            <div class="stat-icon">✅</div>
          </div>
          <div class="stat-number" id="readNotifications">0</div>
        </div>
      </section>

      <section class="box">
        <div class="box-title">🔔 Your Notifications</div>

        <div class="filter-row">
          <div class="filter-buttons">
            <button
              class="filter-btn active"
              id="filterAll"
              onclick="setFilter('all')"
            >
              All
            </button>

            <button
              class="filter-btn"
              id="filterUnread"
              onclick="setFilter('unread')"
            >
              Unread
            </button>

            <button
              class="filter-btn"
              id="filterRead"
              onclick="setFilter('read')"
            >
              Read
            </button>
          </div>

          <button
            class="mark-all-btn"
            id="markAllBtn"
            onclick="markAllAsRead()"
          >
            ✓ Mark All as Read
          </button>
        </div>

        <div id="notificationsList" class="notifications-list" aria-live="polite">
          <div class="loading">Loading notifications...</div>
        </div>
      </section>

    </main>
  </div>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <button onclick="goPage('dashboard.html')">
      <span>🏠</span>
      Home
    </button>

    <button onclick="goPage('my-requests.html')">
      <span>📋</span>
      Requests
    </button>

    <button onclick="goPage('request-cylinder.html')">
      <span>➕</span>
      Request
    </button>

    <button onclick="goPage('payments.html')">
      <span>💰</span>
      Payments
    </button>

    <button class="active" onclick="goPage('notifications.html')">
      <span>🔔</span>
      Alerts
    </button>
  </nav>

  <div
    class="logout-overlay"
    id="logoutOverlay"
    onclick="closeLogoutPopup(event)"
  >
    <div class="logout-popup" onclick="event.stopPropagation()">
      <div class="logout-icon">🚪</div>

      <div class="logout-title">Are you sure you want to log out?</div>

      <div class="logout-subtitle">
        Emergency Gas Cylinder
      </div>

      <div class="logout-buttons">
        <button
          type="button"
          class="logout-cancel-btn"
          onclick="closeLogoutPopup()"
        >
          Cancel
        </button>

        <button
          type="button"
          class="logout-confirm-btn"
          id="confirmLogoutBtn"
          onclick="confirmLogout()"
        >
          Logout
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    /*
     * SUPABASE CONFIGURATION
     */
    const SUPABASE_URL =
      "https://szefvmvokkhvnzryodqu.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_S8aSsfmOKN6_7laRfgoMKA_Re2HzRS6";

    if (!window.supabase) {
      document.getElementById("errorBox").textContent =
        "Supabase library could not be loaded. Please refresh this page.";
      document.getElementById("errorBox").style.display = "block";
      throw new Error("Supabase JS library not loaded.");
    }

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    let currentUser = null;
    let currentProfile = null;
    let notifications = [];
    let currentFilter = "all";
    let realtimeChannel = null;
    let toastTimer = null;
    let isLoggingOut = false;
    let authListener = null;

    const $ = (id) => document.getElementById(id);

    /*
     * SAFE TEXT / DATE HELPERS
     */
    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDateTime(value) {
      if (!value) return "Date unavailable";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "Date unavailable";
      }

      return date.toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function showError(message) {
      const box = $("errorBox");
      box.textContent = message || "Something went wrong.";
      box.style.display = "block";
    }

    function clearError() {
      $("errorBox").textContent = "";
      $("errorBox").style.display = "none";
    }

    function showInfo(message) {
      const box = $("infoBox");
      box.textContent = message || "";
      box.style.display = message ? "block" : "none";
    }

    function toast(message) {
      const element = $("toast");
      element.textContent = message || "";
      element.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        element.classList.remove("show");
      }, 3000);
    }

    /*
     * PAGE NAVIGATION
     */
    function goPage(page) {
      if (!page) return;
      window.location.href = page;
    }

    /*
     * PROFILE
     */
    function setDefaultProfilePhoto(name) {
      const safeName = encodeURIComponent(name || "EGC");

      $("topPhoto").src =
        "https://ui-avatars.com/api/?name=" +
        safeName +
        "&background=eaf5fc&color=0754a9&bold=true";
    }

    async function loadProfile() {
      if (!currentUser?.id) return;

      const { data, error } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();

      if (error) {
        console.warn("Profile load error:", error.message);
        setProfileHeaderFallback();
        return;
      }

      currentProfile = data || null;

      if (!data) {
        setProfileHeaderFallback();
        return;
      }

      const name = data.full_name || "EGC Customer";
      const email = data.email || currentUser.email || "";

      $("topName").textContent = name;
      $("topEmail").textContent = email;

      if (data.profile_photo) {
        $("topPhoto").src = data.profile_photo;
        $("topPhoto").onerror = () => {
          setDefaultProfilePhoto(name);
        };
      } else {
        setDefaultProfilePhoto(name);
      }
    }

    function setProfileHeaderFallback() {
      const name = "EGC Customer";

      $("topName").textContent = name;
      $("topEmail").textContent = currentUser?.email || "";

      setDefaultProfilePhoto(name);
    }

    /*
     * NOTIFICATION TYPE / ICON
     *
     * Supports common notification types used for:
     * requests, payments, owner approvals, delivery,
     * repayment and system updates.
     */
    function notificationIcon(type) {
      const value = String(type || "general").toLowerCase();

      if (
        value.includes("payment") ||
        value.includes("transaction") ||
        value.includes("repayment")
      ) {
        return "💳";
      }

      if (
        value.includes("request") ||
        value.includes("cylinder")
      ) {
        return "🛢️";
      }

      if (
        value.includes("approval") ||
        value.includes("approved") ||
        value.includes("verified")
      ) {
        return "✅";
      }

      if (
        value.includes("reject") ||
        value.includes("cancel")
      ) {
        return "❌";
      }

      if (
        value.includes("delivery") ||
        value.includes("delivered")
      ) {
        return "🚚";
      }

      if (
        value.includes("processing") ||
        value.includes("agency")
      ) {
        return "⚙️";
      }

      if (value.includes("complete")) {
        return "🎉";
      }

      if (value.includes("system")) {
        return "⚙️";
      }

      return "🔔";
    }

    /*
     * LOAD NOTIFICATIONS
     *
     * Each customer sees only their own rows.
     * Owner notifications require separate owner rows
     * and suitable Supabase RLS policies.
     */
    async function loadNotifications() {
      if (!currentUser?.id) return;

      $("notificationsList").innerHTML =
        '<div class="loading">Loading notifications...</div>';

      const { data, error } = await supabaseClient
        .from("notifications")
        .select(
          "id,user_id,title,message,notification_type,is_read,created_at"
        )
        .eq("user_id", currentUser.id)
        .order("created_at", { ascending: false })
        .limit(100);

      if (error) {
        console.error("Notifications load error:", error);

        notifications = [];
        updateStats();

        $("notificationsList").innerHTML =
          '<div class="empty">' +
            '<div class="empty-icon">⚠️</div>' +
            '<div>Unable to load notifications.</div>' +
            '<div>Please check the notifications table and RLS policies.</div>' +
          '</div>';

        showError(
          "Notifications could not be loaded: " + error.message
        );

        return;
      }

      clearError();

      notifications = Array.isArray(data) ? data : [];

      updateStats();
      renderNotifications();
    }

    /*
     * STATISTICS
     */
    function updateStats() {
      const total = notifications.length;

      const unread = notifications.filter(
        item => item.is_read !== true
      ).length;

      const read = total - unread;

      $("totalNotifications").textContent = String(total);
      $("unreadNotifications").textContent = String(unread);
      $("readNotifications").textContent = String(read);

      $("markAllBtn").disabled = unread === 0;
    }

    /*
     * FILTERS
     */
    function setFilter(filter) {
      if (!["all", "unread", "read"].includes(filter)) {
        return;
      }

      currentFilter = filter;

      document.querySelectorAll(".filter-btn").forEach(button => {
        button.classList.remove("active");
      });

      const activeButton = {
        all: $("filterAll"),
        unread: $("filterUnread"),
        read: $("filterRead")
      }[filter];

      if (activeButton) {
        activeButton.classList.add("active");
      }

      renderNotifications();
    }

    function getFilteredNotifications() {
      if (currentFilter === "unread") {
        return notifications.filter(item => item.is_read !== true);
      }

      if (currentFilter === "read") {
        return notifications.filter(item => item.is_read === true);
      }

      return notifications;
    }

    /*
     * RENDER NOTIFICATIONS
     */
    function renderNotifications() {
      const list = $("notificationsList");
      const filtered = getFilteredNotifications();

      if (!filtered.length) {
        let message = "No notifications yet.";

        if (currentFilter === "unread") {
          message = "You have no unread notifications.";
        } else if (currentFilter === "read") {
          message = "You have no read notifications.";
        }

        list.innerHTML =
          '<div class="empty">' +
            '<div class="empty-icon">🔔</div>' +
            '<div>' + escapeHtml(message) + '</div>' +
          '</div>';

        return;
      }

      list.innerHTML = filtered.map(item => {
        const unread = item.is_read !== true;

        const title = escapeHtml(item.title || "Notification");
        const message = escapeHtml(item.message || "");
        const date = escapeHtml(formatDateTime(item.created_at));
        const id = escapeHtml(item.id);
        const icon = notificationIcon(item.notification_type);

        return `
          <article
            class="notification ${unread ? "unread" : ""}"
            data-notification-id="${id}"
          >
            <div class="notification-icon" aria-hidden="true">
              ${icon}
            </div>

            <div class="notification-content">
              <div class="notification-top">
                <div class="notification-title">${title}</div>

                ${
                  unread
                    ? '<div class="unread-dot" title="Unread" aria-label="Unread"></div>'
                    : ''
                }
              </div>

              <div class="notification-message">${message}</div>

              <div class="notification-date">${date}</div>

              <div class="notification-actions">
                ${
                  unread
                    ? `
                      <button
                        type="button"
                        class="read-btn"
                        data-read-id="${id}"
                      >
                        ✓ Mark as read
                      </button>
                    `
                    : '<span class="read-label">✓ Read</span>'
                }
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    /*
     * MARK ONE NOTIFICATION AS READ
     */
    async function markNotificationRead(id) {
      if (!id || !currentUser?.id) {
        return false;
      }

      const item = notifications.find(
        notification => String(notification.id) === String(id)
      );

      if (!item || item.is_read === true) {
        return true;
      }

      const { data, error } = await supabaseClient
        .from("notifications")
        .update({ is_read: true })
        .eq("id", id)
        .eq("user_id", currentUser.id)
        .select("id,is_read")
        .maybeSingle();

      if (error) {
        console.error("Mark notification read error:", error);
        toast("Unable to mark as read: " + error.message);
        return false;
      }

      if (!data) {
        toast("Notification was not updated. Please check access policies.");
        return false;
      }

      item.is_read = true;

      updateStats();
      renderNotifications();

      return true;
    }

    /*
     * MARK ALL NOTIFICATIONS AS READ
     */
    async function markAllAsRead() {
      if (!currentUser?.id) return;

      const unread = notifications.filter(
        item => item.is_read !== true
      );

      if (!unread.length) {
        toast("All notifications are already read.");
        return;
      }

      const button = $("markAllBtn");
      button.disabled = true;
      button.textContent = "Marking...";

      const { error } = await supabaseClient
        .from("notifications")
        .update({ is_read: true })
        .eq("user_id", currentUser.id)
        .eq("is_read", false);

      if (error) {
        console.error("Mark all read error:", error);

        button.textContent = "✓ Mark All as Read";
        updateStats();

        toast("Unable to mark notifications as read: " + error.message);
        return;
      }

      notifications = notifications.map(item => ({
        ...item,
        is_read: true
      }));

      updateStats();
      renderNotifications();

      button.textContent = "✓ Mark All as Read";
      toast("All notifications marked as read.");
    }

    /*
     * DELEGATED CLICK HANDLER
     */
    $("notificationsList").addEventListener("click", async event => {
      const button = event.target.closest("[data-read-id]");

      if (!button) return;

      const id = button.getAttribute("data-read-id");

      if (!id) return;

      button.disabled = true;
      button.textContent = "Updating...";

      await markNotificationRead(id);
    });

    /*
     * REALTIME SUBSCRIPTION
     *
     * INSERT:
     * New notification appears immediately.
     *
     * UPDATE:
     * Read/unread state is refreshed.
     */
    function subscribeRealtime() {
      if (!currentUser?.id) return;

      if (realtimeChannel) {
        supabaseClient.removeChannel(realtimeChannel);
        realtimeChannel = null;
      }

      realtimeChannel = supabaseClient
        .channel("customer-notifications-" + currentUser.id)

        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "notifications",
            filter: "user_id=eq." + currentUser.id
          },
          payload => {
            const item = payload.new;

            if (!item) return;

            const exists = notifications.some(
              oldItem => String(oldItem.id) === String(item.id)
            );

            if (exists) return;

            notifications.unshift(item);
            notifications = notifications.slice(0, 100);

            updateStats();
            renderNotifications();

            showBrowserNotification(item);
            toast(item.title || "New EGC notification");
          }
        )

        .on(
          "postgres_changes",
          {
            event: "UPDATE",
            schema: "public",
            table: "notifications",
            filter: "user_id=eq." + currentUser.id
          },
          payload => {
            const updated = payload.new;

            if (!updated) return;

            const index = notifications.findIndex(
              item => String(item.id) === String(updated.id)
            );

            if (index !== -1) {
              notifications[index] = {
                ...notifications[index],
                ...updated
              };
            } else {
              notifications.unshift(updated);
              notifications = notifications.slice(0, 100);
            }

            updateStats();
            renderNotifications();
          }
        )

        .subscribe(status => {
          console.log("EGC notification realtime status:", status);
        });
    }

    /*
     * BROWSER NOTIFICATIONS
     *
     * Permission is requested after a user gesture,
     * not automatically when the page first opens.
     */
    async function requestBrowserNotificationPermission() {
      if (!("Notification" in window)) {
        toast("Browser notifications are not supported here.");
        return;
      }

      if (Notification.permission === "granted") {
        toast("Browser notifications are already enabled.");
        return;
      }

      if (Notification.permission === "denied") {
        toast("Browser notifications are blocked in browser settings.");
        return;
      }

      try {
        const permission = await Notification.requestPermission();

        if (permission === "granted") {
          toast("Browser notifications enabled.");
        } else {
          toast("Browser notifications were not enabled.");
        }
      } catch (error) {
        console.warn("Notification permission error:", error);
        toast("Unable to request browser notification permission.");
      }
    }

    function showBrowserNotification(item) {
      if (!("Notification" in window)) return;
      if (Notification.permission !== "granted") return;

      try {
        const browserNotification = new Notification(
          item.title || "EGC Notification",
          {
            body: item.message || "You have a new notification.",
            icon: "assets/EGC - Emergency Gas Cylinder logo.png",
            tag: String(item.id || Date.now())
          }
        );

        browserNotification.onclick = () => {
          window.focus();
          browserNotification.close();
        };
      } catch (error) {
        console.warn("Browser notification error:", error);
      }
    }

    /*
     * LOGOUT POPUP
     */
    function openLogoutPopup() {
      $("logoutOverlay").classList.add("show");
      document.body.style.overflow = "hidden";
    }

    function closeLogoutPopup(event) {
      if (
        event &&
        event.target &&
        event.target.id !== "logoutOverlay"
      ) {
        return;
      }

      $("logoutOverlay").classList.remove("show");
      document.body.style.overflow = "";
    }

    async function confirmLogout() {
      if (isLoggingOut) return;

      isLoggingOut = true;

      const button = $("confirmLogoutBtn");
      button.disabled = true;
      button.textContent = "Logging out...";

      try {
        if (realtimeChannel) {
          await supabaseClient.removeChannel(realtimeChannel);
          realtimeChannel = null;
        }

        const { error } = await supabaseClient.auth.signOut();

        if (error) {
          throw error;
        }

        window.location.replace("login.html");
      } catch (error) {
        console.error("Logout error:", error);

        isLoggingOut = false;
        button.disabled = false;
        button.textContent = "Logout";

        toast(error.message || "Logout failed. Please try again.");
      }
    }

    /*
     * AUTH STATE
     */
    function setupAuthListener() {
      const result = supabaseClient.auth.onAuthStateChange(
        (event) => {
          if (event === "SIGNED_OUT" && !isLoggingOut) {
            if (realtimeChannel) {
              supabaseClient.removeChannel(realtimeChannel);
              realtimeChannel = null;
            }

            window.location.replace("login.html");
          }
        }
      );

      authListener = result.data?.subscription || null;
    }

    /*
     * ESC KEY
     */
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeLogoutPopup();
      }
    });

    /*
     * ASK FOR BROWSER NOTIFICATION PERMISSION
     * Only after a real user gesture.
     */
    document.addEventListener("click", event => {
      const target = event.target;

      if (!(target instanceof Element)) return;

      if (
        target.closest(".notification") ||
        target.closest("#logoutOverlay") ||
        target.closest(".filter-btn") ||
        target.closest("#markAllBtn")
      ) {
        return;
      }

      if (
        currentUser &&
        "Notification" in window &&
        Notification.permission === "default"
      ) {
        requestBrowserNotificationPermission();
      }
    }, { once: true });

    /*
     * INITIALIZE PAGE
     */
    async function initializePage() {
      try {
        clearError();
        showInfo("");

        const { data, error } = await supabaseClient.auth.getUser();

        if (error || !data?.user) {
          window.location.replace("login.html");
          return;
        }

        currentUser = data.user;

        await loadProfile();
        await loadNotifications();

        subscribeRealtime();
        setupAuthListener();

      } catch (error) {
        console.error("Notifications initialization error:", error);

        showError(
          error.message || "Unable to initialize the notifications page."
        );
      }
    }

    document.addEventListener("DOMContentLoaded", initializePage);
  </script>

</body>
