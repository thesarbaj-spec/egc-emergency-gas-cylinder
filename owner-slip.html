<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EGC - Payment Slip</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --blue:#0871c3;
    --dark:#06477f;
    --text:#31566f;
    --muted:#8194a4;
    --border:#dce6ef;
    --green:#18803d;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:var(--dark);
    min-height:100vh;
    background:
        radial-gradient(circle at 8% 8%,rgba(255,190,190,.34),transparent 30%),
        radial-gradient(circle at 92% 12%,rgba(180,220,255,.38),transparent 30%),
        radial-gradient(circle at 50% 100%,rgba(220,235,255,.34),transparent 38%),
        #fff;
}

button{
    font-family:inherit;
}

.header{
    height:78px;
    background:rgba(255,255,255,.96);
    border-bottom:1px solid #dfe8ef;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(12px);
}

.header-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.menu-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:12px;
    background:#eef7ff;
    color:#075ca5;
    font-size:22px;
    cursor:pointer;
    display:none;
}

.logo{
    height:57px;
    width:auto;
    object-fit:contain;
}

.owner-title{
    font-size:20px;
    font-weight:800;
    color:var(--dark);
}

.owner-subtitle{
    font-size:12px;
    color:var(--muted);
    margin-top:3px;
}

.owner-badge{
    display:flex;
    align-items:center;
    gap:9px;
    background:#eef8ff;
    padding:9px 14px;
    border-radius:12px;
    color:#075ca5;
    font-size:14px;
    font-weight:700;
}

.owner-dot{
    width:9px;
    height:9px;
    background:#20a45a;
    border-radius:50%;
}

.layout{
    display:flex;
    min-height:calc(100vh - 78px);
}

.sidebar{
    width:245px;
    background:linear-gradient(
        180deg,
        rgba(255,245,245,.98) 0%,
        rgba(242,248,255,.98) 52%,
        rgba(255,255,255,.98) 100%
    );
    border-right:1px solid #e1e9f0;
    padding:25px 15px;
    flex-shrink:0;
    box-shadow:5px 0 25px rgba(60,90,120,.05);
    display:flex;
    flex-direction:column;
}

.sidebar-title{
    color:#7990a4;
    font-size:13px;
    font-weight:800;
    padding:0 13px 12px;
    text-transform:uppercase;
    letter-spacing:.5px;
}

.nav-btn{
    width:100%;
    border:0;
    background:transparent;
    color:#496a82;
    padding:13px 14px;
    border-radius:11px;
    margin-bottom:5px;
    text-align:left;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.nav-btn:hover{
    background:#e5f2fc;
    color:#075ca5;
}

.nav-btn.active{
    background:linear-gradient(135deg,#eaf6ff,#fff0f0);
    color:#075ca5;
    box-shadow:0 4px 12px rgba(60,120,170,.08);
}

.nav-icon{
    display:inline-block;
    width:25px;
    font-size:17px;
}

.sidebar-bottom{
    margin-top:auto;
    padding-top:12px;
}

.sidebar-logout{
    color:#c72e2e;
    background:rgba(255,241,241,.7);
}

.sidebar-logout:hover{
    background:#ffe3e3;
    color:#b92727;
}

.main{
    flex:1;
    padding:30px;
    min-width:0;
}

.page-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:22px;
}

.page-heading h1{
    font-size:28px;
    color:var(--dark);
    font-weight:800;
    margin-bottom:6px;
}

.page-heading p{
    color:#7890a3;
    font-size:14px;
    line-height:1.6;
}

.top-actions{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
}

.top-btn{
    min-height:42px;
    border:0;
    border-radius:10px;
    padding:0 16px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
}

.back-btn{
    background:#eef4f8;
    color:#527087;
}

.print-btn{
    background:#0871c3;
    color:#fff;
}

.slip-area{
    max-width:950px;
    margin:0 auto;
}

.slip-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:0 12px 38px rgba(50,80,110,.09);
    overflow:hidden;
}

.slip-header{
    padding:24px 28px;
    border-bottom:1px solid #e7eef4;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.slip-brand{
    display:flex;
    align-items:center;
    gap:15px;
    min-width:0;
}

.slip-logo{
    height:62px;
    width:auto;
    object-fit:contain;
}

.slip-brand-title{
    color:var(--dark);
    font-size:21px;
    font-weight:900;
}

.slip-brand-subtitle{
    color:#8496a5;
    font-size:11px;
    margin-top:4px;
}

.receipt-box{
    text-align:right;
    min-width:0;
}

.receipt-label{
    color:#91a0ac;
    font-size:10px;
    text-transform:uppercase;
    font-weight:800;
    margin-bottom:5px;
}

.receipt-number{
    color:var(--blue);
    font-size:14px;
    font-weight:900;
    word-break:break-all;
}

.status-row{
    padding:18px 28px;
    background:linear-gradient(135deg,#f7fbff,#fff8f8);
    border-bottom:1px solid #e7eef4;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.status-left-title{
    color:var(--dark);
    font-size:14px;
    font-weight:800;
}

.status-left-sub{
    color:#8a9aa8;
    font-size:11px;
    margin-top:4px;
    line-height:1.5;
}

.badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:8px 13px;
    border-radius:22px;
    font-size:11px;
    font-weight:900;
    text-align:center;
    line-height:1.3;
}

.badge-green{
    background:#eaf9ef;
    color:#18803d;
}

.badge-yellow{
    background:#fff7df;
    color:#a36b00;
}

.badge-blue{
    background:#edf6ff;
    color:#086db7;
}

.badge-red{
    background:#fff0f0;
    color:#c72e2e;
}

.badge-gray{
    background:#f0f3f5;
    color:#617687;
}

.slip-body{
    padding:28px;
}

.section{
    margin-bottom:25px;
    break-inside:avoid;
}

.section:last-child{
    margin-bottom:0;
}

.section-title{
    color:var(--dark);
    font-size:14px;
    font-weight:900;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:8px;
}

.section-title::before{
    content:"";
    width:4px;
    height:17px;
    border-radius:5px;
    background:var(--blue);
    flex-shrink:0;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
}

.info-box{
    background:#f8fafc;
    border:1px solid #e5edf3;
    border-radius:11px;
    padding:12px 13px;
    min-width:0;
}

.info-label{
    color:#8a9aa7;
    font-size:9px;
    text-transform:uppercase;
    font-weight:900;
    margin-bottom:5px;
    line-height:1.4;
}

.info-value{
    color:#31566f;
    font-size:12px;
    font-weight:700;
    word-break:break-word;
    line-height:1.5;
}

.user-card{
    display:flex;
    align-items:center;
    gap:13px;
    padding:14px;
    background:#f8fafc;
    border:1px solid #e5edf3;
    border-radius:13px;
}

.user-photo,
.user-fallback{
    width:58px;
    height:58px;
    border-radius:50%;
    flex-shrink:0;
}

.user-photo{
    object-fit:cover;
    border:2px solid #dceaf4;
    background:#eef7ff;
}

.user-fallback{
    background:#eef7ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.user-name{
    color:#315671;
    font-size:15px;
    font-weight:900;
    word-break:break-word;
}

.user-contact{
    color:#8b9ba8;
    font-size:11px;
    margin-top:4px;
    line-height:1.6;
    overflow-wrap:anywhere;
}

.amount-section{
    border:1px solid #d9e9f4;
    border-radius:15px;
    overflow:hidden;
}

.amount-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
    padding:13px 15px;
    border-bottom:1px solid #e8eff4;
}

.amount-row:last-child{
    border-bottom:0;
}

.amount-label{
    color:#71889a;
    font-size:12px;
    font-weight:700;
    line-height:1.5;
}

.amount-value{
    color:#315671;
    font-size:13px;
    font-weight:800;
    text-align:right;
    overflow-wrap:anywhere;
}

.amount-row.total{
    background:linear-gradient(135deg,#eef8ff,#fff6f6);
}

.amount-row.total .amount-label{
    color:var(--dark);
    font-weight:900;
}

.amount-row.total .amount-value{
    color:var(--blue);
    font-size:18px;
    font-weight:900;
}

.amount-row.paid{
    background:#f5fcf7;
}

.amount-row.paid .amount-label,
.amount-row.paid .amount-value{
    color:#18803d;
    font-weight:900;
}

.amount-row.remaining{
    background:#fffaf0;
}

.amount-row.remaining .amount-label,
.amount-row.remaining .amount-value{
    color:#9a6700;
    font-weight:900;
}

.reference-box{
    background:#fbfdff;
    border:1px dashed #cbdde9;
    border-radius:12px;
    padding:14px;
}

.reference-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:8px 0;
}

.reference-row:not(:last-child){
    border-bottom:1px solid #edf2f6;
}

.reference-label{
    color:#8799a8;
    font-size:10px;
    font-weight:800;
    flex-shrink:0;
}

.reference-value{
    color:#315671;
    font-size:11px;
    font-weight:800;
    text-align:right;
    word-break:break-all;
}

.verification{
    padding:14px;
    border-radius:12px;
    border:1px solid #dcebe2;
    background:#f5fcf7;
}

.verification.pending{
    border-color:#f0e1b8;
    background:#fffaf0;
}

.verification.rejected{
    border-color:#f0dede;
    background:#fff5f5;
}

.verification-title{
    font-size:12px;
    font-weight:900;
}

.verification-text{
    color:#789083;
    font-size:10px;
    margin-top:5px;
    line-height:1.7;
    overflow-wrap:anywhere;
}

.approval-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
}

.approval-box{
    background:#f8fafc;
    border:1px solid #e5edf3;
    border-radius:12px;
    padding:14px;
    min-width:0;
}

.approval-label{
    color:#8496a5;
    font-size:10px;
    font-weight:900;
    text-transform:uppercase;
    margin-bottom:8px;
}

.approval-detail{
    color:#7890a3;
    font-size:10px;
    line-height:1.6;
    margin-top:7px;
    overflow-wrap:anywhere;
}

.footer{
    padding:18px 28px;
    border-top:1px solid #e7eef4;
    background:#fbfdff;
    text-align:center;
}

.footer-title{
    color:var(--dark);
    font-size:12px;
    font-weight:900;
}

.footer-text{
    color:#8b9aa7;
    font-size:10px;
    margin-top:4px;
    line-height:1.7;
}

.loading-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:18px;
    padding:60px 20px;
    text-align:center;
    color:#7890a3;
    box-shadow:0 10px 35px rgba(50,80,110,.07);
    line-height:1.7;
}

.loading-icon{
    font-size:35px;
    margin-bottom:12px;
}

.error-card{
    background:#fff;
    border:1px solid #f0dede;
    border-radius:18px;
    padding:40px 20px;
    text-align:center;
    box-shadow:0 10px 35px rgba(50,80,110,.07);
}

.error-icon{
    width:58px;
    height:58px;
    margin:0 auto 13px;
    border-radius:50%;
    background:#fff0f0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
}

.error-title{
    color:#c72e2e;
    font-size:17px;
    font-weight:900;
}

.error-text{
    color:#8a9aa8;
    font-size:12px;
    margin-top:7px;
    line-height:1.7;
    overflow-wrap:anywhere;
}

.error-actions{
    margin-top:17px;
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:99999;
    min-width:290px;
    max-width:390px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:0 15px 45px rgba(20,60,90,.18);
    padding:15px;
    display:none;
}

.toast.show{
    display:block;
}

.toast-title{
    color:var(--dark);
    font-size:13px;
    font-weight:800;
}

.toast-text{
    color:#7890a3;
    font-size:11px;
    margin-top:4px;
    line-height:1.5;
}

.overlay{
    display:none;
}

@media(max-width:760px){
    .header{
        height:70px;
        padding:0 14px;
    }

    .menu-btn{
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .logo{
        height:48px;
    }

    .owner-title,
    .owner-subtitle,
    .owner-badge{
        display:none;
    }

    .layout{
        display:block;
    }

    .sidebar{
        position:fixed;
        top:70px;
        left:-260px;
        width:245px;
        height:calc(100vh - 70px);
        z-index:200;
        transition:left .25s;
        overflow-y:auto;
    }

    .sidebar.open{
        left:0;
    }

    .overlay.show{
        display:block;
        position:fixed;
        inset:70px 0 0 0;
        background:rgba(0,0,0,.25);
        z-index:150;
    }

    .main{
        padding:20px 14px 40px;
    }

    .page-top{
        flex-direction:column;
        align-items:flex-start;
    }

    .page-heading h1{
        font-size:23px;
    }

    .page-heading p{
        font-size:12px;
    }

    .top-actions{
        width:100%;
    }

    .top-btn{
        flex:1;
        padding:0 10px;
    }

    .slip-card{
        border-radius:16px;
    }

    .slip-header{
        padding:18px;
        align-items:flex-start;
        flex-direction:column;
    }

    .slip-logo{
        height:52px;
        max-width:100px;
    }

    .slip-brand-title{
        font-size:18px;
    }

    .receipt-box{
        text-align:left;
        max-width:100%;
    }

    .status-row{
        padding:15px 18px;
        align-items:flex-start;
        flex-direction:column;
    }

    .slip-body{
        padding:18px;
    }

    .info-grid,
    .approval-grid{
        grid-template-columns:1fr;
    }

    .amount-row{
        padding:12px;
    }

    .amount-label{
        font-size:11px;
    }

    .amount-value{
        font-size:12px;
    }

    .footer{
        padding:16px 18px;
    }

    .toast{
        left:14px;
        right:14px;
        bottom:14px;
        min-width:0;
    }
}

@media print{
    @page{
        size:A4;
        margin:12mm;
    }

    body{
        background:#fff !important;
        color:#000;
    }

    .header,
    .sidebar,
    .overlay,
    .page-top,
    .toast,
    .no-print{
        display:none !important;
    }

    .layout{
        display:block !important;
        min-height:0 !important;
    }

    .main{
        padding:0 !important;
    }

    .slip-area{
        max-width:none !important;
    }

    .slip-card{
        border:1px solid #ccd6de !important;
        box-shadow:none !important;
        border-radius:0 !important;
    }

    .slip-header{
        padding:18px !important;
    }

    .status-row{
        padding:13px 18px !important;
    }

    .slip-body{
        padding:18px !important;
    }

    .footer{
        padding:14px 18px !important;
    }

    .section,
    .amount-row,
    .info-box,
    .approval-box,
    .verification{
        break-inside:avoid;
    }

    *{
        -webkit-print-color-adjust:exact !important;
        print-color-adjust:exact !important;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-left">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu">☰</button>

        <img
            src="assets/EGC - Emergency Gas Cylinder logo.png"
            class="logo"
            alt="EGC"
            onerror="this.style.display='none';"
        >

        <div>
            <div class="owner-title">Owner Dashboard</div>
            <div class="owner-subtitle">Emergency Gas Cylinder Management</div>
        </div>
    </div>

    <div class="owner-badge">
        <span class="owner-dot"></span>
        Owner
    </div>
</header>

<div class="layout">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-title">Management</div>

        <button class="nav-btn" data-page="dashboard" type="button">
            <span class="nav-icon">▦</span>Dashboard
        </button>

        <button class="nav-btn" data-page="users" type="button">
            <span class="nav-icon">👥</span>Users
        </button>

        <button class="nav-btn" data-page="agencies" type="button">
            <span class="nav-icon">🏪</span>LPG Agencies
        </button>

        <button class="nav-btn" data-page="companies" type="button">
            <span class="nav-icon">🏢</span>LPG Companies
        </button>

        <button class="nav-btn" data-page="requests" type="button">
            <span class="nav-icon">🛢</span>Cylinder Requests
        </button>

        <button class="nav-btn active" data-page="payments" type="button">
            <span class="nav-icon">₹</span>Payments
        </button>

        <button class="nav-btn" data-page="reports" type="button">
            <span class="nav-icon">▤</span>Reports
        </button>

        <div class="sidebar-title" style="margin-top:25px;">System</div>

        <button class="nav-btn" data-page="settings" type="button">
            <span class="nav-icon">⚙</span>Settings
        </button>

        <div class="sidebar-bottom">
            <button class="nav-btn sidebar-logout" id="logoutBtn" type="button">
                <span class="nav-icon">🚪</span>Logout
            </button>
        </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main">

        <div class="page-top">
            <div class="page-heading">
                <h1>Payment Slip</h1>
                <p>EGC payment receipt, approval and transaction details.</p>
            </div>

            <div class="top-actions">
                <button type="button" class="top-btn back-btn" id="backBtn">
                    ← Back to Payments
                </button>

                <button type="button" class="top-btn print-btn" id="printBtn">
                    🖨 Print / Save PDF
                </button>
            </div>
        </div>

        <div class="slip-area" id="slipArea">
            <div class="loading-card">
                <div class="loading-icon">⏳</div>
                Loading payment slip...
            </div>
        </div>

    </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
    <div class="toast-title" id="toastTitle">Notification</div>
    <div class="toast-text" id="toastText"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

/* =========================================================
   SUPABASE CONFIGURATION
========================================================= */

const SUPABASE_URL =
    "https://szefvmvokkhvnzryodqu.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_S8aSsfmOKN6_7laRfgoMKA_Re2HzRS6";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

/* =========================================================
   ELEMENTS
========================================================= */

const slipArea = document.getElementById("slipArea");
const backBtn = document.getElementById("backBtn");
const printBtn = document.getElementById("printBtn");
const logoutBtn = document.getElementById("logoutBtn");
const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const toast = document.getElementById("toast");
const toastTitle = document.getElementById("toastTitle");

/* =========================================================
   SAFE HTML
========================================================= */

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function safeText(value, fallback = "—") {
    if (
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ) {
        return fallback;
    }

    return String(value);
}

========================================================= */

}

/* =========================================================
   MONEY
========================================================= */

function moneyNumber(value) {
    if (
        value === null ||
        value === undefined ||
        value === "" ||
        !Number.isFinite(Number(value))
    ) {
        return 0;
    }

    return Number(value);
}

function formatMoney(value) {
    return "₹" + moneyNumber(value).toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

function firstMoney(...values) {
    for (const value of values) {
        if (
            value !== null &&
            value !== undefined &&
            value !== "" &&
            Number.isFinite(Number(value))
        ) {
            return Number(value);
        }
    }

    return 0;
}

/* =========================================================
   DATE
========================================================= */

function formatDateTime(value) {
    if (!value) return "—";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return "—";
    }

    return date.toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}

function formatDate(value) {
    if (!value) return "—";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return "—";
    }

    return date.toLocaleDateString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric"
    });
}

/* =========================================================
   STATUS
========================================================= */

function normalizeStatus(value) {
    return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/[_-]+/g, " ");
}

function getBadgeClass(value) {
    const status = normalizeStatus(value);

    if (
        [
            "paid",
            "verified",
            "completed",
            "approved",
            "delivered",
            "success",
            "successful",
            "fully paid"
        ].includes(status)
    ) {
        return "badge-green";
    }

    if (
        [
            "pending",
            "waiting",
            "under review",
            "submitted",
            "awaiting approval"
        ].includes(status)
    ) {
        return "badge-yellow";
    }

    if (
        [
            "processing",
            "assigned",
            "ready",
            "out for delivery",
            "partially paid"
        ].includes(status)
    ) {
        return "badge-blue";
    }

    if (
        [
            "failed",
            "refunded",
            "rejected",
            "cancelled",
            "canceled",
            "unpaid"
        ].includes(status)
    ) {
        return "badge-red";
    }

    return "badge-gray";
}

function badgeHtml(value, fallback = "Not Set") {
    const label = safeText(value, fallback);

    return `
        <span class="badge ${getBadgeClass(label)}">
            ${escapeHtml(label)}
        </span>
    `;
}

    return firstMoney(
        request?.initial_payment,

        request?.advance_amount,
        request?.first_payment_amount,
        payment?.initial_payment,
        payment?.initial_payment_amount,
        payment?.advance_amount
    );

function getRemainingPayment(request, payment, requestTotal, initialPayment, extraCharge) {
    const storedRemaining = [
        request?.remaining_amount,
        request?.remaining_payment,
        request?.remaining_payment_amount,
        payment?.remaining_amount,
        payment?.remaining_payment
    ];

    for (const value of storedRemaining) {
        if (
            value !== null &&
            value !== undefined &&
            value !== "" &&
            Number.isFinite(Number(value))
        ) {
            return Math.max(0, Number(value));
        }
    }

    return Math.max(
        0,
        requestTotal + extraCharge - initialPayment
    );
}

    return firstMoney(
        payment?.payment_amount,
        payment?.amount,
        payment?.amount_paid,
        payment?.paid_amount

/* =========================================================
   LOAD PAYMENT RECORD

   Payment records are read from the payments table.
   Request information is read from cylinder_requests.
========================================================= */

async function loadPayment() {
    const { paymentId, requestId } = getQueryParams();

    if (!paymentId && !requestId) {
        showError(
            "Payment Not Selected",
            "Payment slip open karne ke liye URL mein payment_id ya request_id dena zaroori hai."
        );
        return;
    }

    slipArea.innerHTML = `
        <div class="loading-card">
            <div class="loading-icon">⏳</div>
            Loading payment and request details...
        </div>
    `;

    try {
        let payment = null;

        /* Load exact payment if payment_id was provided. */
        if (paymentId) {
            const result = await supabaseClient
                .from("payments")
                .select("*")
                .eq("id", paymentId)
                .maybeSingle();

            if (result.error) {
                throw new Error(
                    "Payment record load nahi hua: " + result.error.message
                );
            }

            payment = result.data;
        }

        /* If payment_id was not supplied, load a payment for the request. */
        if (!payment && requestId) {
            const result = await supabaseClient
                .from("payments")
                .select("*")
                .eq("request_id", requestId)
                .order("created_at", { ascending: false })
                .limit(1);

            if (result.error) {
                throw new Error(
                    "Request payment load nahi hua: " + result.error.message
                );
            }

            payment = result.data?.[0] || null;
        }

        /*
         * When the URL contains both IDs, make sure the selected
         * payment belongs to the supplied request.
         */
        if (
            payment &&
            requestId &&
            String(payment.request_id) !== String(requestId)
        ) {
            showError(
                "Payment Does Not Match",
                "URL mein diya gaya payment_id aur request_id ek hi request se sambandhit nahi hain."
            );
            return;
        }

        if (!payment) {
            showError(
                "Payment Not Found",
                "Is request ke liye payments table mein payment record nahi mila. Pehle payment record create hona chahiye."
            );
            return;
        }

        /* Load the linked cylinder request. */
        let request = null;

        const linkedRequestId = payment.request_id || requestId;

        if (linkedRequestId) {
            const result = await supabaseClient
                .from("cylinder_requests")
                .select("*")
                .eq("id", linkedRequestId)
                .maybeSingle();

            if (result.error) {
                throw new Error(
                    "Cylinder request load nahi hui: " + result.error.message
                );
            }

            request = result.data;
        }

        /*
         * Use the actual user UUID from the payment/request record.
         * Never use a hard-coded user ID.
         */
        const userId =
            payment.user_id ||
            request?.user_id ||
            request?.customer_id ||
            null;

        let profile = null;

        if (userId) {
            const result = await supabaseClient
                .from("profiles")
                .select("*")
                .eq("id", userId)
                .maybeSingle();

            if (result.error) {
                console.warn("Profile loading warning:", result.error.message);
            } else {
                profile = result.data;
            }
        }

        /* Load assigned LPG agency if available. */
        let agency = null;
        const agencyId = getAgencyId(request);

        if (agencyId) {
            const result = await supabaseClient
                .from("agencies")
                .select("*")
                .eq("id", agencyId)
                .maybeSingle();

            if (result.error) {
                console.warn("Agency loading warning:", result.error.message);
            } else {
                agency = result.data;
            }
        }

        renderSlip(payment, request, profile, agency);

    } catch (error) {
        console.error("Payment slip loading error:", error);

        showError(
            "Unable to Load Payment Slip",
            error?.message || "Payment slip load nahi ho paayi. Please try again."
        );
    }
}

                                ${badgeHtml(requestStatus)}
                            </div>
                        </div>

                        <div class="info-box">
                            <div class="info-label">Owner Request Approval</div>
                            <div class="info-value">
                                ${badgeHtml(ownerApprovalStatus)}
                            </div>
                        </div>

                    </div>
                </section>

                <!-- PAYMENT SUMMARY -->

                <section class="section">
                    <div class="section-title">Payment Summary</div>

                    <div class="amount-section">

                        <div class="amount-row">
                            <div class="amount-label">
                                Cylinder / Request Amount
                            </div>

                            <div class="amount-value">
                                ${formatMoney(requestTotal)}
                            </div>
                        </div>

                        <div class="amount-row">
                            <div class="amount-label">
                                Initial Payment
                            </div>

                            <div class="amount-value">
                                ${formatMoney(initialPayment)}
                            </div>
                        </div>

                        <div class="amount-row">
                            <div class="amount-label">
                                Extra Charge
                            </div>

                            <div class="amount-value">
                                ${formatMoney(extraCharge)}
                            </div>
                        </div>

                        <div class="amount-row total">
                            <div class="amount-label">
                                Total Payable
                            </div>

                            <div class="amount-value">
                                ${formatMoney(totalPayable)}
                            </div>
                        </div>

                        <div class="amount-row paid">
                            <div class="amount-label">
                                Amount Paid / Recorded
                            </div>

                            <div class="amount-value">
                                ${formatMoney(actualPaidAmount)}
                            </div>
                        </div>

                        <div class="amount-row remaining">
                            <div class="amount-label">
                                Remaining Payment
                            </div>

                            <div class="amount-value">
                                ${formatMoney(remainingPayment)}
                            </div>
                        </div>

                    </div>

                    <div class="verification ${paymentApproved ? "" : "pending"}" style="margin-top:12px;">
                        <div class="verification-title" style="color:${paymentApproved ? "#18803d" : "#9a6700"};">
                            ${paymentApproved ? "Payment Approved / Verified" : "Payment Approval Pending / Unconfirmed"}
                        </div>

                        <div class="verification-text">
                            This status comes from the payment record. A receipt being visible does not itself mean the payment has been approved.
                        </div>
                    </div>
                </section>

                <!-- TRANSACTION INFORMATION -->

                <section class="section">
                    <div class="section-title">Transaction Information</div>

                    <div class="reference-box">

                        <div class="reference-row">
                            <div class="reference-label">Payment ID</div>
                            <div class="reference-value">
                                ${escapeHtml(payment.id || "—")}
                            </div>
                        </div>

                        <div class="reference-row">
                            <div class="reference-label">Request ID</div>
                            <div class="reference-value">
                                ${escapeHtml(payment.request_id || request?.id || "—")}
                            </div>
                        </div>

                        <div class="reference-row">
                            <div class="reference-label">Payment Method</div>
                            <div class="reference-value">
                                ${escapeHtml(paymentMethod)}
                            </div>
                        </div>

                        <div class="reference-row">
                            <div class="reference-label">Transaction / UTR ID</div>
                            <div class="reference-value">
                                ${escapeHtml(transactionId)}
                            </div>
                        </div>

                        <div class="reference-row">
                            <div class="reference-label">Payment Reference</div>
                            <div class="reference-value">
                                ${escapeHtml(paymentReference)}
                            </div>
                        </div>

                        <div class="reference-row">
                            <div class="reference-label">Payment Proof</div>
                            ${screenshotHtml}
                        </div>

                        <div class="reference-row">
                            <div class="reference-label">Payment Submitted</div>
                            <div class="reference-value">
                                ${escapeHtml(formatDateTime(paymentCreatedAt || paymentDate))}
                            </div>
                        </div>

                        <div class="reference-row">
                            <div class="reference-label">Payment Date</div>
                            <div class="reference-value">
                                ${escapeHtml(formatDateTime(paymentDate))}
                            </div>
                        </div>

                    </div>
                </section>

                <!-- APPROVAL INFORMATION -->

                <section class="section">
                    <div class="section-title">Payment Verification & Approval</div>

                    <div class="approval-grid">

                        <div class="approval-box">
                            <div class="approval-label">Payment Verification</div>

                            ${badgeHtml(verificationStatus)}

                            <div class="approval-detail">
                                ${escapeHtml(paymentVerificationMessage)}
                            </div>
                        </div>

                        <div class="approval-box">
                            <div class="approval-label">Owner Approval</div>

                            ${badgeHtml(
                                payment?.owner_payment_approval ||
                                payment?.payment_approval_status ||
                                verificationStatus
                            )}

                            <div class="approval-detail">
                                Approval date: ${escapeHtml(approvedAtText)}<br>
                                Approved by: ${escapeHtml(approvedBy)}
                            </div>
                        </div>

                    </div>

                    <div class="reference-box" style="margin-top:12px;">

                        <div class="reference-row">
                            <div class="reference-label">Payment Approved At</div>
                            <div class="reference-value">
                                ${escapeHtml(formatDateTime(approvalDate))}
                            </div>
                        </div>

                        <div class="reference-row">
                            <div class="reference-label">Verification Status</div>
                            <div class="reference-value">
                                ${escapeHtml(verificationStatus)}
                            </div>
                        </div>

                        <div class="reference-row">
                            <div class="reference-label">Owner Approval Status</div>
                            <div class="reference-value">
                                ${escapeHtml(ownerApprovalStatus)}
                            </div>
                        </div>

                    </div>
                </section>

                <!-- DELIVERY INFORMATION -->

                <section class="section">
                    <div class="section-title">Agency & Delivery Information</div>

                    <div class="info-grid">

                        <div class="info-box">
                            <div class="info-label">Assigned LPG Agency</div>
                            <div class="info-value">
                                ${escapeHtml(agencyName)}
                            </div>
                        </div>

                        <div class="info-box">
                            <div class="info-label">Agency ID</div>
                            <div class="info-value">
                                ${escapeHtml(agencyIdForDisplay(request))}
                            </div>
                        </div>

                        <div class="info-box">
                            <div class="info-label">Delivery Status</div>
                            <div class="info-value">
                                ${badgeHtml(deliveryStatus)}
                            </div>
                        </div>

                        <div class="info-box">
                            <div class="info-label">Delivery Date</div>
                            <div class="info-value">
                                ${escapeHtml(formatDateTime(deliveryDate))}
                            </div>
                        </div>

                        <div class="info-box">
                            <div class="info-label">Repayment Status</div>
                            <div class="info-value">
                                ${badgeHtml(repaymentStatus)}
                            </div>
                        </div>

                        <div class="info-box">
                            <div class="info-label">Last Updated</div>
                            <div class="info-value">
                                ${escapeHtml(formatDateTime(
                                    request?.updated_at ||
                                    payment?.updated_at ||
                                    null
                                ))}
                            </div>
                        </div>

                    </div>
                </section>

                <!-- PAYMENT NOTE -->

                <section class="section">
                    <div class="section-title">Additional Information</div>

                    <div class="reference-box">

                        <div class="reference-row">
                            <div class="reference-label">Payment Note</div>
                            <div class="reference-value">
                                ${escapeHtml(
                                    payment?.note ||
                                    payment?.payment_note ||
                                    request?.payment_note ||
                                    "—"
                                )}
                            </div>
                        </div>

                        <div class="reference-row">
                            <div class="reference-label">Payment Record Created</div>
                            <div class="reference-value">
                                ${escapeHtml(formatDateTime(payment?.created_at))}
                            </div>
                        </div>

                        <div class="reference-row">
                            <div class="reference-label">Receipt Reference</div>
                            <div class="reference-value">
                                ${escapeHtml(slipId)}
                            </div>
                        </div>

                    </div>
                </section>

            </div>

            <!-- FOOTER -->

            <div class="footer">
                <div class="footer-title">Powered by EGC</div>

                <div class="footer-text">
                    This payment slip displays information retrieved from the EGC management system.
                    Please keep this receipt for your records.<br>
                    Payment approval is determined by the saved payment verification status.
                </div>
            </div>

        </div>
    `;
}

/* Helper used by delivery information section. */
function agencyIdForDisplay(request) {
    return (
        request?.agency_id ||
        request?.assigned_agency_id ||
        "—"
    );
}

/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener("click", async function () {
    const confirmed = confirm(
        "Kya aap EGC Owner Panel se logout karna chahte hain?"
    );

    if (!confirmed) return;

    try {
        const { error } = await supabaseClient.auth.signOut();

        if (error) throw error;

        window.location.replace("owner-login.html");

    } catch (error) {
        console.error("Logout error:", error);

        showToast(
            "Logout Failed",
            error?.message || "Please try again."
        );
    }
});

/* =========================================================
   INITIALIZATION
========================================================= */

async function init() {
    try {
        const {
            data: { session },
            error
        } = await supabaseClient.auth.getSession();

        if (error) throw error;

        if (!session) {
            window.location.replace("owner-login.html");
            return;
        }

        await loadPayment();

    } catch (error) {
        console.error("Initialization error:", error);

        showError(
            "Initialization Failed",
            error?.message || "Owner payment slip initialize nahi ho paayi."
        );
    }
}

init();
</script>

</body>
</html>
