<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>EGC - Emergency Gas Cylinder</title>

  <script>
    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }

    window.addEventListener("pageshow", function () {
      window.scrollTo(0, 0);
    });
  </script>

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      width:100%;
      min-height:100%;
      overflow-x:hidden;
    }

    body{
      width:100%;
      min-height:100%;
      margin:0;
      padding:0;
      font-family:Arial, sans-serif;
      background:#eef7fc;
      color:#003e81;
      overflow-x:hidden;
    }

    .app{
      width:100%;
      min-height:100vh;
      background:#eef7fc;
      overflow:hidden;
    }


    /* =====================================================
       HERO
    ===================================================== */

    .hero{
      width:100%;
      position:relative;
      overflow:hidden;

      background:
        radial-gradient(
          circle at 15% 45%,
          rgba(255,255,255,.95),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 55%,
          rgba(255,255,255,.9),
          transparent 32%
        ),
        #eef7fc;

      display:flex;
      flex-direction:column;
      align-items:center;
    }


    /* =====================================================
       TOP CONTENT
    ===================================================== */

    .top-content{
      width:min(100%,1100px);
      padding:38px 25px 0;
      text-align:center;
      position:relative;
      z-index:3;
    }


    /* =====================================================
       LOGO
    ===================================================== */

    .logo{
      width:min(450px,85vw);
      height:auto;
      max-height:230px;
      object-fit:contain;
      display:block;
      margin:0 auto;
    }


    /* =====================================================
       TITLE
    ===================================================== */

    .finance-title{
      width:min(820px,88vw);
      min-height:65px;

      margin:0 auto;
      padding:14px 25px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:linear-gradient(
        90deg,
        #ffb900,
        #ffc515
      );

      border-radius:40px;

      color:#00418b;

      font-size:clamp(
        20px,
        2.4vw,
        31px
      );

      font-weight:800;
      line-height:1.2;
      text-align:center;

      box-shadow:
        0 10px 24px
        rgba(247,185,0,.18);
    }


    /* =====================================================
       DESCRIPTION
    ===================================================== */

    .description{
      width:100%;
      max-width:850px;

      margin:45px auto 0;

      color:#004080;

      font-size:clamp(
        20px,
        2.5vw,
        30px
      );

      line-height:1.45;
      font-weight:700;
    }


    /* =====================================================
       DIVIDER
    ===================================================== */

    .divider{
      display:flex;
      justify-content:center;
      align-items:center;

      gap:8px;

      margin:24px auto 20px;
    }

    .divider span{
      display:block;

      width:95px;
      height:7px;

      border-radius:10px;
    }

    .divider .yellow{
      background:#ffb900;
    }

    .divider .blue{
      background:#0063c7;
    }


    /* =====================================================
       CYLINDER AREA
    ===================================================== */

    .visual-area{
      width:min(800px,90vw);

      height:380px;

      position:relative;

      display:flex;
      justify-content:center;
      align-items:flex-end;

      z-index:2;

      flex-shrink:0;
    }


    /* =====================================================
       CYLINDER
    ===================================================== */

    .cylinder{
      position:absolute;

      bottom:0;
      left:50%;

      transform:translateX(-50%);

      width:755px;
      height:450px;

      max-width:none;

      object-fit:contain;

      z-index:3;

      pointer-events:none;
    }


    /* =====================================================
       BOTTOM SECTION
    ===================================================== */

    .bottom-section{
      width:100%;

      min-height:360px;

      margin-top:0;

      position:relative;

      background:
        linear-gradient(
          180deg,
          #0754a9,
          #003e81
        );

      color:white;

      z-index:5;

      padding:80px 25px 40px;
    }


    /* Yellow curve */

    .bottom-section::before{
      content:"";

      position:absolute;

      top:-35px;
      left:-5%;

      width:110%;
      height:70px;

      background:#ffb900;

      border-radius:
        50% 50% 0 0 /
        100% 100% 0 0;

      z-index:-1;
    }


    /* Blue curve */

    .bottom-section::after{
      content:"";

      position:absolute;

      top:-28px;
      left:-5%;

      width:110%;
      height:55px;

      background:#0754a9;

      border-radius:
        50% 50% 0 0 /
        100% 100% 0 0;

      z-index:-1;
    }


    /* =====================================================
       FEATURES
    ===================================================== */

    .features{
      width:min(1050px,100%);

      margin:auto;

      display:grid;

      grid-template-columns:
        repeat(4,1fr);

      gap:25px;
    }

    .feature{
      text-align:center;
    }

    .feature-icon{
      width:76px;
      height:76px;

      margin:0 auto 12px;

      border-radius:50%;

      border:
        4px solid
        rgba(255,255,255,.85);

      display:flex;

      align-items:center;
      justify-content:center;

      color:white;

      font-size:34px;
      font-weight:bold;

      box-shadow:
        0 5px 12px
        rgba(0,0,0,.15);
    }

    .feature:nth-child(1) .feature-icon{
      background:#167be0;
    }

    .feature:nth-child(2) .feature-icon{
      background:#16bd5b;
    }

    .feature:nth-child(3) .feature-icon{
      background:#ff8b16;
    }

    .feature:nth-child(4) .feature-icon{
      background:#a828d2;
    }

    .feature h3{
      font-size:18px;
      line-height:1.25;
      font-weight:700;
      color:#fff;
    }


    /* =====================================================
       POWERED BY
    ===================================================== */

    .powered{
      display:flex;

      justify-content:center;
      align-items:center;

      gap:25px;

      margin-top:48px;

      font-size:22px;
      font-weight:700;
    }

    .powered-line{
      width:125px;
      height:2px;

      background:white;
    }


    /* =====================================================
       GET STARTED
    ===================================================== */

    .get-started{
      display:block;

      width:min(400px,90%);

      margin:32px auto 0;

      padding:17px 25px;

      border:0;

      border-radius:35px;

      background:
        linear-gradient(
          90deg,
          #ffb900,
          #ffc515
        );

      color:#00418b;

      font-size:18px;
      font-weight:800;

      cursor:pointer;

      box-shadow:
        0 8px 18px
        rgba(0,0,0,.15);

      transition:.2s;
    }

    .get-started:hover{
      transform:translateY(-2px);
    }


    /* =====================================================
       TABLET
    ===================================================== */

    @media(max-width:800px){

      .top-content{
        padding:28px 18px 0;
      }

      .logo{
        width:78vw;
        max-width:420px;
        max-height:125px;
      }

      .finance-title{
        width:92vw;
        min-height:60px;
        padding:12px 20px;
        font-size:22px;
      }

      .description{
        width:94vw;
        margin-top:35px;
        font-size:22px;
      }

      .visual-area{
        width:100%;
        height:330px;
      }

      .cylinder{
        width:420px;
        height:330px;
      }

      .bottom-section{
        padding-top:70px;
      }

      .features{
        gap:12px;
      }

      .feature-icon{
        width:65px;
        height:65px;
        font-size:29px;
      }

      .feature h3{
        font-size:14px;
      }

      .powered{
        font-size:18px;
      }
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media(max-width:500px){

      body{
        min-width:0;
      }

      .app{
        width:100%;
        min-width:0;
      }


      /* ================= HERO ================= */

      .hero{
        width:100%;
        min-height:0;
        overflow:hidden;
      }


      /* ================= TOP ================= */

      .top-content{
        width:100%;

        padding:
          14px
          10px
          0;

        text-align:center;
      }


      /* ================= LOGO ================= */

      .logo{
        display:block;

        width:78vw;

        max-width:250px;

        height:auto;

        max-height:none;

        margin:
          0 auto
          8px;

        object-fit:contain;
      }


      /* ================= TITLE ================= */

      .finance-title{
        width:92vw;

        min-height:60px;

        margin:0 auto;

        padding:
          10px
          14px;

        border-radius:36px;

        font-size:19px;

        line-height:1.2;

        white-space:normal;
      }


      /* ================= DESCRIPTION ================= */

      .description{
        width:94vw;

        max-width:none;

        margin:
          30px auto
          0;

        font-size:20px;

        line-height:1.42;

        font-weight:700;
      }


      /* ================= DIVIDER ================= */

      .divider{
        width:100%;

        margin:
          18px auto
          2px;

        gap:8px;
      }

      .divider span{
        width:70px;
        height:6px;
      }


      /* =================================================
         MOBILE CYLINDER
         IMPORTANT:
         Visual area height reduced so cylinder bottom
         directly meets the blue section.
      ================================================= */

      .visual-area{
        width:100%;

        height:205px;

        margin:0;

        position:relative;

        overflow:visible;

        flex-shrink:0;
      }

      .cylinder{
        position:absolute;

        width:390px;
        height:285px;

        max-width:none;

        left:50%;

        /*
          Cylinder image को नीचे तक push किया गया है.
        */
        bottom:-40px;

        transform:
          translateX(-50%);

        object-fit:contain;

        z-index:3;
      }


      /* =================================================
         MOBILE BLUE SECTION
      ================================================= */

      .bottom-section{
        width:100%;

        min-height:410px;

        margin:0;

        padding:
          65px
          8px
          30px;

        overflow:hidden;

        position:relative;
      }


      .bottom-section::before{
        top:-35px;
        left:-5%;
        width:110%;
        height:70px;
      }

      .bottom-section::after{
        top:-28px;
        left:-5%;
        width:110%;
        height:55px;
      }


      /* ================= FEATURES ================= */

      .features{
        width:100%;

        grid-template-columns:
          repeat(4,1fr);

        gap:2px;

        margin:0 auto;
      }

      .feature{
        min-width:0;
      }

      .feature-icon{
        width:62px;
        height:62px;

        margin:
          0 auto
          12px;

        font-size:27px;

        border-width:3px;
      }

      .feature h3{
        font-size:12px;

        line-height:1.25;

        white-space:normal;
      }


      /* ================= POWERED ================= */

      .powered{
        width:100%;

        gap:10px;

        margin-top:35px;

        font-size:16px;

        white-space:nowrap;
      }

      .powered-line{
        width:55px;

        flex-shrink:1;
      }


      /* ================= GET STARTED ================= */

      .get-started{
        width:88%;

        margin:
          25px auto
          0;

        padding:
          15px
          12px;

        font-size:16px;
      }

    }


    /* =====================================================
       SMALL MOBILE
    ===================================================== */

    @media(max-width:380px){

      .top-content{
        padding:
          10px
          8px
          0;
      }

      .logo{
        width:78vw;
        max-width:300px;
        margin-bottom:6px;
      }

      .finance-title{
        width:94vw;
        min-height:56px;

        padding:
          9px
          12px;

        font-size:17px;
      }

      .description{
        width:95vw;

        margin-top:27px;

        font-size:18px;

        line-height:1.4;
      }

      .divider{
        margin-top:16px;
      }

      .divider span{
        width:62px;
        height:6px;
      }


      /* GAP REMOVED */

      .visual-area{
        height:180px;
      }

      .cylinder{
        width:350px;
        height:255px;

        bottom:-40px;
      }


      .bottom-section{
        min-height:410px;

        padding:
          62px
          5px
          28px;
      }

      .feature-icon{
        width:55px;
        height:55px;

        font-size:23px;

        margin-bottom:10px;
      }

      .feature h3{
        font-size:10px;
      }

      .powered{
        font-size:15px;
        gap:7px;
      }

      .powered-line{
        width:45px;
      }

      .get-started{
        width:90%;

        font-size:15px;

        padding:14px 10px;
      }
    }


    /* =====================================================
       VERY SMALL MOBILE
    ===================================================== */

    @media(max-width:340px){

      .logo{
        width:80vw;
        max-width:280px;
      }

      .finance-title{
        font-size:16px;
      }

      .description{
        font-size:17px;
      }


      .visual-area{
        height:165px;
      }

      .cylinder{
        width:325px;
        height:240px;

        bottom:-40px;
      }


      .feature-icon{
        width:51px;
        height:51px;

        font-size:21px;
      }

      .feature h3{
        font-size:9px;
      }

      .powered{
        font-size:14px;
      }

      .powered-line{
        width:38px;
      }

    }

  </style>
</head>


<body>

  <div class="app">

    <!-- =================================================
         HERO
    ================================================== -->

    <section class="hero">

      <div class="top-content">

        <!-- EGC LOGO -->
        <img
          class="logo"
          src="assets/EGC - Emergency Gas Cylinder logo.png"
          alt="EGC - Emergency Gas Cylinder"
        >


        <!-- TITLE -->
        <div class="finance-title">
          Short-Term Emergency LPG Finance
        </div>


        <!-- DESCRIPTION -->
        <div class="description">
          अचानक गैस खत्म होने पर,<br>
          अधिकृत वित्तीय व्यवस्था के माध्यम से<br>
          LPG Cylinder लेने में सहायता।
        </div>


        <!-- DIVIDER -->
        <div class="divider">
          <span class="yellow"></span>
          <span class="blue"></span>
        </div>

      </div>


      <!-- =================================================
           CYLINDER
      ================================================== -->

      <div class="visual-area">

        <img
          class="cylinder"
          src="assets/Cylinder logo.png"
          alt="LPG Cylinder"
        >

      </div>

    </section>


    <!-- =================================================
         BOTTOM SECTION
    ================================================== -->

    <section class="bottom-section">


      <!-- FEATURES -->

      <div class="features">

        <div class="feature">

          <div class="feature-icon">
            ϟ
          </div>

          <h3>
            Quick<br>
            Finance
          </h3>

        </div>


        <div class="feature">

          <div class="feature-icon">
            ✓
          </div>

          <h3>
            Secure<br>
            &amp; Trusted
          </h3>

        </div>


        <div class="feature">

          <div class="feature-icon">
            ▤
          </div>

          <h3>
            Simple<br>
            Process
          </h3>

        </div>


        <div class="feature">

          <div class="feature-icon">
            ₹
          </div>

          <h3>
            Easy<br>
            Repayment
          </h3>

        </div>

      </div>


      <!-- POWERED BY EGC -->

      <div class="powered">

        <span class="powered-line"></span>

        <span>
          Powered by EGC
        </span>

        <span class="powered-line"></span>

      </div>


      <!-- GET STARTED -->

      <button
        class="get-started"
        onclick="window.location.href='login.html'"
      >
        GET STARTED →
      </button>


    </section>

  </div>


  <!-- =====================================================
       SCROLL CONTROL
  ====================================================== -->

  <script>

    function startFinance(){
      alert("EGC Finance process will start here.");
    }


    function forceTop(){

      window.scrollTo(0,0);

      if(document.documentElement){
        document.documentElement.scrollTop = 0;
      }

      if(document.body){
        document.body.scrollTop = 0;
      }

    }


    window.addEventListener(
      "DOMContentLoaded",
      forceTop
    );


    window.addEventListener(
      "load",
      function(){

        forceTop();

        setTimeout(
          forceTop,
          50
        );

        setTimeout(
          forceTop,
          250
        );

        setTimeout(
          forceTop,
          600
        );

      }
    );


    window.addEventListener(
      "pageshow",
      function(){

        forceTop();

        setTimeout(
          forceTop,
          50
        );

      }
    );

  </script>

</body>
</html>
