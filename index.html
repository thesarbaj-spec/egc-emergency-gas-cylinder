<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EGC - Emergency Gas Cylinder</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
}

body{
  font-family:Arial,sans-serif;
  background:#eef7fc;
  color:#003e81;
}

.app{
  width:100%;
  min-height:100vh;
  min-height:100dvh;
  background:#eef7fc;
}

/* ================= HERO ================= */

.hero{
  width:100%;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 45%,rgba(255,255,255,.95),transparent 30%),
    radial-gradient(circle at 85% 55%,rgba(255,255,255,.9),transparent 32%),
    #eef7fc;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.top-content{
  width:min(100%,1100px);
  padding:38px 25px 0;
  text-align:center;
  position:relative;
  z-index:3;
}

/* LOGO */

.logo{
  width:min(480px,88vw);
  height:auto;
  max-height:250px;
  object-fit:contain;
  display:block;
  margin:0 auto;
}

/* TITLE */

.finance-title{
  width:min(820px,88vw);
  min-height:65px;
  margin:0 auto;
  padding:14px 25px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(90deg,#ffb900,#ffc515);
  border-radius:40px;
  color:#00418b;
  font-size:clamp(20px,2.4vw,31px);
  font-weight:800;
  line-height:1.2;
  text-align:center;
  box-shadow:0 10px 24px rgba(247,185,0,.18);
}

/* DESCRIPTION */

.description{
  width:100%;
  max-width:850px;
  margin:45px auto 0;
  color:#004080;
  font-size:clamp(20px,2.5vw,30px);
  line-height:1.45;
  font-weight:700;
}

/* DIVIDER */

.divider{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin:24px auto 20px;
}

.divider span{
  display:block;
  width:95px;
  height:7px;
  border-radius:10px;
}

.divider .yellow{
  background:#ffb900;
}

.divider .blue{
  background:#0063c7;
}

/* CYLINDER */

.visual-area{
  width:min(800px,90vw);
  height:380px;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  z-index:2;
  flex-shrink:0;
}

.cylinder{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:755px;
  height:450px;
  max-width:none;
  object-fit:contain;
  z-index:3;
  pointer-events:none;
}

/* ================= BLUE SECTION ================= */

.bottom-section{
  width:100%;
  min-height:360px;
  margin:0;
  position:relative;
  background:linear-gradient(180deg,#0754a9,#003e81);
  color:white;
  z-index:5;
  padding:80px 25px 24px;
}

/* Yellow curve */

.bottom-section::before{
  content:"";
  position:absolute;
  top:-35px;
  left:-5%;
  width:110%;
  height:70px;
  background:#ffb900;
  border-radius:50% 50% 0 0 / 100% 100% 0 0;
  z-index:-1;
}

/* Blue curve */

.bottom-section::after{
  content:"";
  position:absolute;
  top:-28px;
  left:-5%;
  width:110%;
  height:55px;
  background:#0754a9;
  border-radius:50% 50% 0 0 / 100% 100% 0 0;
  z-index:-1;
}

/* FEATURES */

.features{
  width:min(1050px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:25px;
}

.feature{
  text-align:center;
}

.feature-icon{
  width:76px;
  height:76px;
  margin:0 auto 12px;
  border-radius:50%;
  border:4px solid rgba(255,255,255,.85);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:34px;
  font-weight:bold;
  box-shadow:0 5px 12px rgba(0,0,0,.15);
}

.feature:nth-child(1) .feature-icon{
  background:#167be0;
}

.feature:nth-child(2) .feature-icon{
  background:#16bd5b;
}

.feature:nth-child(3) .feature-icon{
  background:#ff8b16;
}

.feature:nth-child(4) .feature-icon{
  background:#a828d2;
}

.feature h3{
  font-size:18px;
  line-height:1.25;
  font-weight:700;
  color:#fff;
}

/* POWERED */

.powered{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:25px;
  margin-top:48px;
  font-size:22px;
  font-weight:700;
}

.powered-line{
  width:125px;
  height:2px;
  background:white;
  flex-shrink:0;
}

/* GET STARTED */

.get-started{
  display:block;
  width:min(400px,90%);
  min-height:52px;
  margin:32px auto 0;
  padding:15px 25px;
  border:0;
  border-radius:35px;
  background:linear-gradient(90deg,#ffb900,#ffc515);
  color:#00418b;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(0,0,0,.15);
}

/* MADE WITH SARBAJ */

.made-with{
  width:100%;
  text-align:center;
  margin:22px auto 0;
  padding:0 0 4px;
  color:rgba(255,255,255,.9);
  font-size:12px;
  line-height:1.4;
  font-weight:500;
  letter-spacing:.5px;
}

/* ================= TABLET ================= */

@media (min-width:501px) and (max-width:800px){

  .top-content{
    padding:28px 18px 0;
  }

  .logo{
    width:82vw;
    max-width:440px;
    max-height:145px;
  }

  .finance-title{
    width:92vw;
    min-height:60px;
    padding:12px 20px;
    font-size:22px;
  }

  .description{
    width:94vw;
    margin-top:35px;
    font-size:22px;
  }

  .visual-area{
    width:100%;
    height:330px;
  }

  .cylinder{
    width:420px;
    height:330px;
  }

  .bottom-section{
    padding-top:70px;
  }

  .features{
    gap:12px;
  }

  .feature-icon{
    width:65px;
    height:65px;
    font-size:29px;
  }

  .feature h3{
    font-size:14px;
  }

  .powered{
    font-size:18px;
  }
}

/* =================================================
   MOBILE PORTRAIT
   मोबाइल स्क्रीन के अनुसार फिक्स लेआउट
================================================= */

@media (max-width:500px){

  html,
  body{
    width:100%;
    height:100%;
    min-height:0;
    margin:0;
    overflow:hidden;
    overscroll-behavior:none;
  }

  body{
    position:fixed;
    inset:0;
  }

  .app{
    width:100%;
    height:100vh;
    height:100dvh;
    min-height:0;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* HERO: 60% SCREEN */

  .hero{
    width:100%;
    height:60%;
    min-height:0;
    flex:0 0 60%;
    overflow:hidden;
  }

  .top-content{
    width:100%;
    padding:5px 8px 0;
    flex-shrink:0;
  }

  /* LOGO */

  .logo{
    width:58vw;
    max-width:245px;
    max-height:118px;
    height:auto;
    margin:0 auto 3px;
    object-fit:contain;
  }

  /* TITLE */

  .finance-title{
    width:92vw;
    min-height:45px;
    padding:7px 10px;
    font-size:16px;
    line-height:1.15;
  }

  /* DESCRIPTION */

  .description{
    width:94vw;
    margin:10px auto 0;
    font-size:15px;
    line-height:1.25;
  }

  /* DIVIDER */

  .divider{
    margin:6px auto 0;
    gap:7px;
  }

  .divider span{
    width:52px;
    height:4px;
  }

  /* CYLINDER AREA */

  .visual-area{
    width:100%;
    height:auto;
    flex:1 1 auto;
    min-height:0;
    margin:0;
    position:relative;
    overflow:hidden;
  }

  .cylinder{
    position:absolute;
    width:310px;
    height:230px;
    max-width:none;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    object-fit:contain;
  }

  /* BLUE SECTION: 40% SCREEN */

  .bottom-section{
    width:100%;
    height:40%;
    min-height:0;
    flex:0 0 40%;
    margin:0;
    padding:35px 7px 5px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
  }

  .bottom-section::before{
    top:-20px;
    height:40px;
  }

  .bottom-section::after{
    top:-15px;
    height:32px;
  }

  /* FEATURES */

  .features{
    width:100%;
    flex-shrink:0;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:1px;
    margin:0 auto;
  }

  .feature{
    min-width:0;
  }

  .feature-icon{
    width:45px;
    height:45px;
    margin:0 auto 4px;
    font-size:20px;
    border-width:3px;
  }

  .feature h3{
    font-size:9px;
    line-height:1.1;
  }

  /* POWERED
     थोड़ा ऊपर रखा है */

  .powered{
    gap:7px;
    margin-top:9px;
    font-size:12px;
    flex-shrink:0;
  }

  .powered-line{
    width:35px;
  }

  /* BUTTON
     Powered से थोड़ा ज्यादा gap */

  .get-started{
    width:88%;
    min-height:40px;
    height:40px;
    flex-shrink:0;
    margin:14px auto 0;
    padding:7px 10px;
    font-size:14px;
  }

  /* FOOTER */

  .made-with{
    width:100%;
    flex-shrink:0;
    text-align:center;
    margin:auto auto 0;
    padding:3px 0 3px;
    font-size:10px;
    line-height:1.3;
    color:rgba(255,255,255,.9);
  }
}

/* ================= SMALL MOBILE ================= */

@media (max-width:380px){

  .top-content{
    padding:5px 7px 0;
  }

  .logo{

  }

    width:94vw;

  }

  .powered-line{

  }

  .get-started{

  }

  }
}

/* ================= VERY SMALL MOBILE ================= */

@media (max-width:340px){

  .logo{
    width:54vw;
    max-width:200px;
    max-height:85px;
  }

  .finance-title{
    font-size:14px;
    min-height:42px;
  }

  .description{
    font-size:13px;
    margin-top:8px;
  }

  .divider{
    margin-top:5px;
  }

  .divider span{
    width:45px;
  }

    width:265px;

  }

  }

  .powered-line{
    width:25px;
  }

  .get-started{
    min-height:36px;
    height:36px;
    margin-top:12px;
    font-size:13px;
  }

  .made-with{
    font-size:9px;
  }
}

/* =================================================
   DESKTOP SITE / WIDE LAYOUT
   सामान्य डेस्कटॉप पर मूल डिजाइन बनाए रखता है
================================================= */

@media (min-width:801px){

  .app{
    min-height:100vh;
  }

  .hero{
    min-height:0;
  }

  .bottom-section{
    min-height:360px;
  }
}

/* =================================================
   MOBILE LANDSCAPE
   छोटी ऊंचाई वाली स्क्रीन पर भी कंटेंट समायोजित
================================================= */

@media (max-width:800px) and (orientation:landscape){

  html,
  body{
    overflow-x:hidden;
  }

  .app{
    height:auto;
    min-height:100vh;
    overflow:visible;
  }

  .hero{
    height:auto;
    flex:none;
  }

  .top-content{
    padding-top:8px;
  }

  .logo{
    width:32vw;
    max-height:75px;
  }

  .finance-title{
    min-height:38px;
    font-size:16px;
  }

  .description{
    margin-top:8px;
    font-size:14px;
  }

  .divider{
    margin-top:6px;
    margin-bottom:0;
  }

  .visual-area{
    height:180px;
    flex:none;
  }

  .cylinder{
    width:230px;
    height:180px;
  }

  .bottom-section{
    height:auto;
    min-height:0;
    flex:none;
    padding-top:30px;
    padding-bottom:10px;
    overflow:visible;
  }

  .feature-icon{
    width:40px;
    height:40px;
    font-size:19px;
  }

  .feature h3{
    font-size:10px;
  }

  .powered{
    margin-top:12px;
  }

  .get-started{
    margin-top:12px;
  }

  .made-with{
    margin-top:12px;
  }
}
</style>
</head>

<body>
<div class="app">

  <section class="hero">
    <div class="top-content">

      <img
        class="logo"
        src="assets/EGC - Emergency Gas Cylinder logo.png"

      >

      <div class="finance-title">

      </div>

      <div class="description">
        अचानक गैस खत्म होने पर,<br>

      <div class="divider">

      <div class="feature">
        <div class="feature-icon">✓</div>
        <h3>Secure<br>&amp; Trusted</h3>
      </div>

      <div class="feature">
        <div class="feature-icon">▤</div>
        <h3>Simple<br>Process</h3>
      </div>

      <div class="feature">
        <div class="feature-icon">₹</div>
        <h3>Easy<br>Repayment</h3>
      </div>

    </div>

    <div class="powered">
      <span class="powered-line"></span>
      <span>Powered by EGC</span>
      <span class="powered-line"></span>

  </section>

</div>
</body>
</html>
