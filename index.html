<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>EGC - Emergency Gas Cylinder</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
}

body {
  font-family: Arial, sans-serif;
  background: #eef7fc;
  color: #003e81;
}

.app {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  background: #eef7fc;
}

/* ================= HERO ================= */

.hero {
  width: 100%;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 15% 45%, rgba(255,255,255,.95), transparent 30%),
    radial-gradient(circle at 85% 55%, rgba(255,255,255,.9), transparent 32%),
    #eef7fc;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.top-content {
  width: min(100%, 1100px);
  padding: 38px 25px 0;
  text-align: center;
  position: relative;
  z-index: 3;
}

/* ================= LOGO ================= */

.logo {
  width: min(450px, 85vw);
  height: auto;
  max-height: 230px;
  object-fit: contain;
  display: block;
  margin: 0 auto;
}

/* ================= TITLE ================= */

.finance-title {
  width: min(820px, 88vw);
  min-height: 65px;
  margin: 0 auto;
  padding: 14px 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(90deg, #ffb900, #ffc515);
  border-radius: 40px;
  color: #00418b;
  font-size: clamp(20px, 2.4vw, 31px);
  font-weight: 800;
  line-height: 1.2;
  text-align: center;
  box-shadow: 0 10px 24px rgba(247,185,0,.18);
}

/* ================= DESCRIPTION ================= */

.description {
  width: 100%;
  max-width: 850px;
  margin: 45px auto 0;
  color: #004080;
  font-size: clamp(20px, 2.5vw, 30px);
  line-height: 1.45;
  font-weight: 700;
}

/* ================= DIVIDER ================= */

.divider {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin: 24px auto 20px;
}

.divider span {
  display: block;
  width: 95px;
  height: 7px;
  border-radius: 10px;
}

.divider .yellow {
  background: #ffb900;
}

.divider .blue {
  background: #0063c7;
}

/* ================= CYLINDER ================= */

.visual-area {
  width: min(800px, 90vw);
  height: 380px;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  z-index: 2;
  flex-shrink: 0;
}

.cylinder {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 755px;
  height: 450px;
  max-width: none;
  object-fit: contain;
  z-index: 3;
  pointer-events: none;
}

/* ================= BLUE SECTION ================= */

.bottom-section {
  width: 100%;
  min-height: 360px;
  margin: 0;
  position: relative;
  background: linear-gradient(180deg, #0754a9, #003e81);
  color: white;
  z-index: 5;
  padding: 80px 25px 40px;
}

/* Yellow curve */
.bottom-section::before {
  content: "";
  position: absolute;
  top: -35px;
  left: -5%;
  width: 110%;
  height: 70px;
  background: #ffb900;
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  z-index: -1;
}

/* Blue curve: keep a small yellow gap */
.bottom-section::after {
  content: "";
  position: absolute;
  top: -29px;
  left: -5%;
  width: 110%;
  height: 55px;
  background: #0754a9;
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  z-index: -1;
}

/* ================= FEATURES ================= */

.features {
  width: min(1050px, 100%);
  margin: auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 25px;
}

.feature {
  text-align: center;
  min-width: 0;
}

.feature-icon {
  width: 76px;
  height: 76px;
  margin: 0 auto 12px;
  border-radius: 50%;
  border: 4px solid rgba(255,255,255,.85);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 34px;
  font-weight: bold;
  box-shadow: 0 5px 12px rgba(0,0,0,.15);
}

.feature:nth-child(1) .feature-icon {
  background: #167be0;
}

.feature:nth-child(2) .feature-icon {
  background: #16bd5b;
}

.feature:nth-child(3) .feature-icon {
  background: #ff8b16;
}

.feature:nth-child(4) .feature-icon {
  background: #a828d2;
}

.feature h3 {
  font-size: 18px;
  line-height: 1.25;
  font-weight: 700;
  color: #fff;
}

/* ================= POWERED ================= */

.powered {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 25px;
  margin-top: 48px;
  font-size: 22px;
  font-weight: 700;
}

.powered-line {
  width: 125px;
  height: 2px;
  background: white;
}

/* ================= GET STARTED ================= */

.get-started {
  display: block;
  width: min(400px, 90%);
  margin: 32px auto 0;
  padding: 17px 25px;
  border: 0;
  border-radius: 35px;
  background: linear-gradient(90deg, #ffb900, #ffc515);
  color: #00418b;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 8px 18px rgba(0,0,0,.15);
}

/* ================= TABLET ================= */

@media (max-width: 800px) {
  .top-content {
    padding: 28px 18px 0;
  }

  .logo {
    width: 78vw;
    max-width: 420px;
    max-height: 125px;
  }

  .finance-title {
    width: 92vw;
    min-height: 60px;
    padding: 12px 20px;
    font-size: 22px;
  }

  .description {
    width: 94vw;
    margin-top: 35px;
    font-size: 22px;
  }

  .visual-area {
    width: 100%;
    height: 330px;
  }

  .cylinder {
    width: 420px;
    height: 330px;
  }

  .bottom-section {
    padding-top: 70px;
  }

  .features {
    gap: 12px;
  }

  .feature-icon {
    width: 65px;
    height: 65px;
    font-size: 29px;
  }

  .feature h3 {
    font-size: 14px;
  }

  .powered {
    font-size: 18px;
  }
}

/* ================= MOBILE ================= */

@media (max-width: 500px) {
  html,
  body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
  }

  body {
    position: static;
    height: auto;
    overflow-y: auto;
  }

  .app {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    height: auto;
    overflow: hidden;
  }

  /*
    Mobile hero has content-driven height.
    This prevents the cylinder from floating
    above the blue section.
  */
  .hero {
    height: auto;
    min-height: 0;
    overflow: hidden;
  }

  .top-content {
    width: 100%;
    padding: 8px 8px 0;
  }

  .logo {
    width: 50vw;
    max-width: 230px;
    max-height: 78px;
    height: auto;
    margin: 0 auto 5px;
    object-fit: contain;
  }

  .finance-title {
    width: 92vw;
    min-height: 48px;
    padding: 8px 10px;
    border-radius: 28px;
    font-size: 18px;
    line-height: 1.15;
  }

  .description {
    width: 94vw;
    max-width: none;
    margin: 15px auto 0;
    font-size: 18px;
    line-height: 1.28;
    font-weight: 700;
  }

  .divider {
    width: 100%;
    margin: 9px auto 0;
    gap: 8px;
  }

  .divider span {
    width: 58px;
    height: 5px;
  }

  /*
    The image sits at the bottom of this area.
    The blue section begins immediately afterward.
  */
  .visual-area {
    width: 100%;
    height: clamp(190px, 34vw + 105px, 250px);
    min-height: 0;
    flex: none;
    margin: 0;
    position: relative;
    overflow: hidden;
  }

  .cylinder {
    position: absolute;
    width: min(350px, 94vw);
    height: 100%;
    max-width: none;
    left: 50%;
    bottom: -5px;
    transform: translateX(-50%);
    object-fit: contain;
  }

  .bottom-section {
    width: 100%;
    height: auto;
    min-height: 0;
    margin: 0;
    padding: 40px 7px 14px;
    overflow: hidden;
  }

  /* Keep the yellow and blue curves separated slightly. */
  .bottom-section::before {
    top: -24px;
    left: -5%;
    width: 110%;
    height: 48px;
  }

  .bottom-section::after {
    top: -17px;
    left: -5%;
    width: 110%;
    height: 37px;
  }

  .features {
    width: 100%;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 2px;
    margin: 0 auto;
  }

  .feature-icon {
    width: clamp(43px, 13vw, 54px);
    height: clamp(43px, 13vw, 54px);
    margin: 0 auto 6px;
    font-size: clamp(20px, 6vw, 24px);
    border-width: 3px;
  }

  .feature h3 {
    font-size: clamp(9px, 2.6vw, 11px);
    line-height: 1.18;
    white-space: normal;
  }

  .powered {
    width: 100%;
    gap: 8px;
    margin-top: 17px;
    font-size: clamp(12px, 3.8vw, 15px);
    white-space: nowrap;
  }

  .powered-line {
    width: clamp(28px, 11vw, 45px);
    height: 2px;
    flex-shrink: 1;
  }

  .get-started {
    width: 88%;
    min-height: 44px;
    margin: 13px auto 0;
    padding: 10px;
    border-radius: 28px;
    font-size: 15px;
    line-height: 1.1;
  }
}

/* ================= SMALL MOBILE ================= */

@media (max-width: 380px) {
  .logo {
    width: 47vw;
    max-width: 190px;
    max-height: 65px;
  }

  .finance-title {
    width: 94vw;
    min-height: 45px;
    font-size: 16px;
    padding: 7px 9px;
  }

  .description {
    margin-top: 12px;
    font-size: 16px;
    line-height: 1.25;
  }

  .divider {
    margin-top: 7px;
  }

  .divider span {
    width: 52px;
  }

  .visual-area {
    height: 205px;
  }

  .cylinder {
    width: min(325px, 94vw);
    bottom: -5px;
  }

  .bottom-section {
    padding: 36px 5px 11px;
  }

  .bottom-section::before {
    top: -23px;
    height: 46px;
  }

  .bottom-section::after {
    top: -16px;
    height: 36px;
  }

  .feature-icon {
    width: 47px;
    height: 47px;
    font-size: 21px;
  }

  .feature h3 {
    font-size: 9px;
  }

  .powered {
    margin-top: 14px;
    font-size: 12px;
    gap: 6px;
  }

  .powered-line {
    width: 32px;
  }

  .get-started {
    width: 90%;
    min-height: 42px;
    margin-top: 10px;
    font-size: 14px;
  }
}

/* ================= VERY SMALL MOBILE ================= */

@media (max-width: 340px) {
  .logo {
    width: 44vw;
    max-width: 165px;
    max-height: 58px;
  }

  .finance-title {
    font-size: 15px;
    min-height: 43px;
  }

  .description {
    font-size: 15px;
    margin-top: 10px;
  }

  .divider {
    margin-top: 6px;
  }

  .divider span {
    width: 46px;
  }

  .visual-area {
    height: 185px;
  }

  .cylinder {
    width: min(300px, 94vw);
  }

  .bottom-section {
    padding-top: 33px;
    padding-bottom: 9px;
  }

  .feature-icon {
    width: 43px;
    height: 43px;
    font-size: 19px;
  }

  .feature h3 {
    font-size: 8px;
  }

  .powered {
    font-size: 11px;
    margin-top: 12px;
  }

  .powered-line {
    width: 26px;
  }

  .get-started {
    min-height: 40px;
    margin-top: 9px;
    font-size: 13px;
  }
}
</style>
</head>

<body>
<div class="app">

  <section class="hero">
    <div class="top-content">

      <img

      </div>

      <div class="feature">
        <div class="feature-icon">▤</div>
        <h3>Simple<br>Process</h3>
      </div>

  </section>

</div>
</body>
</html>
