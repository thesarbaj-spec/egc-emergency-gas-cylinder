<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>EGC - Emergency Gas Cylinder</title>

<script>
  if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
  }
</script>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
}

body{
  font-family:Arial,sans-serif;
  background:#eef7fc;
  color:#003e81;
}

.app{
  width:100%;
  min-height:100vh;
  background:#eef7fc;
}


/* =====================================================
   HERO
===================================================== */

.hero{
  width:100%;
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 15% 45%,
      rgba(255,255,255,.95),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 55%,
      rgba(255,255,255,.9),
      transparent 32%
    ),
    #eef7fc;

  display:flex;
  flex-direction:column;
  align-items:center;
}


/* =====================================================
   TOP CONTENT
===================================================== */

.top-content{
  width:min(100%,1100px);
  padding:38px 25px 0;
  text-align:center;
  position:relative;
  z-index:3;
}


/* =====================================================
   LOGO
===================================================== */

.logo{
  width:min(450px,85vw);
  height:auto;
  max-height:230px;
  object-fit:contain;
  display:block;
  margin:0 auto;
}


/* =====================================================
   TITLE
===================================================== */

.finance-title{
  width:min(820px,88vw);
  min-height:65px;

  margin:0 auto;
  padding:14px 25px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:linear-gradient(
    90deg,
    #ffb900,
    #ffc515
  );

  border-radius:40px;

  color:#00418b;

  font-size:clamp(
    20px,
    2.4vw,
    31px
  );

  font-weight:800;
  line-height:1.2;
  text-align:center;

  box-shadow:
    0 10px 24px
    rgba(247,185,0,.18);
}


/* =====================================================
   DESCRIPTION
===================================================== */

.description{
  width:100%;
  max-width:850px;

  margin:45px auto 0;

  color:#004080;

  font-size:clamp(
    20px,
    2.5vw,
    30px
  );

  line-height:1.45;
  font-weight:700;
}


/* =====================================================
   DIVIDER
===================================================== */

.divider{
  display:flex;
  justify-content:center;
  align-items:center;

  gap:8px;

  margin:24px auto 20px;
}

.divider span{
  display:block;

  width:95px;
  height:7px;

  border-radius:10px;
}

.divider .yellow{
  background:#ffb900;
}

.divider .blue{
  background:#0063c7;
}


/* =====================================================
   CYLINDER AREA
===================================================== */

.visual-area{
  width:min(800px,90vw);

  height:380px;

  position:relative;

  display:flex;
  justify-content:center;
  align-items:flex-end;

  z-index:2;

  flex-shrink:0;
}


/* =====================================================
   CYLINDER
===================================================== */

.cylinder{
  position:absolute;

  bottom:0;
  left:50%;

  transform:translateX(-50%);

  width:755px;
  height:450px;

  max-width:none;

  object-fit:contain;

  z-index:3;

  pointer-events:none;
}


/* =====================================================
   BOTTOM BLUE SECTION
===================================================== */

.bottom-section{
  width:100%;

  min-height:360px;

  margin:0;

  position:relative;

  background:
    linear-gradient(
      180deg,
      #0754a9,
      #003e81
    );

  color:white;

  z-index:5;

  padding:80px 25px 40px;
}


/* Yellow curve */

.bottom-section::before{
  content:"";

  position:absolute;

  top:-35px;
  left:-5%;

  width:110%;
  height:70px;

  background:#ffb900;

  border-radius:
    50% 50% 0 0 /
    100% 100% 0 0;

  z-index:-1;
}


/* Blue curve */

.bottom-section::after{
  content:"";

  position:absolute;

  top:-28px;
  left:-5%;

  width:110%;
  height:55px;

  background:#0754a9;

  border-radius:
    50% 50% 0 0 /
    100% 100% 0 0;

  z-index:-1;
}


/* =====================================================
   FEATURES
===================================================== */

.features{
  width:min(1050px,100%);

  margin:auto;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:25px;
}

.feature{
  text-align:center;
}

.feature-icon{
  width:76px;
  height:76px;

  margin:0 auto 12px;

  border-radius:50%;

  border:
    4px solid
    rgba(255,255,255,.85);

  display:flex;

  align-items:center;
  justify-content:center;

  color:white;

  font-size:34px;
  font-weight:bold;

  box-shadow:
    0 5px 12px
    rgba(0,0,0,.15);
}

.feature:nth-child(1) .feature-icon{
  background:#167be0;
}

.feature:nth-child(2) .feature-icon{
  background:#16bd5b;
}

.feature:nth-child(3) .feature-icon{
  background:#ff8b16;
}

.feature:nth-child(4) .feature-icon{
  background:#a828d2;
}

.feature h3{
  font-size:18px;
  line-height:1.25;
  font-weight:700;
  color:#fff;
}


/* =====================================================
   POWERED
===================================================== */

.powered{
  display:flex;

  justify-content:center;
  align-items:center;

  gap:25px;

  margin-top:48px;

  font-size:22px;
  font-weight:700;
}

.powered-line{
  width:125px;
  height:2px;

  background:white;
}


/* =====================================================
   GET STARTED
===================================================== */

.get-started{
  display:block;

  width:min(400px,90%);

  margin:32px auto 0;

  padding:17px 25px;

  border:0;

  border-radius:35px;

  background:
    linear-gradient(
      90deg,
      #ffb900,
      #ffc515
    );

  color:#00418b;

  font-size:18px;
  font-weight:800;

  cursor:pointer;

  box-shadow:
    0 8px 18px
    rgba(0,0,0,.15);
}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:800px){

  .top-content{
    padding:28px 18px 0;
  }

  .logo{
    width:78vw;
    max-width:420px;
    max-height:125px;
  }

  .finance-title{
    width:92vw;
    min-height:60px;
    padding:12px 20px;
    font-size:22px;
  }

  .description{
    width:94vw;
    margin-top:35px;
    font-size:22px;
  }

  .visual-area{
    width:100%;
    height:330px;
  }

  .cylinder{
    width:420px;
    height:330px;
  }

  .bottom-section{
    padding-top:70px;
  }

  .features{
    gap:12px;
  }

  .feature-icon{
    width:65px;
    height:65px;
    font-size:29px;
  }

  .feature h3{
    font-size:14px;
  }

  .powered{
    font-size:18px;
  }
}


/* =====================================================
   MOBILE
   COMPLETE SCREEN FIT
===================================================== */

@media(max-width:500px){

  /* -----------------------------------------------
     FIX MOBILE SCREEN
  ------------------------------------------------ */

  html{
    width:100%;
    height:100%;
    overflow:hidden;
  }

  body{
    width:100%;
    height:100%;
    min-height:0;

    overflow:hidden;

    position:fixed;
    inset:0;
  }

  .app{
    width:100%;
    height:100dvh;
    min-height:0;

    overflow:hidden;

    display:flex;
    flex-direction:column;
  }


  /* -----------------------------------------------
     HERO
     लगभग 60% SCREEN
  ------------------------------------------------ */

  .hero{
    width:100%;

    height:60dvh;
    min-height:0;

    flex-shrink:0;

    overflow:hidden;
  }


  /* -----------------------------------------------
     TOP CONTENT
  ------------------------------------------------ */

  .top-content{
    width:100%;

    padding:
      8px
      8px
      0;

    flex-shrink:0;
  }


  /* -----------------------------------------------
     LOGO
     
     Mobile में जगह बचाने के लिए छोटा
  ------------------------------------------------ */

  .logo{
    width:52vw;

    max-width:270px;

    height:auto;

    max-height:70px;

    margin:0 auto 3px;

    object-fit:contain;
  }


  /* -----------------------------------------------
     TITLE
  ------------------------------------------------ */

  .finance-title{
    width:92vw;

    min-height:52px;

    padding:
      8px
      10px;

    border-radius:30px;

    font-size:18px;

    line-height:1.15;
  }


  /* -----------------------------------------------
     DESCRIPTION
  ------------------------------------------------ */

  .description{
    width:94vw;

    max-width:none;

    margin:
      17px
      auto
      0;

    font-size:18px;

    line-height:1.30;

    font-weight:700;
  }


  /* -----------------------------------------------
     DIVIDER
  ------------------------------------------------ */

  .divider{
    width:100%;

    margin:
      10px
      auto
      0;

    gap:7px;
  }

  .divider span{
    width:60px;
    height:5px;
  }


  /* -----------------------------------------------
     CYLINDER
     
     नीचे बिल्कुल blue section तक
  ------------------------------------------------ */

  .visual-area{

    width:100%;

    height:auto;

    flex:1;

    min-height:0;

    margin:0;

    position:relative;

    overflow:visible;
  }

  .cylinder{

    position:absolute;

    width:350px;

    height:245px;

    max-width:none;

    left:50%;

    bottom:-1px;

    transform:
      translateX(-50%);

    object-fit:contain;
  }


  /* -----------------------------------------------
     BLUE SECTION
     लगभग 40% SCREEN
  ------------------------------------------------ */

  .bottom-section{

    width:100%;

    height:40dvh;

    min-height:0;

    flex-shrink:0;

    margin:0;

    padding:
      42px
      7px
      8px;

    overflow:hidden;
  }


  /* -----------------------------------------------
     CURVES
  ------------------------------------------------ */

  .bottom-section::before{

    top:-25px;

    left:-5%;

    width:110%;

    height:50px;
  }

  .bottom-section::after{

    top:-19px;

    left:-5%;

    width:110%;

    height:40px;
  }


  /* -----------------------------------------------
     FEATURES
  ------------------------------------------------ */

  .features{

    width:100%;

    height:auto;

    grid-template-columns:
      repeat(4,1fr);

    gap:1px;

    margin:0 auto;
  }

  .feature{
    min-width:0;
  }

  .feature-icon{

    width:54px;
    height:54px;

    margin:
      0 auto
      6px;

    font-size:24px;

    border-width:3px;
  }

  .feature h3{

    font-size:10px;

    line-height:1.15;

    white-space:normal;
  }


  /* -----------------------------------------------
     POWERED
  ------------------------------------------------ */

  .powered{

    width:100%;

    gap:7px;

    margin-top:20px;

    font-size:14px;

    white-space:nowrap;
  }

  .powered-line{

    width:45px;

    height:2px;

    flex-shrink:1;
  }


  /* -----------------------------------------------
     GET STARTED
  ------------------------------------------------ */

  .get-started{

    width:88%;

    height:48px;

    margin:
      16px
      auto
      0;

    padding:
      8px
      10px;

    border-radius:28px;

    font-size:16px;

    line-height:1;
  }

}


/* =====================================================
   SMALL MOBILE
   380px
===================================================== */

@media(max-width:380px){

  .hero{
    height:59dvh;
  }

  .bottom-section{
    height:41dvh;
  }

  .logo{
    width:48vw;
    max-width:210px;
    max-height:60px;
  }

  .finance-title{
    width:94vw;
    min-height:48px;
    font-size:16px;
    padding:7px 9px;
  }

  .description{
    margin-top:14px;
    font-size:16px;
    line-height:1.28;
  }

  .divider{
    margin-top:8px;
  }

  .divider span{
    width:55px;
    height:5px;
  }

  .cylinder{
    width:330px;
    height:225px;
  }

  .bottom-section{
    padding-top:39px;
  }

  .feature-icon{
    width:50px;
    height:50px;
    font-size:22px;
  }

  .feature h3{
    font-size:9px;
  }

  .powered{
    margin-top:17px;
    font-size:13px;
  }

  .powered-line{
    width:38px;
  }

  .get-started{
    width:90%;
    height:45px;
    margin-top:13px;
    font-size:15px;
  }

}


/* =====================================================
   VERY SMALL MOBILE
   340px
===================================================== */

@media(max-width:340px){

  .hero{
    height:58dvh;
  }

  .bottom-section{
    height:42dvh;
  }

  .logo{
    width:45vw;
    max-width:190px;
    max-height:55px;
  }

  .finance-title{
    font-size:15px;
    min-height:46px;
  }

  .description{
    font-size:15px;
    margin-top:12px;
  }

  .divider{
    margin-top:7px;
  }

  .divider span{
    width:50px;
  }

  .cylinder{
    width:305px;
    height:210px;
  }

  .bottom-section{
    padding-top:37px;
  }

  .feature-icon{
    width:47px;
    height:47px;
    font-size:20px;
  }

  .feature h3{
    font-size:8px;
  }

  .powered{
    font-size:12px;
    margin-top:15px;
  }

  .powered-line{
    width:32px;
  }

  .get-started{
    height:43px;
    margin-top:11px;
    font-size:14px;
  }

}

</style>
</head>


<body>

<div class="app">


  <!-- =================================================
       HERO
  ================================================== -->

  <section class="hero">

    <div class="top-content">


      <!-- EGC LOGO -->

      <img
        class="logo"
        src="assets/EGC - Emergency Gas Cylinder logo.png"

      <div class="finance-title">

      <div class="description">

        LPG Cylinder लेने में सहायता।
      </div>


      <!-- DIVIDER -->

      <div class="divider">

        <span class="yellow"></span>

        <span class="blue"></span>

      </div>

    </div>


    <!-- =================================================
         CYLINDER
    ================================================== -->

    <div class="visual-area">

      <img
        class="cylinder"
        src="assets/Cylinder logo.png"
        alt="LPG Cylinder"
      >

    </div>

  </section>


  <!-- =================================================
       BLUE SECTION
  ================================================== -->

  <section class="bottom-section">


    <!-- FEATURES -->

    <div class="features">


      <div class="feature">

        <div class="feature-icon">
          ϟ
        </div>

        <h3>
          Quick<br>
          Finance
        </h3>

      </div>


      <div class="feature">

        <div class="feature-icon">
          ✓
        </div>

        <h3>
          Secure<br>
          &amp; Trusted
        </h3>

      </div>


      <div class="feature">

        <div class="feature-icon">
          ▤
        </div>

        <h3>
          Simple<br>
          Process
        </h3>

      </div>


      <div class="feature">

        <div class="feature-icon">
          ₹
        </div>

        <h3>
          Easy<br>
          Repayment
        </h3>

      </div>


    </div>


    <!-- POWERED BY -->

    <div class="powered">

      <span class="powered-line"></span>

      <span>
        Powered by EGC
      </span>

      <span class="powered-line"></span>

    <!-- GET STARTED -->

    <button
      class="get-started"
      onclick="window.location.href='login.html'"
    >
      GET STARTED →
    </button>


  </section>

</div>


<script>

/* =====================================================
   MOBILE SCROLL LOCK
===================================================== */

function lockPage(){

  window.scrollTo(0,0);

  if(document.documentElement){
    document.documentElement.scrollTop = 0;
  }

  if(document.body){
    document.body.scrollTop = 0;
  }

}


window.addEventListener(
  "load",
  function(){

    lockPage();

    setTimeout(lockPage,50);

    setTimeout(lockPage,200);

  }
);


window.addEventListener(
  "pageshow",
  function(){

    lockPage();

  }
);

</script>

</body>
</html>
