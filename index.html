<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EGC - Emergency Gas Cylinder</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
}

body{
  font-family:Arial,sans-serif;
  background:#eef7fc;
  color:#003e81;
}

.app{
  width:100%;
  min-height:100vh;
  background:#eef7fc;
}

/* HERO */
.hero{
  width:100%;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 45%,rgba(255,255,255,.95),transparent 30%),
    radial-gradient(circle at 85% 55%,rgba(255,255,255,.9),transparent 32%),
    #eef7fc;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.top-content{
  width:min(100%,1100px);
  padding:38px 25px 0;
  text-align:center;
  position:relative;
  z-index:3;
}

/* LOGO */
.logo{
  width:min(480px,88vw);
  height:auto;
  max-height:250px;
  object-fit:contain;
  display:block;
  margin:0 auto;
}

/* TITLE */
.finance-title{
  width:min(820px,88vw);
  min-height:65px;
  margin:0 auto;
  padding:14px 25px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(90deg,#ffb900,#ffc515);
  border-radius:40px;
  color:#00418b;
  font-size:clamp(20px,2.4vw,31px);
  font-weight:800;
  line-height:1.2;
  text-align:center;
  box-shadow:0 10px 24px rgba(247,185,0,.18);
}

/* DESCRIPTION */
.description{
  width:100%;
  max-width:850px;
  margin:45px auto 0;
  color:#004080;
  font-size:clamp(20px,2.5vw,30px);
  line-height:1.45;
  font-weight:700;
}

/* DIVIDER */
.divider{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin:24px auto 20px;
}

.divider span{
  display:block;
  width:95px;
  height:7px;
  border-radius:10px;
}

.divider .yellow{background:#ffb900;}
.divider .blue{background:#0063c7;}

/* CYLINDER */
.visual-area{
  width:min(800px,90vw);
  height:380px;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  z-index:2;
  flex-shrink:0;
}

.cylinder{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:755px;
  height:450px;
  max-width:none;
  object-fit:contain;
  z-index:3;
  pointer-events:none;
}

/* BLUE SECTION */
.bottom-section{
  width:100%;
  min-height:360px;
  margin:0;
  position:relative;
  background:linear-gradient(180deg,#0754a9,#003e81);
  color:white;
  z-index:5;
  padding:80px 25px 24px;
}

/* Yellow curve */
.bottom-section::before{
  content:"";
  position:absolute;
  top:-35px;
  left:-5%;
  width:110%;
  height:70px;
  background:#ffb900;
  border-radius:50% 50% 0 0 / 100% 100% 0 0;
  z-index:-1;
}

/* Blue curve */
.bottom-section::after{
  content:"";
  position:absolute;
  top:-28px;
  left:-5%;
  width:110%;
  height:55px;
  background:#0754a9;
  border-radius:50% 50% 0 0 / 100% 100% 0 0;
  z-index:-1;
}

/* FEATURES */
.features{
  width:min(1050px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:25px;
}

.feature{text-align:center;}

.feature-icon{
  width:76px;
  height:76px;
  margin:0 auto 12px;
  border-radius:50%;
  border:4px solid rgba(255,255,255,.85);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:34px;
  font-weight:bold;
  box-shadow:0 5px 12px rgba(0,0,0,.15);
}

.feature:nth-child(1) .feature-icon{background:#167be0;}
.feature:nth-child(2) .feature-icon{background:#16bd5b;}
.feature:nth-child(3) .feature-icon{background:#ff8b16;}
.feature:nth-child(4) .feature-icon{background:#a828d2;}

.feature h3{
  font-size:18px;
  line-height:1.25;
  font-weight:700;
  color:#fff;
}

/* POWERED */
.powered{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:25px;
  margin-top:48px;
  font-size:22px;
  font-weight:700;
}

.powered-line{
  width:125px;
  height:2px;
  background:white;
}

/* GET STARTED */
.get-started{
  display:block;
  width:min(400px,90%);
  margin:32px auto 0;
  padding:17px 25px;
  border:0;
  border-radius:35px;
  background:linear-gradient(90deg,#ffb900,#ffc515);
  color:#00418b;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(0,0,0,.15);
}

/* MADE WITH SARBAJ */
.made-with{
  width:100%;
  text-align:center;
  margin:22px auto 0;
  padding:0 0 4px;
  color:rgba(255,255,255,.9);
  font-size:12px;
  line-height:1.4;
  font-weight:500;
  letter-spacing:.5px;
}

/* TABLET */
@media(max-width:800px){
  .top-content{padding:28px 18px 0;}

  .logo{
    width:82vw;
    max-width:440px;
    max-height:145px;
  }

  .finance-title{
    width:92vw;
    min-height:60px;
    padding:12px 20px;
    font-size:22px;
  }

  .description{
    width:94vw;
    margin-top:35px;
    font-size:22px;
  }

  .visual-area{
    width:100%;
    height:330px;
  }

  .cylinder{
    width:420px;
    height:330px;
  }

  .bottom-section{padding-top:70px;}
  .features{gap:12px;}

  .feature-icon{
    width:65px;
    height:65px;
    font-size:29px;
  }

  .feature h3{font-size:14px;}
  .powered{font-size:18px;}
}

/* MOBILE */
@media(max-width:500px){
  html{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
    overflow-y:auto;
  }

  body{
    width:100%;
    min-height:100%;
    height:auto;
    overflow-x:hidden;
    overflow-y:auto;
    position:static;
  }

  .app{
    width:100%;
    min-height:100dvh;
    height:auto;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .hero{
    width:100%;
    height:auto;
    min-height:0;
    flex-shrink:0;
    overflow:hidden;
  }

  .top-content{
    width:100%;
    padding:8px 8px 0;
    flex-shrink:0;
  }

  /* Logo made slightly larger */
  .logo{
    width:62vw;
    max-width:300px;
    height:auto;
    max-height:115px;
    margin:0 auto 5px;
    object-fit:contain;
  }

  .finance-title{
    width:92vw;
    min-height:50px;
    padding:8px 10px;
    border-radius:28px;
    font-size:18px;
    line-height:1.15;
  }

  .description{
    width:94vw;
    max-width:none;
    margin:17px auto 0;
    font-size:18px;
    line-height:1.30;
    font-weight:700;
  }

  .divider{
    width:100%;
    margin:10px auto 0;
    gap:7px;
  }

  .divider span{
    width:60px;
    height:5px;
  }

  .visual-area{
    width:100%;
    height:270px;
    min-height:0;
    flex:none;
    margin:0;
    position:relative;
    overflow:visible;
  }

  .cylinder{
    position:absolute;
    width:350px;
    height:270px;
    max-width:none;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    object-fit:contain;
  }

  /* Blue section remains full-height below hero */
  .bottom-section{
    width:100%;
    height:auto;
    min-height:300px;
    flex:1 0 auto;
    margin:0;
    padding:45px 7px 18px;
    overflow:hidden;
    background:linear-gradient(180deg,#0754a9,#003e81);
  }

  .bottom-section::before{
    top:-25px;
    left:-5%;
    width:110%;
    height:50px;
  }

  .bottom-section::after{
    top:-19px;
    left:-5%;
    width:110%;
    height:40px;
  }

  .features{
    width:100%;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:1px;
    margin:0 auto;
  }

  .feature{min-width:0;}

  .feature-icon{
    width:54px;
    height:54px;
    margin:0 auto 6px;
    font-size:24px;
    border-width:3px;
  }

  .feature h3{
    font-size:10px;
    line-height:1.15;
    white-space:normal;
  }

  .powered{
    width:100%;
    gap:7px;
    margin-top:20px;
    font-size:14px;
    white-space:nowrap;
  }

  .powered-line{
    width:45px;
    height:2px;
    flex-shrink:1;
  }

  .get-started{
    width:88%;
    min-height:48px;
    margin:16px auto 0;
    padding:8px 10px;
    border-radius:28px;
    font-size:16px;
    line-height:1;
  }

  .made-with{
    margin:17px auto 0;
    padding-bottom:5px;
    font-size:11px;
  }
}

/* SMALL MOBILE */
@media(max-width:380px){
  .top-content{padding:7px 7px 0;}

  .logo{
    width:58vw;
    max-width:245px;
    max-height:105px;
  }

  .finance-title{
    width:94vw;
    min-height:47px;
    font-size:16px;
    padding:7px 9px;
  }

  .description{
    margin-top:14px;
    font-size:16px;
    line-height:1.28;
  }

  .divider{margin-top:8px;}

  .divider span{
    width:55px;
    height:5px;
  }

  .visual-area{height:245px;}

  .cylinder{
    width:320px;
    height:245px;
  }

  .bottom-section{padding-top:40px;}

  .feature-icon{
    width:50px;
    height:50px;
    font-size:22px;
  }

  .feature h3{font-size:9px;}

  .powered{
    margin-top:17px;
    font-size:13px;
  }

  .powered-line{width:38px;}

  .get-started{
    width:90%;
    min-height:45px;
    margin-top:13px;
    font-size:15px;
  }

  .made-with{
    margin-top:14px;
    font-size:10px;
  }
}

/* VERY SMALL MOBILE */
@media(max-width:340px){
  .logo{
    width:56vw;
    max-width:215px;
    max-height:95px;
  }

  .finance-title{
    font-size:15px;
    min-height:45px;
  }

  .description{
    font-size:15px;
    margin-top:12px;
  }

  .divider{margin-top:7px;}
  .divider span{width:50px;}

  .visual-area{height:225px;}

  .cylinder{
    width:295px;
    height:225px;
  }

  .bottom-section{padding-top:37px;}

  .feature-icon{
    width:47px;
    height:47px;
    font-size:20px;
  }

  .feature h3{font-size:8px;}

  .powered{
    font-size:12px;
    margin-top:15px;
  }

  .powered-line{width:32px;}

  .get-started{
    min-height:43px;
    margin-top:11px;
    font-size:14px;
  }

  .made-with{
    margin-top:12px;
    font-size:10px;
  }
}
</style>
</head>

<body>
<div class="app">

  <section class="hero">
    <div class="top-content">

      <img
        class="logo"
        src="assets/EGC - Emergency Gas Cylinder logo.png"

  <section class="bottom-section">

      <div class="feature">

      <div class="feature">
        <div class="feature-icon">✓</div>
        <h3>Secure<br>&amp; Trusted</h3>
      </div>

      <div class="feature">
        <div class="feature-icon">▤</div>
        <h3>Simple<br>Process</h3>
      </div>

      <div class="feature">
        <div class="feature-icon">₹</div>
        <h3>Easy<br>Repayment</h3>
      </div>
    </div>

    <div class="powered">
      <span class="powered-line"></span>
      <span>Powered by EGC</span>
      <span class="powered-line"></span>
    </div>

    <button
      class="get-started"
      onclick="window.location.href='login.html'"
    >
      GET STARTED →
    </button>

    <div class="made-with">
      Made with Sarbaj
    </div>

  </section>
</div>
</body>
</html>
