<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EGC - Emergency Gas Cylinder</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,
    body{
      width:100%;
      min-height:100%;
    }

    body{
      font-family:Arial, sans-serif;
      background:#eef7fc;
      color:#003e81;
      overflow-x:hidden;
    }

    .app{
      width:100%;
      min-height:100vh;
      background:#eef7fc;
    }

    /* ================= HERO ================= */

    .hero{
      width:100%;
      position:relative;
      overflow:hidden;
      background:
        radial-gradient(circle at 15% 45%, rgba(255,255,255,.95), transparent 30%),
        radial-gradient(circle at 85% 55%, rgba(255,255,255,.9), transparent 32%),
        #eef7fc;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .top-content{
      width:min(100%,1100px);
      padding:38px 25px 0;
      text-align:center;
      position:relative;
      z-index:3;
    }

    /* ================= LOGO ================= */

    .logo{
      width:min(450px,85vw);
      max-height:230px;
      object-fit:contain;
      display:block;
      margin:0 auto;
    }

    /* ================= TITLE ================= */

    .finance-title{
      width:min(820px,88vw);
      min-height:65px;
      margin:0 auto;
      padding:14px 25px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(90deg,#ffb900,#ffc515);
      border-radius:40px;
      color:#00418b;
      font-size:clamp(20px,2.4vw,31px);
      font-weight:800;
      line-height:1.2;
      text-align:center;
      box-shadow:0 10px 24px rgba(247,185,0,.18);
    }

    /* ================= DESCRIPTION ================= */

    .description{
      max-width:850px;
      margin:45px auto 0;
      color:#004080;
      font-size:clamp(20px,2.5vw,30px);
      line-height:1.45;
      font-weight:700;
    }

    /* ================= DIVIDER ================= */

    .divider{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      margin:24px auto 20px;
    }

    .divider span{
      display:block;
      width:95px;
      height:7px;
      border-radius:10px;
    }

    .divider .yellow{
      background:#ffb900;
    }

    .divider .blue{
      background:#0063c7;
    }

    /* ================= CYLINDER AREA ================= */

    .visual-area{
      width:min(800px,90vw);
      height:380px;
      position:relative;
      display:flex;
      justify-content:center;
      align-items:flex-end;
      z-index:2;
      flex-shrink:0;
    }

    .rings{
      position:absolute;
      width:330px;
      height:330px;
      left:50%;
      bottom:15px;
      transform:translateX(-50%);
    }

    .ring-yellow{
      position:absolute;
      width:230px;
      height:300px;
      border-left:8px solid #ffb900;
      border-radius:50%;
      transform:rotate(20deg);
      left:25px;
      top:20px;
    }

    .ring-blue{
      position:absolute;
      width:230px;
      height:300px;
      border-left:8px solid #0754a9;
      border-radius:50%;
      transform:rotate(20deg);
      left:45px;
      top:20px;
    }

    /* ================= CYLINDER IMAGE ================= */

    .cylinder{
      position:absolute;
      bottom:0;
      left:50%;
      transform:translateX(-50%);
      width:755px;
      height:450px;
      max-width:none;
      object-fit:contain;
      z-index:3;
      pointer-events:none;
    }

    .shield{
      position:absolute;
      width:120px;
      height:150px;
      right:calc(50% - 205px);
      bottom:55px;
      background:#0872d5;
      clip-path:polygon(
        50% 0%,
        92% 16%,
        86% 78%,
        50% 100%,
        14% 78%,
        8% 16%
      );
      z-index:4;
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-size:48px;
      font-weight:800;
      text-shadow:0 2px 2px rgba(0,0,0,.15);
    }

    /* ================= BOTTOM ================= */

    .bottom-section{
      width:100%;
      min-height:360px;
      margin-top:0;
      position:relative;
      background:linear-gradient(180deg,#0754a9,#003e81);
      color:white;
      z-index:5;
      padding:80px 25px 40px;
    }

    .bottom-section:before{
      content:"";
      position:absolute;
      top:-35px;
      left:-5%;
      width:110%;
      height:70px;
      background:#ffb900;
      border-radius:50% 50% 0 0 / 100% 100% 0 0;
      z-index:-1;
    }

    .bottom-section:after{
      content:"";
      position:absolute;
      top:-28px;
      left:-5%;
      width:110%;
      height:55px;
      background:#0754a9;
      border-radius:50% 50% 0 0 / 100% 100% 0 0;
      z-index:-1;
    }

    /* ================= FEATURES ================= */

    .features{
      width:min(1050px,100%);
      margin:auto;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:25px;
    }

    .feature{
      text-align:center;
    }

    .feature-icon{
      width:76px;
      height:76px;
      margin:0 auto 12px;
      border-radius:50%;
      border:4px solid rgba(255,255,255,.85);
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-size:34px;
      font-weight:bold;
      box-shadow:0 5px 12px rgba(0,0,0,.15);
    }

    .feature:nth-child(1) .feature-icon{
      background:#167be0;
    }

    .feature:nth-child(2) .feature-icon{
      background:#16bd5b;
    }

    .feature:nth-child(3) .feature-icon{
      background:#ff8b16;
    }

    .feature:nth-child(4) .feature-icon{
      background:#a828d2;
    }

    .feature h3{
      font-size:18px;
      line-height:1.25;
      font-weight:700;
      color:#fff;
    }

    /* ================= POWERED ================= */

    .powered{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:25px;
      margin-top:48px;
      font-size:22px;
      font-weight:700;
    }

    .powered-line{
      width:125px;
      height:2px;
      background:white;
    }

    /* ================= GET STARTED ================= */

    .get-started{
      display:block;
      width:min(400px,90%);
      margin:32px auto 0;
      padding:17px 25px;
      border:0;
      border-radius:35px;
      background:linear-gradient(90deg,#ffb900,#ffc515);
      color:#00418b;
      font-size:18px;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 8px 18px rgba(0,0,0,.15);
      transition:.2s;
    }

    .get-started:hover{
      transform:translateY(-2px);
    }

    /* ================= TABLET ================= */

    @media(max-width:800px){

      .top-content{
        padding-top:28px;
      }

      .logo{
        width:85vw;
        max-height:100px;
      }

      .finance-title{
        font-size:22px;
        min-height:60px;
        padding:12px 20px;
      }

      .description{
        margin-top:35px;
        font-size:22px;
      }

      .visual-area{
        width:100%;
        height:330px;
      }

      .cylinder{
        width:420px;
        height:330px;
      }

      .rings{
        transform:translateX(-50%) scale(.82);
        bottom:0;
      }

      .shield{
        width:95px;
        height:120px;
        right:calc(50% - 175px);
        bottom:45px;
        font-size:38px;
      }

      .bottom-section{
        padding-top:70px;
      }

      .features{
        gap:12px;
      }

      .feature-icon{
        width:65px;
        height:65px;
        font-size:29px;
      }

      .feature h3{
        font-size:14px;
      }

      .powered{
        font-size:18px;
      }
    }

    /* ================= MOBILE ================= */

    @media(max-width:500px){

      .hero{
        min-height:0;
      }

      .top-content{
        width:100%;
        padding:22px 12px 0;
      }

      /* MOBILE LOGO */
      .logo{
        width:72vw;
        max-width:350px;
        height:auto;
        max-height:130px;
        margin:0 auto 4px;
      }

      /* MOBILE TITLE */
      .finance-title{
        width:92vw;
        min-height:60px;
        padding:10px 14px;
        border-radius:35px;
        font-size:19px;
        line-height:1.2;
      }

      /* MOBILE DESCRIPTION */
      .description{
        width:94vw;
        margin:32px auto 0;
        font-size:20px;
        line-height:1.42;
      }

      /* MOBILE DIVIDER */
      .divider{
        margin:18px auto 5px;
      }

      .divider span{
        width:70px;
        height:6px;
      }

      /* MOBILE CYLINDER AREA */
      .visual-area{
        width:100%;
        height:315px;
        margin-top:0;
        overflow:visible;
      }

      /*
        IMPORTANT:
        Cylinder image अब visual-area के अंदर है,
        इसलिए absolute positioning सही रहेगी।
      */
      .cylinder{
        width:430px;
        height:315px;
        max-width:none;
        bottom:0;
        left:50%;
        transform:translateX(-50%);
        object-fit:contain;
      }

      .rings{
        width:280px;
        height:280px;
        bottom:0;
        transform:translateX(-50%) scale(.72);
      }

      .shield{
        width:78px;
        height:100px;
        right:calc(50% - 145px);
        bottom:35px;
        font-size:32px;
      }

      /* ================= MOBILE BOTTOM ================= */

      .bottom-section{
        min-height:350px;
        padding:65px 10px 30px;
        margin-top:0;
      }

      .bottom-section:before{
        top:-35px;
        height:70px;
      }

      .bottom-section:after{
        top:-28px;
        height:55px;
      }

      .features{
        width:100%;
        grid-template-columns:repeat(4,1fr);
        gap:3px;
      }

      .feature-icon{
        width:62px;
        height:62px;
        font-size:27px;
        border-width:3px;
      }

      .feature h3{
        font-size:12px;
        line-height:1.25;
      }

      /* POWERED */
      .powered{
        gap:10px;
        margin-top:35px;
        font-size:16px;
      }

      .powered-line{
        width:55px;
      }

      /* BUTTON */
      .get-started{
        width:88%;
        margin-top:25px;
        padding:15px;
        font-size:16px;
      }
    }

    /* ================= SMALL MOBILE ================= */

    @media(max-width:380px){

      .top-content{
        padding-left:10px;
        padding-right:10px;
      }

      .logo{
        width:74vw;
        max-height:120px;
      }

      .finance-title{
        width:94vw;
        font-size:17px;
        min-height:56px;
      }

      .description{
        width:95vw;
        font-size:18px;
        margin-top:28px;
      }

      .divider{
        margin-top:16px;
      }

      .visual-area{
        height:285px;
      }

      .cylinder{
        width:390px;
        height:285px;
      }

      .feature-icon{
        width:55px;
        height:55px;
        font-size:23px;
      }

      .feature h3{
        font-size:10px;
      }

      .powered{
        font-size:15px;
      }

      .powered-line{
        width:45px;
      }

      .get-started{
        width:90%;
        font-size:15px;
      }
    }

    /* ================= VERY SMALL MOBILE ================= */

    @media(max-width:340px){

      .logo{
        width:76vw;
      }

      .finance-title{
        font-size:16px;
      }

      .description{
        font-size:17px;
      }

      .visual-area{
        height:265px;
      }

      .cylinder{
        width:360px;
        height:265px;
      }

      .feature-icon{
        width:51px;
        height:51px;
        font-size:21px;
      }

      .feature h3{
        font-size:9px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- ================= HERO ================= -->

    <section class="hero">

      <div class="top-content">

        <!-- EGC LOGO -->
        <img
          class="logo"
          src="assets/EGC - Emergency Gas Cylinder logo.png"
          alt="EGC - Emergency Gas Cylinder"
        >

        <!-- TITLE -->
        <div class="finance-title">
          Short-Term Emergency LPG Finance
        </div>

        <!-- DESCRIPTION -->
        <div class="description">
          अचानक गैस खत्म होने पर,<br>
          अधिकृत वित्तीय व्यवस्था के माध्यम से<br>
          LPG Cylinder लेने में सहायता।
        </div>

        <!-- DIVIDER -->
        <div class="divider">
          <span class="yellow"></span>
          <span class="blue"></span>
        </div>

      </div>


      <!-- ================= CYLINDER ================= -->

      <div class="visual-area">

        <!-- LPG CYLINDER IMAGE -->
        <img
          class="cylinder"
          src="assets/Cylinder logo.png"
          alt="LPG Cylinder"
        >

      </div>

    </section>


    <!-- ================= BOTTOM SECTION ================= -->

    <section class="bottom-section">

      <!-- FEATURES -->

      <div class="features">

        <div class="feature">
          <div class="feature-icon">ϟ</div>
          <h3>
            Quick<br>
            Finance
          </h3>
        </div>

        <div class="feature">
          <div class="feature-icon">✓</div>
          <h3>
            Secure<br>
            &amp; Trusted
          </h3>
        </div>

        <div class="feature">
          <div class="feature-icon">▤</div>
          <h3>
            Simple<br>
            Process
          </h3>
        </div>

        <div class="feature">
          <div class="feature-icon">₹</div>
          <h3>
            Easy<br>
            Repayment
          </h3>
        </div>

      </div>


      <!-- POWERED BY -->

      <div class="powered">
        <span class="powered-line"></span>

        <span>
          Powered by EGC
        </span>

        <span class="powered-line"></span>
      </div>


      <!-- GET STARTED -->

      <button
        class="get-started"
        onclick="window.location.href='login.html'"
      >
        GET STARTED →
      </button>

    </section>

  </div>

  <script>
    function startFinance(){
      alert("EGC Finance process will start here.");
    }

  
  window.addEventListener("load", function () {
    setTimeout(function () {
      window.scrollTo({
        top: 0,
        left: 0,
        behavior: "instant"
      });
    }, 50);
  });

  if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
  }

  </script>

</body>
</html>
