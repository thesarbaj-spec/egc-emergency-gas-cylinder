<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EGC - My Requests</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#eef7fc;
  color:#003e81;
  min-height:100vh;
}

button{
  font-family:Arial,sans-serif;
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.65;
}

.topbar{
  height:72px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 35px;
  box-shadow:0 3px 15px rgba(0,62,129,.08);
  position:sticky;
  top:0;
  z-index:50;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img{
  width:115px;
  height:48px;
  object-fit:contain;
}

.brand-text{
  font-size:13px;
  color:#70859a;
}

.profile-mini{
  display:flex;
  align-items:center;
  gap:12px;
}

.profile-photo{
  width:43px;
  height:43px;
  border-radius:50%;
  object-fit:cover;
  background:#dfeef8;
  border:2px solid #e1edf5;
}

.profile-name{
  font-weight:800;
  color:#003e81;
  font-size:14px;
}

.profile-email{
  color:#8295a6;
  font-size:11px;
  margin-top:3px;
}

.layout{
  display:flex;
  min-height:calc(100vh - 72px);
}

.sidebar{
  width:235px;
  background:#fff;
  border-right:1px solid #e1edf5;
  padding:25px 14px;
  position:fixed;
  left:0;
  top:72px;
  bottom:0;
}

.nav-title{
  font-size:11px;
  color:#94a5b5;
  font-weight:800;
  padding:8px 13px;
  text-transform:uppercase;
  margin-bottom:5px;
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#58738d;
  padding:13px 14px;
  border-radius:11px;
  text-align:left;
  font-size:14px;
  font-weight:700;
  margin-bottom:5px;
}

.nav-btn:hover,
.nav-btn.active{
  background:#eaf5fc;
  color:#0754a9;
}

.nav-btn.blocked{
  color:#8297a8;
  background:#f3f7fa;
}

.logout{
  position:absolute;
  left:14px;
  right:14px;
  bottom:20px;
  color:#d33b3b;
}

.main{
  margin-left:235px;
  width:calc(100% - 235px);
  padding:30px;
}

.page-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:25px;
}

.page-header-left h1{
  font-size:28px;
  color:#003e81;
  margin-bottom:7px;
}

.page-header-left p{
  color:#71869a;
  font-size:14px;
}

.header-actions{
  display:flex;
  gap:10px;
}

.refresh-btn,
.request-btn-small{
  height:44px;
  border-radius:12px;
  padding:0 17px;
  font-size:13px;
  font-weight:900;
}

.refresh-btn{
  border:1px solid #d7e5ee;
  background:#fff;
  color:#0754a9;
}

.refresh-btn:hover{
  background:#f5fbff;
}

.request-btn-small{
  border:0;
  background:linear-gradient(90deg,#ffb900,#ffc515);
  color:#00418b;
  box-shadow:0 6px 15px rgba(247,185,0,.18);
}

.request-btn-small.blocked{
  background:#e8f1f7;
  color:#648096;
  box-shadow:none;
}

.error-box{
  display:none;
  background:#fff0f0;
  border:1px solid #ffd0d0;
  color:#c62828;
  padding:13px;
  border-radius:12px;
  margin-bottom:18px;
  font-size:13px;
  font-weight:700;
}

.info-box{
  display:none;
  background:#eaf5fc;
  border:1px solid #cfe7f6;
  color:#0754a9;
  padding:14px 16px;
  border-radius:13px;
  margin-bottom:18px;
  font-size:13px;
  font-weight:700;
  line-height:1.5;
}

.info-box.show{
  display:block;
}

.summary-cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:17px;
  margin-bottom:22px;
}

.summary-card{
  background:#fff;
  border:1px solid #e2edf4;
  border-radius:18px;
  padding:19px;
  box-shadow:0 7px 22px rgba(0,62,129,.06);
}

.summary-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
}

.summary-label{
  color:#7b8fa1;
  font-size:12px;
  font-weight:700;
}

.summary-icon{
  width:38px;
  height:38px;
  border-radius:11px;
  background:#eaf5fc;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.summary-number{
  font-size:25px;
  font-weight:900;
  color:#003e81;
}

.box{
  background:#fff;
  border:1px solid #e2edf4;
  border-radius:20px;
  padding:23px;
  box-shadow:0 7px 22px rgba(0,62,129,.06);
}

.box-title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

.box-title{
  font-size:18px;
  font-weight:900;
  color:#003e81;
}

.request-list{
  display:grid;
  gap:15px;
}

.request-card{
  background:#f7fbfe;
  border:1px solid #dceef9;
  border-radius:17px;
  padding:19px;
}

.request-card.active-request{
  border-color:#9ed2f1;
  box-shadow:0 7px 20px rgba(8,114,213,.08);
}

.request-card.completed-request{
  border-color:#b8e4cf;
}

.request-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
}

.request-id{
  color:#0754a9;
  font-size:16px;
  font-weight:900;
}

.request-date{
  color:#899aaa;
  font-size:11px;
  margin-top:5px;
}

.status{
  padding:7px 11px;
  border-radius:20px;
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  white-space:nowrap;
  background:#fff3d0;
  color:#a36b00;
}

.status.approved,
.status.completed,
.status.delivered{
  background:#e5f8ef;
  color:#087848;
}

.status.processing,
.status.out_for_delivery,
.status.payment_approved,
.status.paid{
  background:#e8f1ff;
  color:#0754a9;
}

.status.payment_required{
  background:#fff0d5;
  color:#a66b00;
}

.status.repayment_due{
  background:#fff0d5;
  color:#a66b00;
}

.status.repayment_submitted{
  background:#e8f1ff;
  color:#0754a9;
}

.status.cancelled,
.status.canceled,
.status.failed,
.status.rejected{
  background:#fff0f0;
  color:#c62828;
}

.status.pending{
  background:#fff3d0;
  color:#a36b00;
}

.request-details{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-top:19px;
}

.detail{
  background:#fff;
  border:1px solid #e7f0f5;
  border-radius:12px;
  padding:12px;
}

.detail-label{
  color:#8999a8;
  font-size:10px;
  margin-bottom:5px;
}

.detail-value{
  font-size:13px;
  font-weight:900;
  color:#174e7e;
  word-break:break-word;
}

.workflow-box{
  margin-top:17px;
  padding:15px;
  background:#fff;
  border:1px solid #e5eef4;
  border-radius:14px;
}

.workflow-title{
  font-size:11px;
  color:#71869a;
  font-weight:900;
  margin-bottom:12px;
  text-transform:uppercase;
}

.workflow{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.workflow-step{
  position:relative;
  text-align:center;
}

.workflow-dot{
  width:27px;
  height:27px;
  margin:0 auto 6px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e7eef3;
  color:#7890a2;
  font-size:12px;
  font-weight:900;
}

.workflow-step.done .workflow-dot{
  background:#dff6ea;
  color:#087848;
}

.workflow-step.current .workflow-dot{
  background:#0872d5;
  color:#fff;
}

.workflow-step.failed .workflow-dot{
  background:#ffe1e1;
  color:#c62828;
}

.workflow-label{
  font-size:9px;
  color:#8294a3;
  font-weight:800;
  line-height:1.25;
}

.workflow-step.done .workflow-label,
.workflow-step.current .workflow-label{
  color:#0754a9;
}

.delivery-row{
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid #e2edf4;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.delivery-label{
  color:#71869a;
  font-size:11px;
}

.delivery-value{
  font-size:12px;
  font-weight:900;
  color:#174e7e;
}

.progress-wrap{
  margin-top:17px;
}

.progress-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:7px;
}

.progress-label{
  color:#7b8fa1;
  font-size:10px;
  font-weight:700;
}

.progress-percent{
  color:#0754a9;
  font-size:10px;
  font-weight:900;
}

.progress{
  height:8px;
  background:#e2edf4;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#0872d5;
  border-radius:20px;
  transition:.3s;
}

.progress-bar.complete{
  background:#0b9259;
}

.progress-bar.warning{
  background:#e0a400;
}

.request-footer{
  margin-top:17px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.amount{
  font-size:14px;
  font-weight:900;
  color:#003e81;
}

.amount span{
  color:#899aaa;
  font-size:10px;
  font-weight:700;
  margin-right:4px;
}

.view-btn,
.payment-btn{
  border:1px solid #d6e5ee;
  background:#fff;
  color:#0754a9;
  border-radius:10px;
  padding:8px 12px;
  font-size:11px;
  font-weight:900;
}

.view-btn:hover{
  background:#eaf5fc;
}

.payment-btn{
  border:0;
  background:#0872d5;
  color:#fff;
  margin-right:6px;
}

.payment-btn:hover{
  background:#075eae;
}

.continue-btn{
  border:0;
  background:#0872d5;
  color:#fff;
  border-radius:10px;
  padding:9px 14px;
  font-size:11px;
  font-weight:900;
  margin-right:6px;
}

.continue-btn:hover{
  background:#075eae;
}

.repayment-btn{
  border:0;
  background:#ffb900;
  color:#00418b;
  border-radius:10px;
  padding:9px 14px;
  font-size:11px;
  font-weight:900;
  margin-right:6px;
}

.repayment-btn:hover{
  background:#e8a900;
}

.empty{
  text-align:center;
  padding:40px 15px;
  color:#8a9aaa;
  font-size:13px;
}

.empty-icon{
  width:58px;
  height:58px;
  margin:0 auto 13px;
  border-radius:17px;
  background:#eaf5fc;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
}

.empty-title{
  color:#315b7e;
  font-size:15px;
  font-weight:900;
  margin-bottom:6px;
}

.empty-text{
  color:#8a9aaa;
  font-size:12px;
  line-height:1.5;
}

.empty-action{
  margin-top:16px;
  height:43px;
  border:0;
  border-radius:11px;
  padding:0 17px;
  background:linear-gradient(90deg,#ffb900,#ffc515);
  color:#00418b;
  font-size:12px;
  font-weight:900;
}

.loading{
  padding:40px 15px;
  text-align:center;
  color:#71869a;
  font-size:13px;
}

.spinner{
  width:28px;
  height:28px;
  border:3px solid #dcecf6;
  border-top-color:#0872d5;
  border-radius:50%;
  margin:0 auto 12px;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.mobile-nav{
  display:none;
}

.toast{
  position:fixed;
  right:25px;
  bottom:25px;
  z-index:10001;
  background:#003e81;
  color:#fff;
  padding:13px 18px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
  font-size:13px;
  font-weight:700;
  opacity:0;
  transform:translateY(10px);
  pointer-events:none;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* LOGOUT */

.logout-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,20,40,.55);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.logout-overlay.show{
  display:flex;
}

.logout-popup{
  width:100%;
  max-width:390px;
  background:#fff;
  border-radius:22px;
  padding:28px 25px 24px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  text-align:center;
  animation:logoutPopupIn .18s ease-out;
}

@keyframes logoutPopupIn{
  from{
    opacity:0;
    transform:scale(.94) translateY(8px);
  }
  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

.logout-icon{
  width:58px;
  height:58px;
  border-radius:17px;
  background:#fff0f0;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 16px;
  font-size:28px;
}

.logout-title{
  font-size:21px;
  font-weight:900;
  color:#173f62;
  margin-bottom:10px;
}

.logout-subtitle{
  font-size:13px;
  color:#7c8d9c;
  line-height:1.5;
  margin-bottom:23px;
}

.logout-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.logout-cancel-btn,
.logout-confirm-btn{
  height:48px;
  border-radius:12px;
  font-size:14px;
  font-weight:900;
  transition:.15s;
}

.logout-cancel-btn{
  background:#fff;
  color:#31526d;
  border:1px solid #d7e2ea;
}

.logout-cancel-btn:hover{
  background:#f5f8fa;
}

.logout-confirm-btn{
  background:#e53935;
  color:#fff;
  border:1px solid #e53935;
}

.logout-confirm-btn:hover{
  background:#c62828;
  border-color:#c62828;
}

/* MOBILE */

@media(max-width:1100px){

  .summary-cards{
    grid-template-columns:repeat(2,1fr);
  }

  .request-details{
    grid-template-columns:repeat(2,1fr);
  }

  .workflow{
    grid-template-columns:repeat(5,1fr);
  }
}

@media(max-width:800px){

  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
    width:100%;
    padding:20px 15px 90px;
  }

  .topbar{
    height:65px;
    padding:0 15px;
  }

  .layout{
    min-height:calc(100vh - 65px);
  }

  .brand img{
    width:100px;
  }

  .brand-text{
    display:none;
  }

  .profile-email{
    display:none;
  }

  .profile-photo{
    width:38px;
    height:38px;
  }

  .page-header{
    align-items:flex-start;
    flex-direction:column;
    margin-bottom:20px;
  }

  .page-header-left h1{
    font-size:23px;
  }

  .page-header-left p{
    font-size:12px;
  }

  .header-actions{
    width:100%;
  }

  .refresh-btn,
  .request-btn-small{
    flex:1;
  }

  .summary-cards{
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .summary-card{
    padding:16px;
  }

  .summary-number{
    font-size:22px;
  }

  .summary-icon{
    width:35px;
    height:35px;
    font-size:17px;
  }

  .summary-label{
    font-size:11px;
  }

  .box{
    padding:18px;
    border-radius:17px;
  }

  .box-title{
    font-size:17px;
  }

  .request-card{
    padding:16px;
  }

  .request-head{
    flex-direction:column;
    align-items:flex-start;
  }

  .request-head .status{
    align-self:flex-start;
  }

  .request-details{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .detail{
    padding:10px;
  }

  .workflow{
    grid-template-columns:repeat(5,1fr);
    gap:3px;
  }

  .workflow-dot{
    width:24px;
    height:24px;
    font-size:10px;
  }

  .workflow-label{
    font-size:8px;
  }

  .delivery-row{
    align-items:flex-start;
    flex-direction:column;
  }

  .request-footer{
    align-items:flex-start;
    flex-direction:column;
  }

  .request-footer > div{
    width:100%;
  }

  .view-btn,
  .payment-btn,
  .continue-btn,
  .repayment-btn{
    width:100%;
    margin:0 0 7px 0;
  }

  .mobile-nav{
    display:flex;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:67px;
    background:#fff;
    border-top:1px solid #dce8ef;
    z-index:100;
    justify-content:space-around;
    align-items:center;
    box-shadow:0 -5px 20px rgba(0,62,129,.08);
  }

  .mobile-nav button{
    border:0;
    background:transparent;
    color:#7890a3;
    font-size:10px;
    font-weight:800;
  }

  .mobile-nav button span{
    display:block;
    font-size:20px;
    margin-bottom:3px;
  }

  .mobile-nav button.active{
    color:#0754a9;
  }

  .logout-popup{
    max-width:350px;
    padding:25px 20px 21px;
  }

  .logout-title{
    font-size:20px;
  }

  .toast{
    left:15px;
    right:15px;
    bottom:80px;
    text-align:center;
  }
}

@media(max-width:450px){

  .summary-cards{
    grid-template-columns:1fr 1fr;
  }

  .request-details{
    grid-template-columns:1fr 1fr;
  }

  .request-id{
    font-size:14px;
  }

  .detail-value{
    font-size:12px;
  }

  .logout-buttons{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<header class="topbar">

  <div class="brand">

    <img
      src="assets/EGC - Emergency Gas Cylinder logo.png"
      alt="EGC"
    >

    <div class="brand-text">
      Emergency Gas Cylinder
    </div>

  </div>

  <div class="profile-mini">

    <div>

      <div
        class="profile-name"
        id="topName">
        Loading...
      </div>

      <div
        class="profile-email"
        id="topEmail">
        Loading...
      </div>

    </div>

    <img
      id="topPhoto"
      class="profile-photo"
      src=""
      alt="Profile"
    >

  </div>

</header>

<div class="layout">

<aside class="sidebar">

  <div class="nav-title">
    MENU
  </div>

  <button
    class="nav-btn"
    onclick="goDashboard()">
    🏠 &nbsp; Dashboard
  </button>

  <button
    class="nav-btn"
    id="sidebarRequestBtn"
    onclick="requestCylinder()">
    🛢️ &nbsp; Request Cylinder
  </button>

  <button
    class="nav-btn active"
    onclick="goRequests()">
    📋 &nbsp; My Requests
  </button>

  <button
    class="nav-btn"
    onclick="goPayments()">
    💰 &nbsp; Payments
  </button>

  <button
    class="nav-btn"
    onclick="goNotifications()">
    🔔 &nbsp; Notifications
  </button>

  <button
    class="nav-btn"
    onclick="goProfile()">
    👤 &nbsp; Profile
  </button>

  <button
    class="nav-btn"
    onclick="goSettings()">
    ⚙️ &nbsp; Settings
  </button>

  <button
    class="nav-btn"
    onclick="goHelp()">
    ❓ &nbsp; Help & Support
  </button>

  <button
    class="nav-btn logout"
    onclick="openLogoutPopup()">
    🚪 &nbsp; Logout
  </button>

</aside>

<main class="main">

  <div
    id="errorBox"
    class="error-box">
  </div>

  <div

if(

/* =========================================================

function $(id){

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatMoney(value){

  const number =
    Number(value || 0);

  return number.toLocaleString(
    "en-IN",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


function formatDate(value){

  if(!value){
    return "—";
  }

  const d =
    new Date(value);

  if(Number.isNaN(d.getTime())){
    return "—";
  }

  return d.toLocaleDateString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}


function formatDateTime(value){

  if(!value){
    return "—";
  }

  const d =
    new Date(value);

  if(Number.isNaN(d.getTime())){
    return "—";
  }

  return d.toLocaleString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function showError(message){

}


function clearError(){

}


function showInfo(message){

  const box =
    $("infoBox");

  box.textContent =
    message ||
    "";

  if(message){
    box.classList.add("show");
  }else{
    box.classList.remove("show");
  }

}


function toast(message){

  const el =
    $("toast");

  el.textContent =
    message ||
    "";

  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(

        el.classList.remove("show");

    );

}


/* =========================================================
   SAFE FIELD HELPERS
   ---------------------------------------------------------
   Different pages can create some fields while others
   may not. These helpers keep My Requests compatible
   with the current database while we complete Payments.
========================================================= */

function getValue(item, fields, fallback=""){

  for(const field of fields){

    if(
      Object.prototype.hasOwnProperty.call(
        item,
        field
      ) &&
      item[field] !== null &&
      item[field] !== undefined &&
      item[field] !== ""
    ){

      return item[field];

    }

  }

  return fallback;

}


function normalizeStatus(value){

  return String(
    value || ""
  )
  .trim()
  .toLowerCase()
  .replace(/[\s-]+/g,"_");

}


/* =========================================================
   REQUEST WORKFLOW
========================================================= */

function getOwnerApproval(item){

  return normalizeStatus(
    getValue(
      item,
      [
        "owner_approval",
        "owner_status",
        "approval_status"
      ],
      ""
    )
  );

}


function getPaymentStatus(item){

  return normalizeStatus(
    getValue(
      item,
      [
        "payment_status",
        "initial_payment_status",
        "payment_approval_status"
      ],
      ""
    )
  );

}


function getAgencyStatus(item){

  return normalizeStatus(
    getValue(
      item,
      [
        "agency_status",
        "agency_processing_status"
      ],
      ""
    )
  );

}


function getDeliveryStatus(item){

  return normalizeStatus(
    getValue(
      item,
      [
        "delivery_status"
      ],
      ""
    )
  );

}


function getRepaymentStatus(item){

  return normalizeStatus(
    getValue(
      item,
      [
        "repayment_status",
        "repayment_approval_status"
      ],
      ""
    )
  );

}


function getRequestStatus(item){

  return normalizeStatus(
    getValue(
      item,
      [
        "status",
        "request_status",
        "user_status"
      ],
      "pending"
    )
  );

}


/* =========================================================
   FINAL REQUEST STATE
========================================================= */

function isRejected(item){

  const requestStatus =
    getRequestStatus(item);

  const ownerApproval =
    getOwnerApproval(item);

  const paymentStatus =
    getPaymentStatus(item);

  const repaymentStatus =
    getRepaymentStatus(item);

  return [
    "rejected",
    "cancelled",
    "canceled",
    "failed"
  ].includes(requestStatus)
  ||
  [
    "rejected",
    "cancelled",
    "canceled",
    "failed"
  ].includes(ownerApproval)
  ||
  [
    "rejected",
    "cancelled",
    "canceled",
    "failed"
  ].includes(paymentStatus)
  ||
  [
    "rejected",
    "cancelled",
    "canceled",
    "failed"
  ].includes(repaymentStatus);

}


function isFullyCompleted(item){

  const requestStatus =
    getRequestStatus(item);

  const repaymentStatus =
    getRepaymentStatus(item);

  const deliveryStatus =
    getDeliveryStatus(item);

  const remaining =
    getRemainingAmount(item);

  if(
    [
      "completed",
      "closed"
    ].includes(requestStatus)
  ){

    return true;

  }

  if(
    repaymentStatus === "completed" ||
    repaymentStatus === "paid" ||
    repaymentStatus === "approved" &&
    remaining <= 0
  ){

    return true;

  }

  if(
    deliveryStatus === "delivered" &&
    remaining <= 0 &&
    repaymentStatus !== "pending" &&
    repaymentStatus !== "due"
  ){

    return true;

  }

  return false;

}


function getRemainingAmount(item){

  const directRemaining =
    getValue(
      item,
      [
        "remaining_amount",
        "remaining_payable",
        "balance_amount"
      ],
      null
    );

  if(
    directRemaining !== null &&
    directRemaining !== ""
  ){

    return Math.max(
      0,
      Number(directRemaining) || 0
    );

  }

  const total =
    Number(
      getValue(
        item,
        [
          "total_amount",
          "request_amount",
          "finance_amount"
        ],
        0
      )
    ) || 0;

  const paid =
    Number(
      getValue(
        item,
        [
          "total_paid",
          "paid_amount",
          "amount_paid"
        ],
        0
      )
    ) || 0;

  if(total > 0){

    return Math.max(
      0,
      total - paid
    );

  }

  return 0;

}


/* =========================================================
   ACTIVE REQUEST
   ---------------------------------------------------------
   New request is blocked until the complete previous
   request/payment/repayment cycle is finished.
========================================================= */

function getActiveRequest(){

  return currentRequests.find(
    function(item){

      if(isRejected(item)){
        return false;
      }

      if(isFullyCompleted(item)){
        return false;
      }

      return true;

    }
  ) || null;

}


function hasActiveRequest(){

  return !!getActiveRequest();

}

/* =========================================================
   OVERALL STATE
========================================================= */

function getOverallState(item){

  if(isRejected(item)){

    return {
      key:"rejected",
      label:"Request Rejected",
      message:
        "This request was rejected or cancelled. You can submit a new cylinder request.",
      progress:0
    };

  }

  if(isFullyCompleted(item)){

    return {
      key:"completed",
      label:"Completed",
      message:
        "This cylinder request and repayment cycle has been completed. You can submit a new request.",
      progress:100
    };

  }

  const ownerApproval =
    getOwnerApproval(item);

  const paymentStatus =
    getPaymentStatus(item);

  const agencyStatus =
    getAgencyStatus(item);

  const deliveryStatus =
    getDeliveryStatus(item);

  const repaymentStatus =
    getRepaymentStatus(item);

  const requestStatus =
    getRequestStatus(item);

  /*
    STEP 1
    Owner approval pending
  */

  if(
    ownerApproval === "" &&
    [
      "pending",
      "processing"
    ].includes(requestStatus)
  ){

    return {
      key:"owner_pending",
      label:"Pending Owner Approval",
      message:
        "Your request has been submitted successfully and is waiting for Owner approval.",
      progress:20
    };

  }


  if(
    [
      "pending",
      "waiting",
      "under_review"
    ].includes(ownerApproval)
  ){

    return {
      key:"owner_pending",
      label:"Pending Owner Approval",
      message:
        "Your request is under Owner review. Please wait for approval.",
      progress:20
    };

  }


  /*
    STEP 2
    Owner approved -> payment required
  */

  if(
    [
      "approved",
      "approve"
    ].includes(ownerApproval)
    &&
    (
      paymentStatus === "" ||
      [
        "pending",
        "required",
        "unpaid"
      ].includes(paymentStatus)
    )
  ){

    return {
      key:"payment_required",
      label:"Payment Required",
      message:
        "Your request has been approved. Please complete the required payment from the Payments page.",
      progress:35
    };

  }


  /*
    STEP 3
    Payment submitted / verification
  */

  if(
    [
      "submitted",
      "pending_verification",
      "verification_pending",
      "under_review"
    ].includes(paymentStatus)
  ){

    return {
      key:"payment_pending",
      label:"Payment Verification Pending",
      message:
        "Your payment has been submitted and is waiting for Owner verification.",
      progress:50
    };

  }


  /*
    STEP 4
    Payment approved -> agency processing
  */

  if(
    [
      "approved",
      "paid",
      "success",
      "successful"
    ].includes(paymentStatus)
    &&
    [
      "",
      "pending",
      "processing",
      "assigned",
      "ready"
    ].includes(agencyStatus)
    &&
    deliveryStatus !== "delivered"
  ){

    return {
      key:"agency_processing",
      label:"Agency Processing",
      message:
        "Your payment has been approved. The cylinder is now being processed by the agency.",
      progress:65
    };

  }


  /*
    STEP 5
    Agency / delivery
  */

  if(
    [
      "processing",
      "assigned",
      "ready"
    ].includes(agencyStatus)
  ){

    return {
      key:"agency_processing",
      label:"Agency Processing",
      message:
        "Your cylinder is currently being processed by the selected agency.",
      progress:70
    };

  }


  if(
    deliveryStatus === "out_for_delivery"
  ){

    return {
      key:"out_for_delivery",
      label:"Out for Delivery",
      message:
        "Your cylinder is out for delivery.",
      progress:85
    };

  }


  /*
    STEP 6
    Delivered -> repayment
  */

  if(
    deliveryStatus === "delivered"
  ){

    const remaining =
      getRemainingAmount(item);

    if(
      remaining > 0 &&
      [
        "",
        "pending",
        "due",
        "required"
      ].includes(repaymentStatus)
    ){

      return {
        key:"repayment_due",
        label:"Repayment Due",
        message:
          "Your cylinder has been delivered. The remaining payment is now due. Please open the Payments page to continue.",
        progress:90
      };

    }

    if(
      [
        "submitted",
        "pending",
        "verification_pending"
      ].includes(repaymentStatus)
    ){

      return {
        key:"repayment_pending",
        label:"Repayment Verification Pending",
        message:
          "Your repayment has been submitted and is waiting for Owner verification.",
        progress:95
      };

    }

    if(
      [
        "approved",
        "paid",
        "completed"
      ].includes(repaymentStatus)
      &&
      remaining <= 0
    ){

      return {
        key:"completed",
        label:"Completed",
        message:
          "Your cylinder request and complete repayment have been successfully completed.",
        progress:100
      };

    }

  }


  /*
    Generic processing fallback
  */

  if(
    requestStatus === "processing"
  ){

    return {
      key:"processing",
      label:"Processing",
      message:
        "Your request is currently being processed.",
      progress:60
    };

  }


  return {
    key:"pending",
    label:"Pending",
    message:
      "Your cylinder request is being processed.",
    progress:20
  };

}


/* =========================================================
   PROFILE
========================================================= */

async function loadProfile(){

  if(!currentUser?.id){
    return;
  }

  const result =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();

  if(result.error){

    console.warn(
      "Profile load error:",
      result.error
    );

    return;

  }

  if(!result.data){
    return;
  }

  currentProfile =
    result.data;

  const name =
    result.data.full_name ||
    "EGC Customer";

  const email =
    result.data.email ||
    currentUser.email ||
    "";

  $("topName").textContent =
    name;

  $("topEmail").textContent =
    email;

  if(result.data.profile_photo){

    $("topPhoto").src =
      result.data.profile_photo;

  }else{

    $("topPhoto").src =
      "https://ui-avatars.com/api/?name=" +
      encodeURIComponent(name) +
      "&background=eaf5fc&color=0754a9";

  }

}


/* =========================================================
   LOAD REQUESTS
========================================================= */

async function loadRequests(){

  if(!currentUser?.id){
    return;
  }

  const area =
    $("requestsArea");

  area.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      Loading your requests...
    </div>
  `;

  const result =
    await supabaseClient
      .from("cylinder_requests")
      .select("*")
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );

  if(result.error){

    console.warn(
      "Requests load error:",
      result.error
    );

    area.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <div class="empty-title">
          Unable to load requests
        </div>

        <div class="empty-text">
          ${escapeHtml(
            result.error.message ||
            "Please try again."
          )}
        </div>

      </div>
    `;

    showError(
      result.error.message ||
      "Unable to load requests."
    );

    return;

  }

  clearError();

  currentRequests =
    result.data || [];

  updateCounters();

  updateRequestButton();

  renderRequests();

}


/* =========================================================
   COUNTERS
========================================================= */

function updateCounters(){

  const requests =
    currentRequests;

  const total =
    requests.length;

  const pending =
    requests.filter(
      function(item){

        const state =
          getOverallState(item);

        return [
          "owner_pending",
          "pending",
          "payment_pending",
          "repayment_pending"
        ].includes(state.key);

      }
    ).length;

  const approved =
    requests.filter(
      function(item){

        const owner =
          getOwnerApproval(item);

        return [
          "approved",
          "approve"
        ].includes(owner);

      }
    ).length;

  const completed =
    requests.filter(
      function(item){

        return isFullyCompleted(item);

      }
    ).length;

  $("totalRequests").textContent =
    total;

  $("pendingRequests").textContent =
    pending;

  $("approvedRequests").textContent =
    approved;

  $("completedRequests").textContent =
    completed;

}


/* =========================================================
   DISPLAY STATUS
========================================================= */

function getDisplayStatus(item){

  const state =
    getOverallState(item);

  return state.label;

}


/* =========================================================
   PROGRESS
========================================================= */

function getProgress(item){

  return getOverallState(item).progress;

}


/* =========================================================
   DELIVERY TEXT
========================================================= */

function getDeliveryText(item){

  const deliveryStatus =
    getDeliveryStatus(item);

  if(deliveryStatus === "delivered"){
    return "Cylinder Delivered";
  }

  if(deliveryStatus === "out_for_delivery"){
    return "Out for Delivery";
  }

  if(deliveryStatus === "processing"){
    return "Processing";
  }

  if(deliveryStatus === "assigned"){
    return "Delivery Assigned";
  }

  if(deliveryStatus === "ready"){
    return "Cylinder Ready";
  }

  if(deliveryStatus === "pending"){
    return "Delivery Pending";
  }

  const agencyStatus =
    getAgencyStatus(item);

  if(agencyStatus === "processing"){
    return "Agency Processing";
  }

  const state =
    getOverallState(item);

  if(state.key === "owner_pending"){
    return "Waiting for Owner Approval";
  }

  if(state.key === "payment_required"){
    return "Payment Required";
  }

  if(state.key === "payment_pending"){
    return "Payment Verification Pending";
  }

  if(state.key === "repayment_due"){
    return "Repayment Due";
  }

  if(state.key === "completed"){
    return "Completed";
  }

  return "—";

}


/* =========================================================
   WORKFLOW STEP
========================================================= */

function getWorkflowClass(item, step){

  const state =
    getOverallState(item);

  const progress =
    state.progress;

  if(
    isRejected(item)
  ){

    return "failed";

  }

  const thresholds = {
    request:20,
    payment:40,
    agency:65,
    delivery:85,
    repayment:100
  };

  if(
    progress >=
    thresholds[step]
  ){

    return "done";

  }

  if(
    step === "request" &&
    progress >= 20
  ){

    return "current";

  }

  if(
    step === "payment" &&
    progress >= 35 &&
    progress < 65
  ){

    return "current";

  }

  if(
    step === "agency" &&
    progress >= 65 &&
    progress < 85
  ){

    return "current";

  }

  if(
    step === "delivery" &&
    progress >= 85 &&
    progress < 100
  ){

    return "current";

  }

  if(
    step === "repayment" &&
    progress >= 90 &&
    progress < 100
  ){

    return "current";

  }

  return "";

}


/* =========================================================
   RENDER REQUESTS
========================================================= */

function renderRequests(){

  const area =
    $("requestsArea");

  if(!currentRequests.length){

    area.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🛢️
        </div>

        <div class="empty-title">
          No cylinder requests yet
        </div>

        <div class="empty-text">
          You have not submitted any cylinder request.
          Your requests will appear here.
        </div>

        <button
          class="empty-action"
          onclick="requestCylinder()">
          + Request Cylinder
        </button>

      </div>

    `;

    return;

  }

  area.innerHTML =
    currentRequests
      .map(
        function(item){

          const state =
            getOverallState(item);

          const displayStatus =
            state.label;

          const statusClass =
            displayStatus
              .toLowerCase()
              .replace(/\s+/g,"_");

          const progress =
            getProgress(item);

          const quantity =
            Number(
              getValue(
                item,
                [
                  "quantity",
                  "cylinder_quantity"
                ],
                1
              )
            ) || 1;

          const amount =
            Number(
              getValue(
                item,
                [
                  "total_amount",
                  "request_amount",
                  "finance_amount"
                ],
                0
              )
            ) || 0;

          const remaining =
            getRemainingAmount(item);

          const requestNumber =
            getValue(
              item,
              [
                "request_number",
                "request_no"
              ],
              "EGC REQUEST"
            );

          const requestDate =
            getValue(
              item,
              [
                "created_at",
                "request_date",
                "submitted_at"
              ],
              ""
            );

          const deliveryDate =
            getValue(
              item,
              [
                "delivery_date",
                "delivered_at"
              ],
              ""
            );

          const updatedDate =
            getValue(
              item,
              [
                "updated_at",
                "created_at"
              ],
              ""
            );

          const active =
            !!getActiveRequest() &&
          String(
            getActiveRequest()?.id || ""
          ) ===
          String(
            item.id || ""
          );

          const activeClass =
            active
              ? "active-request"
              : "";

          const completedClass =
            isFullyCompleted(item)
              ? "completed-request"
              : "";

          const progressClass =
            progress >= 100
              ? "complete"
              : (
                  state.key === "repayment_due"
                    ? "warning"
                    : ""
                );

          let actionButton = "";

          if(
            state.key === "payment_required"
          ){

            actionButton = `
              <button
                class="payment-btn"
                onclick="openPaymentPage('${escapeHtml(String(item.id || ""))}')">
                Make Payment
              </button>
            `;

          }else if(
            state.key === "repayment_due"
          ){

            actionButton = `
              <button
                class="repayment-btn"
                onclick="openPaymentPage('${escapeHtml(String(item.id || ""))}',true)">
                Pay Remaining
              </button>
            `;

          }else if(
            state.key === "payment_pending" ||
            state.key === "repayment_pending"
          ){

            actionButton = `
              <button
                class="payment-btn"
                onclick="openPaymentPage('${escapeHtml(String(item.id || ""))}')">
                View Payment
              </button>
            `;

          }

          return `

            <div class="request-card ${activeClass} ${completedClass}">

              <div class="request-head">

                <div>

                  <div class="request-id">
                    ${escapeHtml(
                      String(requestNumber)
                    )}
                  </div>

                  <div class="request-date">
                    Requested on
                    ${escapeHtml(
                      formatDateTime(requestDate)
                    )}
                  </div>

                </div>

                <div
                  class="status ${escapeHtml(statusClass)}">

                  ${escapeHtml(
                    displayStatus
                  )}

                </div>

              </div>

              <div class="request-details">

                <div class="detail">

                  <div class="detail-label">
                    Quantity
                  </div>

                  <div class="detail-value">
                    ${quantity}
                  </div>

                </div>

                <div class="detail">

                  <div class="detail-label">
                    Request Amount
                  </div>

                  <div class="detail-value">
                    ₹${formatMoney(amount)}
                  </div>

                </div>

                <div class="detail">

                  <div class="detail-label">
                    Request ID
                  </div>

                  <div class="detail-value">
                    ${escapeHtml(
                      String(
                        item.id || ""
                      ).substring(
                        0,
                        8
                      )
                    )}
                  </div>

                </div>

                <div class="detail">

                  <div class="detail-label">
                    Current Stage
                  </div>

                  <div class="detail-value">
                    ${escapeHtml(
                      displayStatus
                    )}
                  </div>

                </div>

              </div>

              <div class="workflow-box">

                <div class="workflow-title">
                  Request Progress
                </div>

                <div class="workflow">

                  <div class="workflow-step ${getWorkflowClass(item,"request")}">

                    <div class="workflow-dot">
                      1
                    </div>

                    <div class="workflow-label">
                      Request
                    </div>

                  </div>

                  <div class="workflow-step ${getWorkflowClass(item,"payment")}">

                    <div class="workflow-dot">
                      2
                    </div>

                    <div class="workflow-label">
                      Payment
                    </div>

                  </div>

                  <div class="workflow-step ${getWorkflowClass(item,"agency")}">

                    <div class="workflow-dot">
                      3
                    </div>

                    <div class="workflow-label">
                      Agency
                    </div>

                  </div>

                  <div class="workflow-step ${getWorkflowClass(item,"delivery")}">

                    <div class="workflow-dot">
                      4
                    </div>

                    <div class="workflow-label">
                      Delivery
                    </div>

                  </div>

                  <div class="workflow-step ${getWorkflowClass(item,"repayment")}">

                    <div class="workflow-dot">
                      5
                    </div>

                    <div class="workflow-label">
                      Repayment
                    </div>

                  </div>

                </div>

              </div>

              <div class="delivery-row">

                <div>

                  <div class="delivery-label">
                    Current Status
                  </div>

                  <div class="delivery-value">
                    ${escapeHtml(
                      state.message
                    )}
                  </div>

                </div>

                <div>

                  <div class="delivery-label">
                    Delivery
                  </div>

                  <div class="delivery-value">
                    ${escapeHtml(
                      deliveryDate
                        ? formatDate(deliveryDate)
                        : getDeliveryText(item)
                    )}
                  </div>

                </div>

              </div>

              <div class="progress-wrap">

                <div class="progress-top">

                  <div class="progress-label">
                    Request Progress
                  </div>

                  <div class="progress-percent">
                    ${progress}%
                  </div>

                </div>

                <div class="progress">

                  <div
                    class="progress-bar ${progressClass}"
                    style="width:${progress}%">
                  </div>

                </div>

              </div>

              <div class="request-footer">

                <div>

                  <div class="amount">

                    <span>
                      Remaining
                    </span>

                    ₹${formatMoney(
                      remaining
                    )}

                  </div>

                </div>

                <div>

                  ${actionButton}

                  <button
                    class="view-btn"
                    onclick="viewRequest('${escapeHtml(
                      String(item.id || "")
                    )}')">

                    View Details

                  </button>

                </div>

              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* =========================================================
   PAYMENT PAGE
========================================================= */

function openPaymentPage(id, repayment=false){

  if(!id){

    toast(
      "Request details not found."
    );

    return;

  }

  /*
    Payments page next update mein:
    - Initial ₹200 payment
    - Payment verification
    - Repayment
    - Extra charge
    - Transaction ID
    - Screenshot
    sab handle hoga.
  */

  if(repayment){

    window.location.href =
      "payments.html?request_id=" +
      encodeURIComponent(id) +
      "&type=repayment";

    return;

  }

  window.location.href =
    "payments.html?request_id=" +
    encodeURIComponent(id);

}


/* =========================================================
   CONTINUE REQUEST
========================================================= */

function continueCurrentRequest(id){

  const request =
    currentRequests.find(
      function(item){

        return String(item.id) ===
          String(id);

      }
    );

  if(!request){

    toast(
      "Request details not found."
    );

    return;

  }

  const state =
    getOverallState(request);

  if(
    state.key === "payment_required"
  ){

    openPaymentPage(
      request.id
    );

    return;

  }

  if(
    state.key === "repayment_due"
  ){

    openPaymentPage(
      request.id,
      true
    );

    return;

  }

  toast(
    state.message
  );

}


/* =========================================================
   VIEW REQUEST
========================================================= */

function viewRequest(id){

  const request =
    currentRequests.find(
      function(item){

        return String(
          item.id
        ) ===
        String(id);

      }
    );

  if(!request){

    toast(
      "Request details not found."
    );

    return;

  }

  const number =
    getValue(
      request,
      [
        "request_number",
        "request_no"
      ],
      "EGC REQUEST"
    );

  const state =
    getOverallState(request);

  const amount =
    Number(
      getValue(
        request,
        [
          "total_amount",
          "request_amount",
          "finance_amount"
        ],
        0
      )
    ) || 0;

  const remaining =
    getRemainingAmount(request);

  toast(
    String(number) +
    " • " +
    String(state.label) +
    " • ₹" +
    formatMoney(amount) +
    " • Remaining ₹" +
    formatMoney(remaining)
  );

}


/* =========================================================
   REQUEST CYLINDER
========================================================= */

function requestCylinder(){

  const activeRequest =
    getActiveRequest();

  /*
    Previous request cycle completely finished:
    new request allowed.
  */

  if(!activeRequest){

    window.location.href =
      "request-cylinder.html";

    return;

  }

  const state =
    getOverallState(
      activeRequest
    );

  /*
    If payment is required,
    take user directly to Payments.
  */

  if(
    state.key === "payment_required"
  ){

    openPaymentPage(
      activeRequest.id
    );

    return;

  }

  /*
    If repayment is due,
    take user directly to Payments.
  */

  if(
    state.key === "repayment_due"
  ){

    openPaymentPage(
      activeRequest.id,
      true
    );

    return;

  }

  /*
    Otherwise keep user on current request
    until current cycle finishes.
  */

  const requestNumber =
    getValue(
      activeRequest,
      [
        "request_number",
        "request_no"
      ],
      "your current request"
    );

  toast(
    "Your request " +
    requestNumber +
    " is still in progress."
  );

  showInfo(
    state.message
  );

  const activeCard =
    document.querySelector(
      ".active-request"
    );

  if(activeCard){

    activeCard.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  }

}


/* =========================================================
   REFRESH
========================================================= */

async function refreshRequests(){

  const button =
    $("refreshBtn");

  button.disabled =
    true;

  button.textContent =
    "↻ Refreshing...";

  await loadRequests();

  button.disabled =
    false;

  button.textContent =
    "↻ Refresh";

  toast(
    "Requests updated."
  );

}


/* =========================================================
   REALTIME
========================================================= */

function subscribeRealtime(){

  if(!currentUser?.id){
    return;
  }

  if(realtimeChannel){

    supabaseClient.removeChannel(
      realtimeChannel
    );

  }

  realtimeChannel =
    supabaseClient
      .channel(
        "my-requests-" +
        currentUser.id
      )

      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"cylinder_requests",
          filter:
            "user_id=eq." +
            currentUser.id
        },
        async function(payload){

          if(!payload.new){
            return;
          }

          currentRequests.unshift(
            payload.new
          );

          currentRequests =
            currentRequests.slice(
              0,
              100
            );

          updateCounters();

          updateRequestButton();

          renderRequests();

          toast(
            "New cylinder request added."
          );

        }
      )

      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"cylinder_requests",
          filter:
            "user_id=eq." +
            currentUser.id
        },
        async function(payload){

          if(!payload.new){
            return;
          }

          const index =
            currentRequests.findIndex(
              function(item){

                return String(
                  item.id
                ) ===
                String(
                  payload.new.id
                );

              }
            );

          if(index !== -1){

            currentRequests[index] =
              payload.new;

          }else{

            currentRequests.unshift(
              payload.new
            );

          }

          updateCounters();

          updateRequestButton();

          renderRequests();

          const newState =
            getOverallState(
              payload.new
            );

          if(
            newState.key ===
            "payment_required"
          ){

            toast(
              "🎉 Request approved. Payment is now required."
            );

            showInfo(
              "Your request has been approved. Please open the Payments page to complete the required payment."
            );

          }else if(
            newState.key ===
            "agency_processing"
          ){

            toast(
              "Payment approved. Agency processing started."
            );

            showInfo(
              "Your payment has been approved and your cylinder is being processed by the agency."
            );

          }else if(
            newState.key ===
            "out_for_delivery"
          ){

            toast(
              "🚚 Your cylinder is out for delivery."
            );

            showInfo(
              "Your cylinder is out for delivery."
            );

          }else if(
            newState.key ===
            "repayment_due"
          ){

            toast(
              "💰 Remaining payment is now due."
            );

            showInfo(
              "Your cylinder has been delivered. Please open the Payments page to complete the remaining payment."
            );

          }else if(
            newState.key ===
            "completed"
          ){

            toast(
              "✅ Request completed successfully."
            );

            showInfo(
              "Your complete cylinder request and repayment cycle is finished. You can now submit a new request."
            );

          }else{

            toast(
              "Your request status was updated."
            );

          }

        }
      )

      .subscribe(
        function(status){

          console.log(
            "My Requests realtime:",
            status
          );

        }
      );

}

/* =========================================================
   LOGOUT
========================================================= */

function openLogoutPopup(){

  $("logoutOverlay")
    .classList
    .add("show");

  document.body.style.overflow =
    "hidden";

}


function closeLogoutPopup(event){

  if(
    event &&
    event.target &&
    event.target.id !==
    "logoutOverlay"
  ){

    return;

  }

  $("logoutOverlay")
    .classList
    .remove("show");

  document.body.style.overflow =
    "";

}


async function confirmLogout(){

  const button =
    $("confirmLogoutBtn");

  button.disabled =
    true;

  button.textContent =
    "Logging out...";

  const result =
    await supabaseClient
      .auth
      .signOut();

  if(result.error){

    button.disabled =
      false;

    button.textContent =
      "Logout";

    toast(
      result.error.message ||
      "Logout failed."
    );

    return;

  }

  if(realtimeChannel){

    await supabaseClient
      .removeChannel(
        realtimeChannel
      );

    realtimeChannel =
      null;

  }

  window.location.replace(
    "login.html"
  );

}


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key ===
      "Escape"
    ){

      closeLogoutPopup();

    }

  }
);


/* =========================================================
   AUTH STATE
========================================================= */

if(supabaseClient){

  supabaseClient
    .auth
    .onAuthStateChange(
      function(event){

        if(
          event ===
          "SIGNED_OUT"
        ){

          if(realtimeChannel){

            supabaseClient
              .removeChannel(
                realtimeChannel
              );

            realtimeChannel =
              null;

          }

          window.location.replace(
            "login.html"
          );

        }

      }
    );

}


/* =========================================================
   INITIALIZE
========================================================= */

async function initializePage(){

  try{

    clearError();

    if(!supabaseClient){

      showError(
        "Supabase client is not loaded. Please refresh the page."
      );

      return;

    }

    const authResult =
      await supabaseClient
        .auth
        .getUser();

    if(
      authResult.error ||
      !authResult.data?.user
    ){

      window.location.replace(
        "login.html"
      );

      return;

    }

    currentUser =
      authResult.data.user;

    await loadProfile();

    await loadRequests();

    subscribeRealtime();

  }catch(error){

    console.error(
      "My Requests initialization error:",
      error
    );

    showError(
      error.message ||
      "Unable to load My Requests."
    );

  }

}


/* =========================================================
   START
========================================================= */

if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    initializePage
  );

}else{

  initializePage();

}

</script>
