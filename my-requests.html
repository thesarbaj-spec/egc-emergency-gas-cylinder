<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGC - My Requests</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eef7fc;color:#003e81;min-height:100vh}
button{font-family:Arial,sans-serif;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.65}
.topbar{height:72px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 35px;box-shadow:0 3px 15px rgba(0,62,129,.08);position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:115px;height:48px;object-fit:contain}
.brand-text{font-size:13px;color:#70859a}
.profile-mini{display:flex;align-items:center;gap:12px}
.profile-photo{width:43px;height:43px;border-radius:50%;object-fit:cover;background:#dfeef8;border:2px solid #e1edf5}
.profile-name{font-weight:800;color:#003e81;font-size:14px}
.profile-email{color:#8295a6;font-size:11px;margin-top:3px}
.layout{display:flex;min-height:calc(100vh - 72px)}
.sidebar{width:235px;background:#fff;border-right:1px solid #e1edf5;padding:25px 14px;position:fixed;left:0;top:72px;bottom:0;z-index:40}
.nav-title{font-size:11px;color:#94a5b5;font-weight:800;padding:8px 13px;text-transform:uppercase;margin-bottom:5px}
.nav-btn{width:100%;border:0;background:transparent;color:#58738d;padding:13px 14px;border-radius:11px;text-align:left;font-size:14px;font-weight:700;margin-bottom:5px}
.nav-btn:hover,.nav-btn.active{background:#eaf5fc;color:#0754a9}
.nav-btn.blocked{color:#8297a8;background:#f3f7fa}
.logout{position:absolute;left:14px;right:14px;bottom:20px;color:#d33b3b}
.main{margin-left:235px;width:calc(100% - 235px);padding:30px}
.page-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}
.page-header-left h1{font-size:28px;color:#003e81;margin-bottom:7px}
.page-header-left p{color:#71869a;font-size:14px}
.header-actions{display:flex;gap:10px}
.refresh-btn,.request-btn-small{height:44px;border-radius:12px;padding:0 17px;font-size:13px;font-weight:900}
.refresh-btn{border:1px solid #d7e5ee;background:#fff;color:#0754a9}
.refresh-btn:hover{background:#f5fbff}
.request-btn-small{border:0;background:linear-gradient(90deg,#ffb900,#ffc515);color:#00418b;box-shadow:0 6px 15px rgba(247,185,0,.18)}
.request-btn-small.blocked{background:#e8f1f7;color:#648096;box-shadow:none}
.error-box{display:none;background:#fff0f0;border:1px solid #ffd0d0;color:#c62828;padding:13px;border-radius:12px;margin-bottom:18px;font-size:13px;font-weight:700;overflow-wrap:anywhere}
.info-box{display:none;background:#eaf5fc;border:1px solid #cfe7f6;color:#0754a9;padding:14px 16px;border-radius:13px;margin-bottom:18px;font-size:13px;font-weight:700;line-height:1.5}
.info-box.show{display:block}
.summary-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:17px;margin-bottom:22px}
.summary-card{background:#fff;border:1px solid #e2edf4;border-radius:18px;padding:19px;box-shadow:0 7px 22px rgba(0,62,129,.06)}
.summary-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.summary-label{color:#7b8fa1;font-size:12px;font-weight:700}
.summary-icon{width:38px;height:38px;border-radius:11px;background:#eaf5fc;display:flex;align-items:center;justify-content:center;font-size:19px}
.summary-number{font-size:25px;font-weight:900;color:#003e81}
.box{background:#fff;border:1px solid #e2edf4;border-radius:20px;padding:23px;box-shadow:0 7px 22px rgba(0,62,129,.06)}
.box-title-row{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}
.box-title{font-size:18px;font-weight:900;color:#003e81}
.request-list{display:grid;gap:15px}
.request-card{background:#f7fbfe;border:1px solid #dceef9;border-radius:17px;padding:19px;min-width:0}
.request-card.active-request{border-color:#9ed2f1;box-shadow:0 7px 20px rgba(8,114,213,.08)}
.request-card.completed-request{border-color:#b8e4cf}
.request-card.rejected-request{border-color:#ffcaca}
.request-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}
.request-id{color:#0754a9;font-size:16px;font-weight:900;overflow-wrap:anywhere}
.request-date{color:#899aaa;font-size:11px;margin-top:5px}
.status{display:inline-block;padding:7px 11px;border-radius:20px;font-size:10px;font-weight:900;text-transform:uppercase;white-space:normal;background:#fff3d0;color:#a36b00;text-align:center}
.status.approved,.status.completed,.status.delivered,.status.paid{background:#e5f8ef;color:#087848}
.status.processing,.status.out_for_delivery,.status.payment_approved,.status.submitted,.status.verification_pending,.status.repayment_submitted,.status.agency_processing{background:#e8f1ff;color:#0754a9}
.status.payment_required,.status.repayment_due,.status.pending,.status.owner_pending,.status.payment_pending{background:#fff0d5;color:#a66b00}
.status.cancelled,.status.canceled,.status.failed,.status.rejected,.status.payment_rejected{background:#fff0f0;color:#c62828}
.payment-status-note{margin-top:14px;padding:11px 13px;border-radius:11px;font-size:12px;font-weight:800;line-height:1.5;overflow-wrap:anywhere}
.payment-status-note.payment-approved{color:#166534;background:#dcfce7;border:1px solid #86efac}
.payment-status-note.payment-rejected{color:#b91c1c;background:#fee2e2;border:1px solid #fca5a5}
.payment-status-note.payment-pending{color:#92400e;background:#fef3c7;border:1px solid #fcd34d}
.request-details{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-top:19px}
.detail{background:#fff;border:1px solid #e7f0f5;border-radius:12px;padding:12px;min-width:0}
.detail-label{color:#8999a8;font-size:10px;margin-bottom:5px}
.detail-value{font-size:13px;font-weight:900;color:#174e7e;word-break:break-word}
.workflow-box{margin-top:17px;padding:15px;background:#fff;border:1px solid #e5eef4;border-radius:14px}
.workflow-title{font-size:11px;color:#71869a;font-weight:900;margin-bottom:12px;text-transform:uppercase}
.workflow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.workflow-step{text-align:center;min-width:0}
.workflow-dot{width:27px;height:27px;margin:0 auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e7eef3;color:#7890a2;font-size:12px;font-weight:900}
.workflow-step.done .workflow-dot{background:#dff6ea;color:#087848}
.workflow-step.current .workflow-dot{background:#0872d5;color:#fff}
.workflow-step.failed .workflow-dot{background:#ffe1e1;color:#c62828}
.workflow-label{font-size:9px;color:#8294a3;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.workflow-step.done .workflow-label,.workflow-step.current .workflow-label{color:#0754a9}
.delivery-row{margin-top:15px;padding-top:15px;border-top:1px solid #e2edf4;display:flex;justify-content:space-between;align-items:flex-start;gap:15px}
.delivery-label{color:#71869a;font-size:11px;margin-bottom:4px}
.delivery-value{font-size:12px;font-weight:900;color:#174e7e;line-height:1.5;overflow-wrap:anywhere}
.progress-wrap{margin-top:17px}
.progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.progress-label{color:#7b8fa1;font-size:10px;font-weight:700}
.progress-percent{color:#0754a9;font-size:10px;font-weight:900}
.progress{height:8px;background:#e2edf4;border-radius:20px;overflow:hidden}
.progress-bar{height:100%;width:0;background:#0872d5;border-radius:20px;transition:width .3s}
.progress-bar.complete{background:#0b9259}
.progress-bar.warning{background:#e0a400}
.request-footer{margin-top:17px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.amount{font-size:14px;font-weight:900;color:#003e81}
.amount span{color:#899aaa;font-size:10px;font-weight:700;margin-right:4px}
.view-btn,.payment-btn,.continue-btn,.repayment-btn{border-radius:10px;padding:9px 12px;font-size:11px;font-weight:900;margin:0 0 0 5px}
.view-btn{border:1px solid #d6e5ee;background:#fff;color:#0754a9}
.view-btn:hover{background:#eaf5fc}
.payment-btn,.continue-btn{border:0;background:#0872d5;color:#fff}
.payment-btn:hover,.continue-btn:hover{background:#075eae}
.repayment-btn{border:0;background:#ffb900;color:#00418b}
.repayment-btn:hover{background:#e8a900}
.empty{text-align:center;padding:40px 15px;color:#8a9aaa;font-size:13px}
.empty-icon{width:58px;height:58px;margin:0 auto 13px;border-radius:17px;background:#eaf5fc;display:flex;align-items:center;justify-content:center;font-size:26px}
.empty-title{color:#315b7e;font-size:15px;font-weight:900;margin-bottom:6px}
.empty-text{color:#8a9aaa;font-size:12px;line-height:1.5}
.empty-action{margin-top:16px;height:43px;border:0;border-radius:11px;padding:0 17px;background:linear-gradient(90deg,#ffb900,#ffc515);color:#00418b;font-size:12px;font-weight:900}
.loading{padding:40px 15px;text-align:center;color:#71869a;font-size:13px}
.spinner{width:28px;height:28px;border:3px solid #dcecf6;border-top-color:#0872d5;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mobile-nav{display:none}
.toast{position:fixed;right:25px;bottom:25px;z-index:10001;background:#003e81;color:#fff;padding:13px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);font-size:13px;font-weight:700;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;max-width:calc(100% - 30px)}
.toast.show{opacity:1;transform:translateY(0)}
.logout-overlay{display:none;position:fixed;inset:0;background:rgba(0,20,40,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:9999;align-items:center;justify-content:center;padding:20px}
.logout-overlay.show{display:flex}
.logout-popup{width:100%;max-width:390px;background:#fff;border-radius:22px;padding:28px 25px 24px;box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center;animation:logoutPopupIn .18s ease-out}
@keyframes logoutPopupIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.logout-icon{width:58px;height:58px;border-radius:17px;background:#fff0f0;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px}
.logout-title{font-size:21px;font-weight:900;color:#173f62;margin-bottom:10px}
.logout-subtitle{font-size:13px;color:#7c8d9c;line-height:1.5;margin-bottom:23px}
.logout-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.logout-cancel-btn,.logout-confirm-btn{height:48px;border-radius:12px;font-size:14px;font-weight:900}
.logout-cancel-btn{background:#fff;color:#31526d;border:1px solid #d7e2ea}
.logout-confirm-btn{background:#e53935;color:#fff;border:1px solid #e53935}
@media(max-width:1100px){
.summary-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
.request-details{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:800px){
.sidebar{display:none}
.main{margin-left:0;width:100%;padding:20px 15px 90px}
.topbar{height:65px;padding:0 15px}
.layout{min-height:calc(100vh - 65px)}
.brand img{width:100px}
.brand-text,.profile-email{display:none}
.profile-photo{width:38px;height:38px}
.page-header{align-items:flex-start;flex-direction:column;margin-bottom:20px}
.page-header-left h1{font-size:23px}
.page-header-left p{font-size:12px}
.header-actions{width:100%}
.refresh-btn,.request-btn-small{flex:1}
.summary-cards{gap:12px}
.summary-card{padding:16px}
.summary-number{font-size:22px}
.summary-icon{width:35px;height:35px;font-size:17px}
.summary-label{font-size:11px}
.box{padding:18px;border-radius:17px}
.box-title{font-size:17px}
.request-card{padding:16px}
.request-head{flex-direction:column;align-items:flex-start}
.request-details{gap:10px}
.detail{padding:10px}
.workflow{gap:3px}
.workflow-dot{width:24px;height:24px;font-size:10px}
.workflow-label{font-size:8px}
.delivery-row{flex-direction:column}
.request-footer{align-items:flex-start;flex-direction:column}
.request-footer>div{width:100%}
.request-footer>div:last-child{display:grid;grid-template-columns:1fr}
.view-btn,.payment-btn,.continue-btn,.repayment-btn{width:100%;margin:0 0 7px}
.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:67px;background:#fff;border-top:1px solid #dce8ef;z-index:100;justify-content:space-around;align-items:center;box-shadow:0 -5px 20px rgba(0,62,129,.08)}
.mobile-nav button{border:0;background:transparent;color:#7890a3;font-size:10px;font-weight:800}
.mobile-nav button span{display:block;font-size:20px;margin-bottom:3px}
.mobile-nav button.active{color:#0754a9}
.logout-popup{max-width:350px;padding:25px 20px 21px}
.logout-title{font-size:20px}
.toast{left:15px;right:15px;bottom:80px;text-align:center;max-width:none}
}
@media(max-width:450px){
.request-details{grid-template-columns:1fr 1fr}
.request-id{font-size:14px}
.detail-value{font-size:12px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="assets/EGC - Emergency Gas Cylinder logo.png" alt="EGC">
    <div class="brand-text">Emergency Gas Cylinder</div>
  </div>
  <div class="profile-mini">
    <div>
      <div class="profile-name" id="topName">Loading...</div>
      <div class="profile-email" id="topEmail">Loading...</div>
    </div>
    <img id="topPhoto" class="profile-photo" src="" alt="Profile">
  </div>
</header>

<div class="layout">
<aside class="sidebar">
  <div class="nav-title">MENU</div>
  <button class="nav-btn" onclick="goDashboard()">🏠 &nbsp; Dashboard</button>
  <button class="nav-btn" id="sidebarRequestBtn" onclick="requestCylinder()">🛢️ &nbsp; Request Cylinder</button>
  <button class="nav-btn active" onclick="goRequests()">📋 &nbsp; My Requests</button>
  <button class="nav-btn" onclick="goPayments()">💰 &nbsp; Payments</button>
  <button class="nav-btn" onclick="goNotifications()">🔔 &nbsp; Notifications</button>
  <button class="nav-btn" onclick="goProfile()">👤 &nbsp; Profile</button>
  <button class="nav-btn" onclick="goSettings()">⚙️ &nbsp; Settings</button>
  <button class="nav-btn" onclick="goHelp()">❓ &nbsp; Help &amp; Support</button>
  <button class="nav-btn logout" onclick="openLogoutPopup()">🚪 &nbsp; Logout</button>
</aside>

<main class="main">
  <div id="errorBox" class="error-box" role="alert"></div>
  <div id="infoBox" class="info-box" role="status"></div>

  <section class="page-header">
    <div class="page-header-left">
      <h1>My Requests</h1>
      <p id="pageSubtitle">View and track all your cylinder requests.</p>
    </div>
    <div class="header-actions">
      <button class="refresh-btn" id="refreshBtn" onclick="refreshRequests()">↻ Refresh</button>
      <button class="request-btn-small" id="requestCylinderBtn" onclick="requestCylinder()">+ Request Cylinder</button>
    </div>
  </section>

  <section class="summary-cards">
    <div class="summary-card"><div class="summary-top"><div class="summary-label">Total Requests</div><div class="summary-icon">📋</div></div><div class="summary-number" id="totalRequests">0</div></div>
    <div class="summary-card"><div class="summary-top"><div class="summary-label">Pending</div><div class="summary-icon">⏳</div></div><div class="summary-number" id="pendingRequests">0</div></div>
    <div class="summary-card"><div class="summary-top"><div class="summary-label">Approved</div><div class="summary-icon">✅</div></div><div class="summary-number" id="approvedRequests">0</div></div>
    <div class="summary-card"><div class="summary-top"><div class="summary-label">Completed</div><div class="summary-icon">✔️</div></div><div class="summary-number" id="completedRequests">0</div></div>
  </section>

  <section class="box">
    <div class="box-title-row"><div class="box-title">🛢️ All Cylinder Requests</div></div>
    <div id="requestsArea" class="request-list"><div class="loading"><div class="spinner"></div>Loading your requests...</div></div>
  </section>
</main>
</div>

<nav class="mobile-nav">
  <button onclick="goDashboard()"><span>🏠</span>Home</button>
  <button class="active" onclick="goRequests()"><span>📋</span>Requests</button>
  <button onclick="requestCylinder()"><span>➕</span>Request</button>
  <button onclick="goPayments()"><span>💰</span>Payments</button>
  <button onclick="goProfile()"><span>👤</span>Profile</button>
</nav>

<div class="logout-overlay" id="logoutOverlay" onclick="closeLogoutPopup(event)">
  <div class="logout-popup" onclick="event.stopPropagation()">
    <div class="logout-icon">🚪</div>
    <div class="logout-title">Are you sure you want to logout?</div>
    <div class="logout-subtitle">Emergency Gas Cylinder</div>
    <div class="logout-buttons">
      <button type="button" class="logout-cancel-btn" onclick="closeLogoutPopup()">Cancel</button>
      <button type="button" class="logout-confirm-btn" id="confirmLogoutBtn" onclick="confirmLogout()">Logout</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
const SUPABASE_URL = "https://szefvmvokkhvnzryodqu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_S8aSsfmOKN6_7laRfgoMKA_Re2HzRS6";

let supabaseClient = null;
if (window.supabase && typeof window.supabase.createClient === "function") {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

let currentUser = null;
let currentProfile = null;
let currentRequests = [];
let currentPayments = [];
let realtimeChannel = null;
let paymentRealtimeChannel = null;
let toastTimer = null;
let isLoggingOut = false;
let isLoadingRequests = false;

function $(id){return document.getElementById(id)}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatMoney(value){
  return (Number(value)||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function formatDate(value){
  if(!value)return "—";
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return "—";
  return date.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
}

function formatDateTime(value){
  if(!value)return "—";
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return "—";
  return date.toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
}

function showError(message){
  const box=$("errorBox");
  if(!box)return;
  box.textContent=message||"Something went wrong.";
  box.style.display="block";
}

function clearError(){
  const box=$("errorBox");
  if(!box)return;
  box.style.display="none";
  box.textContent="";
}

function showInfo(message){
  const box=$("infoBox");
  if(!box)return;
  box.textContent=message||"";
  box.classList.toggle("show",Boolean(message));
}

function toast(message){
  const element=$("toast");
  if(!element)return;
  element.textContent=message||"";
  element.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>element.classList.remove("show"),3000);
}

function getValue(item,fields,fallback=""){
  for(const field of fields){
    if(item && Object.prototype.hasOwnProperty.call(item,field) &&
      item[field]!==null && item[field]!==undefined && item[field]!==""){
      return item[field];
    }
  }
  return fallback;
}

function normalizeStatus(value){
  return String(value||"").trim().toLowerCase().replace(/[\s-]+/g,"_");
}

function isApproved(value){
  return ["approved","approve"].includes(normalizeStatus(value));
}

function isRejectedValue(value){
  return ["rejected","cancelled","canceled","failed"].includes(normalizeStatus(value));
}

function getRequestStatus(item){
  return normalizeStatus(getValue(item,["user_status","request_status","status"],"pending"));
}

function getOwnerApproval(item){
  const explicit=normalizeStatus(getValue(item,["owner_approval","owner_status","approval_status"],""));
  if(explicit)return explicit;

  const requestStatus=getRequestStatus(item);
  if(["approved","approve"].includes(requestStatus))return "approved";
  if(["rejected","cancelled","canceled"].includes(requestStatus))return requestStatus;
  return "pending";
}

function getAgencyStatus(item){
  return normalizeStatus(getValue(item,["agency_status","agency_processing_status"],""));
}

function getDeliveryStatus(item){
  return normalizeStatus(getValue(item,["delivery_status"],""));
}

function getRepaymentStatus(item){
  return normalizeStatus(getValue(item,["repayment_status","repayment_approval_status"],""));
}

function getPaymentsForRequest(requestId){
  return currentPayments
    .filter(payment=>String(payment.request_id)===String(requestId))
    .sort((a,b)=>{
      const dateA=new Date(a.created_at||a.payment_date||a.verified_at||0).getTime();
      const dateB=new Date(b.created_at||b.payment_date||b.verified_at||0).getTime();
      return dateB-dateA;
    });
}

function getLatestPayment(item){
  return getPaymentsForRequest(item.id)[0]||null;
}

function getPaymentData(item){
  const payment=getLatestPayment(item);

  if(payment){
    return {
      record:payment,
      status:normalizeStatus(payment.payment_status),
      verification:normalizeStatus(payment.verification_status),
      amount:Number(payment.payment_amount)||0,
      transactionId:payment.transaction_id||payment.payment_reference||"",
      method:payment.payment_method||"",
      rejectionReason:payment.owner_rejection_reason||""
    };
  }

  return {
    record:null,
    status:normalizeStatus(getValue(item,["payment_status"],"")),
    verification:normalizeStatus(getValue(item,["payment_verification_status"],"")),
    amount:0,
    transactionId:item.payment_transaction_id||item.payment_reference||"",
    method:item.payment_method||"",
    rejectionReason:item.owner_rejection_reason||""
  };
}

function isPaymentRejected(item){
  const payment=getPaymentData(item);
  return isRejectedValue(payment.status)||isRejectedValue(payment.verification);
}

function isPaymentVerified(item){
  const payment=getPaymentData(item);
  return payment.status==="paid" && payment.verification==="approved";
}

function isRepaymentVerified(item){
  return ["approved","paid","completed"].includes(getRepaymentStatus(item));
}

function getRequestAmount(item){
  return Math.max(0,Number(getValue(item,["total_amount","cylinder_amount","request_amount","finance_amount"],0))||0);
}

/*
 * FIX:
 * Owner approval pending means no payable balance should be
 * presented to the customer yet. Once approved, use database
 * remaining_amount when available, otherwise calculate using
 * verified payments only.
 */
function getRemainingAmount(item){
  if(!isApproved(getOwnerApproval(item)))return 0;

  const direct=getValue(item,["remaining_amount","remaining_payable","balance_amount"],null);
  if(direct!==null && direct!=="")return Math.max(0,Number(direct)||0);

  const total=getRequestAmount(item);
  if(!total)return 0;

  const storedPaid=Math.max(0,Number(getValue(item,["total_paid","paid_amount","amount_paid"],0))||0);
  const verifiedPaymentTotal=getPaymentsForRequest(item.id)
    .filter(payment=>
      normalizeStatus(payment.payment_status)==="paid" &&
      normalizeStatus(payment.verification_status)==="approved"
    )
    .reduce((sum,payment)=>sum+(Number(payment.payment_amount)||0),0);

  return Math.max(0,total-Math.max(storedPaid,verifiedPaymentTotal));
}

function isFullyCompleted(item){
  const requestStatus=getRequestStatus(item);
  const deliveryStatus=getDeliveryStatus(item);
  const remaining=getRemainingAmount(item);
  const repaymentStatus=getRepaymentStatus(item);

  if(requestStatus==="completed")return true;

  return deliveryStatus==="delivered" && remaining<=0 && isRepaymentVerified(item);
}

function isRejected(item){
  return isRejectedValue(getRequestStatus(item))||
    isRejectedValue(getOwnerApproval(item))||
    isPaymentRejected(item)||
    isRejectedValue(getRepaymentStatus(item));
}

function getActiveRequest(){
  return currentRequests.find(item=>!isRejected(item)&&!isFullyCompleted(item))||null;
}

function getOverallState(item){
  const requestStatus=getRequestStatus(item);
  const ownerApproval=getOwnerApproval(item);
  const payment=getPaymentData(item);
  const deliveryStatus=getDeliveryStatus(item);
  const agencyStatus=getAgencyStatus(item);
  const repaymentStatus=getRepaymentStatus(item);
  const remaining=getRemainingAmount(item);

  if(isRejectedValue(requestStatus)||isRejectedValue(ownerApproval)){
    return {key:"rejected",label:"Request Rejected",message:"This request was rejected or cancelled. Please contact support if you need help.",progress:0};
  }

  if(isFullyCompleted(item)){
    return {key:"completed",label:"Completed",message:"Your cylinder request and repayment cycle have been completed.",progress:100};
  }

  if(!isApproved(ownerApproval)){
    return {key:"owner_pending",label:"Pending Owner Approval",message:"Your request has been submitted and is waiting for Owner approval.",progress:20};
  }

  if(isPaymentRejected(item)){
    return {key:"payment_rejected",label:"Payment Rejected",message:payment.rejectionReason?"Your payment was rejected: "+payment.rejectionReason:"Your payment was rejected. Please check the Payments page.",progress:35};
  }

  const submittedStatuses=["submitted","pending","pending_verification","verification_pending","under_review","processing"];
  const hasPaymentSubmission=Boolean(payment.record)||
    payment.status==="paid"||
    submittedStatuses.includes(payment.status)||
    submittedStatuses.includes(payment.verification);

  if(!isPaymentVerified(item)){
    if(hasPaymentSubmission){
      return {key:"payment_pending",label:"Payment Verification Pending",message:"Your payment has been submitted and is waiting for Owner verification.",progress:45};
    }
    return {key:"payment_required",label:"Payment Required",message:"Your request has been approved. Please open Payments to submit the required initial payment.",progress:35};
  }

  if(deliveryStatus==="delivered"){
    if(["submitted","pending","pending_verification","verification_pending","under_review"].includes(repaymentStatus)){
      return {key:"repayment_pending",label:"Repayment Verification Pending",message:"Your repayment has been submitted and is waiting for Owner verification.",progress:95};
    }
    if(remaining>0){
      return {key:"repayment_due",label:"Repayment Due",message:"Your cylinder has been delivered. The remaining amount and applicable charges are due.",progress:90};
    }
    if(isRepaymentVerified(item)){
      return {key:"completed",label:"Completed",message:"Your cylinder request and complete repayment have been verified.",progress:100};
    }
    return {key:"repayment_due",label:"Repayment Due",message:"Your cylinder has been delivered. Please check Payments for your remaining balance.",progress:90};
  }

  if(deliveryStatus==="out_for_delivery"){
    return {key:"out_for_delivery",label:"Out for Delivery",message:"Your initial payment is verified and your cylinder is out for delivery.",progress:85};
  }

  if(["processing","assigned","ready"].includes(agencyStatus)||
    ["processing","assigned","ready"].includes(deliveryStatus)){
    return {key:"agency_processing",label:"Agency Processing",message:"Your initial payment is verified. The selected agency is processing your cylinder.",progress:70};
  }

  return {key:"agency_processing",label:"Payment Approved",message:"Your initial payment has been verified by the Owner. Your cylinder is awaiting agency processing.",progress:60};
}

async function loadProfile(){
  if(!currentUser?.id)return;

  const {data,error}=await supabaseClient.from("profiles").select("*").eq("id",currentUser.id).maybeSingle();
  if(error)console.warn("Profile load error:",error);

  currentProfile=data||null;
  const name=data?.full_name||currentUser.user_metadata?.full_name||"EGC Customer";
  const email=data?.email||currentUser.email||"";

  if($("topName"))$("topName").textContent=name;
  if($("topEmail"))$("topEmail").textContent=email;

  if($("topPhoto")){
    $("topPhoto").src=data?.profile_photo||
      "https://ui-avatars.com/api/?name="+encodeURIComponent(name)+"&background=eaf5fc&color=0754a9";

    $("topPhoto").onerror=function(){
      this.onerror=null;
      this.src="https://ui-avatars.com/api/?name=EGC&background=eaf5fc&color=0754a9";
    };
  }
}

async function loadRequests(){
  if(!currentUser?.id||!supabaseClient||isLoadingRequests)return;
  isLoadingRequests=true;
  const area=$("requestsArea");

  try{
    const {data:requests,error:requestError}=await supabaseClient
      .from("cylinder_requests")
      .select("*")
      .eq("user_id",currentUser.id)
      .order("created_at",{ascending:false});

    if(requestError)throw requestError;

    const newRequests=requests||[];
    let newPayments=[];

    if(newRequests.length){
      const requestIds=newRequests.map(request=>request.id).filter(Boolean);

      if(requestIds.length){
        const {data:payments,error:paymentError}=await supabaseClient
          .from("payments")
          .select("*")
          .in("request_id",requestIds)
          .eq("user_id",currentUser.id)
          .order("created_at",{ascending:false});

        if(paymentError){
          throw new Error("Requests loaded, but payment statuses could not be loaded: "+paymentError.message);
        }
        newPayments=payments||[];
      }
    }

    currentRequests=newRequests;
    currentPayments=newPayments;
    clearError();
    updateCounters();
    updateRequestButton();
    renderRequests();
  }catch(error){
    console.error("My Requests load error:",error);
    if(area){
      area.innerHTML=`
        <div class="empty">
          <div class="empty-icon">⚠️</div>
          <div class="empty-title">Unable to load requests</div>
          <div class="empty-text">${escapeHtml(error.message||"Please try again.")}</div>
        </div>`;
    }
    showError("Unable to load your requests: "+(error.message||"Please try again."));
    throw error;
  }finally{
    isLoadingRequests=false;
  }
}

function updateCounters(){
  $("totalRequests").textContent=currentRequests.length;

  $("pendingRequests").textContent=currentRequests.filter(item=>
    ["owner_pending","pending","payment_required","payment_pending","payment_rejected","repayment_due","repayment_pending"].includes(getOverallState(item).key)
  ).length;

  $("approvedRequests").textContent=currentRequests.filter(item=>
    isApproved(getOwnerApproval(item))&&!isRejectedValue(getRequestStatus(item))
  ).length;

  $("completedRequests").textContent=currentRequests.filter(item=>isFullyCompleted(item)).length;
}

function updateRequestButton(){
  const active=getActiveRequest();
  const button=$("requestCylinderBtn");
  const sidebarButton=$("sidebarRequestBtn");

  if(active){
    if(button){
      button.classList.add("blocked");
      button.textContent="⏳ Request in Progress";
    }
    if(sidebarButton){
      sidebarButton.classList.add("blocked");
      sidebarButton.textContent="⏳ Request in Progress";
    }
    showInfo(getOverallState(active).message);
  }else{
    if(button){
      button.classList.remove("blocked");
      button.textContent="+ Request Cylinder";
    }
    if(sidebarButton){
      sidebarButton.classList.remove("blocked");
      sidebarButton.textContent="🛢️ Request Cylinder";
    }
    showInfo("");
  }
}

function getDeliveryText(item){
  const status=getDeliveryStatus(item);
  if(status==="delivered")return "Cylinder Delivered";
  if(status==="out_for_delivery")return "Out for Delivery";
  if(status==="processing")return "Processing";
  if(status==="assigned")return "Delivery Assigned";
  if(status==="ready")return "Cylinder Ready";

  const state=getOverallState(item);
  if(state.key==="owner_pending")return "Delivery Pending";
  if(state.key==="payment_required")return "Payment Required";
  if(state.key==="payment_pending")return "Delivery Pending";
  if(state.key==="payment_rejected")return "Payment Rejected";
  if(state.key==="agency_processing")return "Agency Processing";
  if(state.key==="repayment_due")return "Repayment Due";
  if(state.key==="repayment_pending")return "Repayment Verification Pending";
  if(state.key==="completed")return "Completed";
  if(state.key==="rejected")return "Request Cancelled";
  return "Delivery Pending";
}

function getWorkflowClass(item,step){
  const state=getOverallState(item);

  if(state.key==="rejected")return step==="request"?"failed":"";
  if(state.key==="payment_rejected"){
    if(step==="request")return "done";
    if(step==="payment")return "failed";
    return "";
  }

  if(step==="request")return state.progress>=20?"done":"";

  if(step==="payment"){
    if(isPaymentVerified(item))return "done";
    if(["payment_required","payment_pending"].includes(state.key))return "current";
    return "";
  }

  if(step==="agency"){
    if(["out_for_delivery","repayment_due","repayment_pending","completed"].includes(state.key))return "done";
    if(state.key==="agency_processing")return "current";
    return "";
  }

  if(step==="delivery"){
    if(getDeliveryStatus(item)==="delivered")return "done";
    if(state.key==="out_for_delivery")return "current";
    return "";
  }

  if(step==="repayment"){
    if(state.key==="completed")return "done";
    if(["repayment_due","repayment_pending"].includes(state.key))return "current";
    return "";
  }

  return "";
}

function renderRequests(){
  const area=$("requestsArea");
  if(!area)return;

  if(!currentRequests.length){
    area.innerHTML=`
      <div class="empty">
        <div class="empty-icon">🛢️</div>
        <div class="empty-title">No cylinder requests yet</div>
        <div class="empty-text">You have not submitted any cylinder request. Your requests will appear here.</div>
        <button class="empty-action" onclick="requestCylinder()">+ Request Cylinder</button>
      </div>`;
    return;
  }

  area.innerHTML=currentRequests.map(item=>{
    const state=getOverallState(item);
    const progress=state.progress;
    const quantity=Math.max(1,Number(getValue(item,["quantity","cylinder_quantity"],1))||1);
    const amount=getRequestAmount(item);
    const remaining=getRemainingAmount(item);
    const payment=getPaymentData(item);
    const requestNumber=getValue(item,["request_number","request_no"],"EGC REQUEST");
    const requestDate=getValue(item,["created_at","request_date","submitted_at"],"");
    const deliveryDate=getValue(item,["delivery_date","delivered_at"],"");
    const activeRequest=getActiveRequest();
    const active=activeRequest&&String(activeRequest.id)===String(item.id);

    const cardClass=[
      active?"active-request":"",
      isFullyCompleted(item)?"completed-request":"",
      isRejected(item)?"rejected-request":""
    ].filter(Boolean).join(" ");

    let actionButton="";
    if(state.key==="payment_required"){
      actionButton=`<button class="payment-btn" onclick="openPaymentPage('${escapeHtml(item.id)}')">Make Payment</button>`;
    }else if(state.key==="repayment_due"){
      actionButton=`<button class="repayment-btn" onclick="openPaymentPage('${escapeHtml(item.id)}',true)">Pay Remaining</button>`;
    }else if(["payment_pending","payment_rejected","repayment_pending"].includes(state.key)){
      actionButton=`<button class="payment-btn" onclick="openPaymentPage('${escapeHtml(item.id)}',${state.key==="repayment_pending"})">View Payment</button>`;
    }

    const progressClass=progress>=100?"complete":state.key==="repayment_due"?"warning":"";
    const ownerApprovalText=getOwnerApproval(item)||"pending";

    let paymentLabel="";
    let paymentColorClass="payment-pending";
    let paymentIcon="⏳";
    const ownerApproved=isApproved(getOwnerApproval(item));

    if(ownerApproved&&state.key!=="rejected"){
      if(isPaymentVerified(item)){
        paymentLabel="Payment Approved";
        paymentColorClass="payment-approved";
        paymentIcon="✅";
      }else if(isPaymentRejected(item)){
        paymentLabel="Payment Rejected";
        paymentColorClass="payment-rejected";
        paymentIcon="❌";
      }else if(payment.record||payment.status||payment.verification){
        paymentLabel="Payment Verification Pending";
        paymentColorClass="payment-pending";
        paymentIcon="⏳";
      }else if(state.key==="payment_required"){
        paymentLabel="Initial Payment Required";
        paymentColorClass="payment-pending";
        paymentIcon="💳";
      }
    }

    return `
      <div class="request-card ${cardClass}">
        <div class="request-head">
          <div>
            <div class="request-id">${escapeHtml(requestNumber)}</div>
            <div class="request-date">Requested on ${escapeHtml(formatDateTime(requestDate))}</div>
          </div>
          <div class="status ${escapeHtml(state.key)}">${escapeHtml(state.label)}</div>
        </div>

        ${paymentLabel?`
          <div class="payment-status-note ${paymentColorClass}">
            ${paymentIcon} ${escapeHtml(paymentLabel)}
            ${payment.amount>0?" · ₹"+formatMoney(payment.amount):""}
          </div>`:""}

        <div class="request-details">
          <div class="detail"><div class="detail-label">Quantity</div><div class="detail-value">${quantity}</div></div>
          <div class="detail"><div class="detail-label">Request Amount</div><div class="detail-value">₹${formatMoney(amount)}</div></div>
          <div class="detail"><div class="detail-label">Request ID</div><div class="detail-value">${escapeHtml(String(item.id||"").substring(0,8))}</div></div>
          <div class="detail"><div class="detail-label">Owner Approval</div><div class="detail-value">${escapeHtml(ownerApprovalText)}</div></div>
        </div>

        <div class="workflow-box">
          <div class="workflow-title">Request Progress</div>
          <div class="workflow">
            <div class="workflow-step ${getWorkflowClass(item,"request")}"><div class="workflow-dot">1</div><div class="workflow-label">Request</div></div>
            <div class="workflow-step ${getWorkflowClass(item,"payment")}"><div class="workflow-dot">2</div><div class="workflow-label">Payment</div></div>
            <div class="workflow-step ${getWorkflowClass(item,"agency")}"><div class="workflow-dot">3</div><div class="workflow-label">Agency</div></div>
            <div class="workflow-step ${getWorkflowClass(item,"delivery")}"><div class="workflow-dot">4</div><div class="workflow-label">Delivery</div></div>
            <div class="workflow-step ${getWorkflowClass(item,"repayment")}"><div class="workflow-dot">5</div><div class="workflow-label">Repayment</div></div>
          </div>
        </div>

        <div class="delivery-row">
          <div>
            <div class="delivery-label">Current Status</div>
            <div class="delivery-value">${escapeHtml(state.message)}</div>
          </div>
          <div>
            <div class="delivery-label">Delivery</div>
            <div class="delivery-value">${escapeHtml(deliveryDate?formatDate(deliveryDate):getDeliveryText(item))}</div>
          </div>
        </div>

        <div class="progress-wrap">
          <div class="progress-top">
            <div class="progress-label">Request Progress</div>
            <div class="progress-percent">${progress}%</div>
          </div>
          <div class="progress"><div class="progress-bar ${progressClass}" style="width:${progress}%"></div></div>
        </div>

        <div class="request-footer">
          <div class="amount"><span>Remaining</span> ₹${formatMoney(remaining)}</div>
          <div>
            ${actionButton}
            <button class="view-btn" onclick="viewRequest('${escapeHtml(item.id)}')">View Details</button>
          </div>
        </div>
      </div>`;
  }).join("");
}

function openPaymentPage(id,repayment=false){
  if(!id){toast("Request details not found.");return;}
  const params=new URLSearchParams();
  params.set("request_id",id);
  if(repayment)params.set("type","repayment");
  window.location.href="payments.html?"+params.toString();
}

function viewRequest(id){
  const request=currentRequests.find(item=>String(item.id)===String(id));
  if(!request){toast("Request details not found.");return;}
  const state=getOverallState(request);
  const number=getValue(request,["request_number","request_no"],"EGC REQUEST");
  toast(number+" • "+state.label+" • Remaining ₹"+formatMoney(getRemainingAmount(request)));
}

function requestCylinder(){
  const activeRequest=getActiveRequest();
  if(!activeRequest){
    window.location.href="request-cylinder.html";
    return;
  }

  const state=getOverallState(activeRequest);
  if(state.key==="payment_required"){
    openPaymentPage(activeRequest.id);
    return;
  }
  if(state.key==="repayment_due"||state.key==="repayment_pending"){
    openPaymentPage(activeRequest.id,true);
    return;
  }

  toast("Your request "+getValue(activeRequest,["request_number","request_no"],"")+" is still in progress.");
  showInfo(state.message);

  const card=document.querySelector(".active-request");
  if(card)card.scrollIntoView({behavior:"smooth",block:"center"});
}

async function refreshRequests(){
  const button=$("refreshBtn");
  if(button){button.disabled=true;button.textContent="↻ Refreshing...";}
  try{
    clearError();
    await loadRequests();
    if($("errorBox")?.style.display==="none")toast("Requests and payment statuses updated.");
  }catch(error){
    showError(error.message||"Unable to refresh requests.");
  }finally{
    if(button){button.disabled=false;button.textContent="↻ Refresh";}
  }
}

function subscribeRealtime(){
  if(!currentUser?.id||!supabaseClient)return;

  if(realtimeChannel){supabaseClient.removeChannel(realtimeChannel);realtimeChannel=null;}
  if(paymentRealtimeChannel){supabaseClient.removeChannel(paymentRealtimeChannel);paymentRealtimeChannel=null;}

  realtimeChannel=supabaseClient
    .channel("my-requests-"+currentUser.id)
    .on("postgres_changes",{
      event:"*",schema:"public",table:"cylinder_requests",filter:"user_id=eq."+currentUser.id
    },async payload=>{
      try{await loadRequests();}catch(error){console.error(error);}
      if(payload.eventType==="INSERT")toast("New cylinder request added.");
      else if(payload.eventType==="UPDATE"&&payload.new){
        const updatedRequest=currentRequests.find(item=>String(item.id)===String(payload.new.id));
        if(updatedRequest)toast(getOverallState(updatedRequest).message);
      }
    }).subscribe(status=>console.log("My Requests realtime:",status));

  paymentRealtimeChannel=supabaseClient
    .channel("my-payments-"+currentUser.id)
    .on("postgres_changes",{
      event:"*",schema:"public",table:"payments",filter:"user_id=eq."+currentUser.id
    },async payload=>{
      try{await loadRequests();}catch(error){console.error(error);}
      if(payload.eventType==="UPDATE"||payload.eventType==="INSERT")toast("Payment status updated.");
    }).subscribe(status=>console.log("My Payments realtime:",status));
}

function goDashboard(){window.location.href="dashboard.html";}
function goRequests(){window.location.href="my-requests.html";}
function goPayments(){window.location.href="payments.html";}
function goNotifications(){window.location.href="notifications.html";}
function goProfile(){window.location.href="profile.html";}
function goSettings(){window.location.href="setting.html";}
function goHelp(){window.location.href="help-support.html";}

function openLogoutPopup(){
  if($("logoutOverlay")){
    $("logoutOverlay").classList.add("show");
    document.body.style.overflow="hidden";
  }
}

function closeLogoutPopup(event){
  if(event&&event.target&&event.target.id!=="logoutOverlay")return;
  if($("logoutOverlay"))$("logoutOverlay").classList.remove("show");
  document.body.style.overflow="";
}

async function confirmLogout(){
  if(isLoggingOut)return;
  isLoggingOut=true;
  const button=$("confirmLogoutBtn");
  if(button){button.disabled=true;button.textContent="Logging out...";}

  try{
    if(!supabaseClient)throw new Error("Supabase is not available.");
    const {error}=await supabaseClient.auth.signOut();
    if(error)throw error;

    if(realtimeChannel){await supabaseClient.removeChannel(realtimeChannel);realtimeChannel=null;}
    if(paymentRealtimeChannel){await supabaseClient.removeChannel(paymentRealtimeChannel);paymentRealtimeChannel=null;}
    window.location.replace("login.html");
  }catch(error){
    isLoggingOut=false;
    if(button){button.disabled=false;button.textContent="Logout";}
    toast(error.message||"Logout failed.");
  }
}

document.addEventListener("keydown",event=>{
  if(event.key==="Escape")closeLogoutPopup();
});

if(supabaseClient){
  supabaseClient.auth.onAuthStateChange(event=>{
    if(event==="SIGNED_OUT"&&!isLoggingOut){
      if(realtimeChannel){supabaseClient.removeChannel(realtimeChannel);realtimeChannel=null;}
      if(paymentRealtimeChannel){supabaseClient.removeChannel(paymentRealtimeChannel);paymentRealtimeChannel=null;}
      window.location.replace("login.html");
    }
  });
}

async function initializePage(){
  try{
    clearError();
    if(!supabaseClient){
      showError("Supabase client was not loaded. Check the Supabase JS script URL and refresh the page.");
      return;
    }

    const {data,error}=await supabaseClient.auth.getUser();
    if(error||!data?.user){
      window.location.replace("login.html");
      return;
    }

    currentUser=data.user;
    await loadProfile();
    await loadRequests();
    subscribeRealtime();
  }catch(error){
    console.error("My Requests initialization error:",error);
    showError(error.message||"Unable to load My Requests.");
  }
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",initializePage);
}else{
  initializePage();
}
