<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Agency Password | EGC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px 48px;color:#104b7e;background:radial-gradient(ellipse at 8% 5%,rgba(247,218,225,.72),transparent 34%),radial-gradient(ellipse at 96% 8%,rgba(199,229,255,.78),transparent 38%),linear-gradient(135deg,#f3f6fa,#eaf6fc)}
.page{width:100%;max-width:544px}.card{background:rgba(255,255,255,.96);border-radius:0 0 28px 28px;padding:30px 35px 34px;box-shadow:0 18px 48px rgba(22,74,112,.12);text-align:center}
.logo{width:360px;max-width:92%;height:145px;object-fit:contain;margin:0 auto 8px;display:block; margin-bottom:-30px}
h1{font-size:32px;margin:0 0 8px;color:#064d87;font-weight:800}.subtitle{font-size:16px;color:#7890a7;margin:0 0 34px}
.form{text-align:left}label{display:block;font-size:14px;font-weight:700;color:#496a86;margin:0 0 10px}
.input-wrap{position:relative;margin-bottom:22px}input{width:100%;height:56px;border:1px solid #d4e2ee;border-radius:15px;padding:0 54px 0 16px;font-size:16px;color:#173e60;background:#fbfdff;outline:none}
input:focus{border-color:#1680ce;box-shadow:0 0 0 3px rgba(22,128,206,.10)}
.toggle{position:absolute;right:9px;top:8px;width:39px;height:40px;border:0;border-radius:11px;background:#edf7ff;color:#0874bf;font-size:18px;cursor:pointer}
.primary{width:100%;height:57px;border:0;border-radius:15px;margin-top:6px;color:white;font-size:16px;font-weight:800;cursor:pointer;background:linear-gradient(100deg,#0879c9,#075b9f);box-shadow:0 10px 22px rgba(0,104,180,.18)}
.primary:disabled{opacity:.65;cursor:not-allowed}.message{display:none;margin:0 0 18px;padding:13px 14px;border-radius:12px;font-size:14px;line-height:1.5}
.message.error{display:block;background:#fff0f0;border:1px solid #ffd0d0;color:#b42318}.message.success{display:block;background:#eafaf1;border:1px solid #c4efd5;color:#087443}
.back{display:inline-block;margin-top:25px;color:#0876c4;font-size:14px;font-weight:700;text-decoration:none}.hint{font-size:12px;line-height:1.6;color:#8196a9;margin:18px 0 0}
.powered{text-align:center;color:#8299ad;font-size:12px;margin-top:18px}
@media(max-width:520px){body{padding:16px 12px 28px}.card{padding:25px 22px 28px;border-radius:24px}.logo{width:340px;height:130px;max-width:96%;margin-bottom:6px}h1{font-size:27px}.subtitle{font-size:14px;margin-bottom:29px}}
</style>
</head>
<body>
<main class="page">
<section class="card">
<img class="logo" src="assets/EGC%20-%20Emergency%20Gas%20Cylinder%20logo.png" alt="EGC Emergency Gas Cylinder">
<h1>Reset Password</h1>
<p class="subtitle">Create a new password for your LPG agency account</p>
<div id="message" class="message" role="alert"></div>
<form id="resetForm" class="form" autocomplete="on">
<label for="newPassword">New Password</label>
<div class="input-wrap"><input id="newPassword" type="password" placeholder="Enter new password" minlength="6" autocomplete="new-password" required><button class="toggle" type="button" data-target="newPassword" aria-label="Show password">◉</button></div>
<label for="confirmPassword">Confirm New Password</label>
<div class="input-wrap"><input id="confirmPassword" type="password" placeholder="Confirm new password" minlength="8" autocomplete="new-password" required><button class="toggle" type="button" data-target="confirmPassword" aria-label="Show password">◉</button></div>
<button id="submitBtn" class="primary" type="submit">Update Password</button>
</form>
<a class="back" href="agency-login.html">← Back to Agency Login</a>
<p class="hint">Use at least 8 characters. After your password is updated, sign in with your new password.</p>
</section>
<div class="powered">Powered by EGC • Secure Agency Access</div>
</main>
<script>
/* Add the SAME Supabase URL and publishable/anon key used in agency-login.html. */
const SUPABASE_URL = "https://szefvmvokkhvnzryodqu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_S8aSsfmOKN6_7laRfgoMKA_Re2HzRS6";
const messageBox=document.getElementById("message"),form=document.getElementById("resetForm"),submitBtn=document.getElementById("submitBtn");
function showMessage(text,type){messageBox.textContent=text;messageBox.className="message "+type;}
document.querySelectorAll(".toggle").forEach(btn=>btn.addEventListener("click",()=>{const el=document.getElementById(btn.dataset.target);el.type=el.type==="password"?"text":"password";}));
let supabaseClient=null,recoveryReady=false;
async function initializeRecovery(){
 if(!window.supabase?.createClient){showMessage("Supabase library load nahi hui. Internet check karke page reload karein.","error");return;}
 if(!SUPABASE_URL || !SUPABASE_ANON_KEY){showMessage("Supabase configuration missing hai. Agency administrator se sampark karein.","error");return;}
 supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{flowType:"implicit",detectSessionInUrl:true,persistSession:true,autoRefreshToken:true,storageKey:"egc-agency-auth",storage:window.localStorage}});
 const params=new URLSearchParams(location.hash.replace(/^#/,""));
 const accessToken=params.get("access_token"),refreshToken=params.get("refresh_token");
 if(accessToken&&refreshToken){
  const {error}=await supabaseClient.auth.setSession({access_token:accessToken,refresh_token:refreshToken});
  if(error){showMessage("Reset link invalid ya expire ho gaya. Forgot Password se naya link mangwayein.","error");return;}
  recoveryReady=true;showMessage("Recovery link verified. Ab naya password set karein.","success");return;
 }
 const {data,error}=await supabaseClient.auth.getSession();
 if(!error&&data.session){recoveryReady=true;showMessage("Recovery session mil gaya. Ab naya password set karein.","success");}
 else showMessage("Reset link missing ya expire ho gaya. Agency Login par Forgot Password se naya link mangwayein.","error");
}
form.addEventListener("submit",async e=>{
 e.preventDefault();
 const password=document.getElementById("newPassword").value,confirm=document.getElementById("confirmPassword").value;
 if(password.length<6){showMessage("Password kam se kam 8 characters ka hona chahiye.","error");return;}
 if(password!==confirm){showMessage("Dono passwords match nahi kar rahe.","error");return;}
 if(!supabaseClient||!recoveryReady){showMessage("Valid reset session nahi mila. Email se latest reset link open karein.","error");return;}
 submitBtn.disabled=true;submitBtn.textContent="Updating Password...";
 const {error}=await supabaseClient.auth.updateUser({password});
 if(error){showMessage(error.message||"Password update nahi ho paya.","error");submitBtn.disabled=false;submitBtn.textContent="Update Password";return;}
 showMessage("Password successfully update ho gaya. Agency Login par bheja ja raha hai...","success");form.reset();
 history.replaceState({},document.title,location.pathname);
 setTimeout(()=>location.href="agency-login.html?password_reset=success",1800);
});
initializeRecovery();
</script>
</body>
</html>
